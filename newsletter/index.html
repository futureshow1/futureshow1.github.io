<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nowy rozdział — list FutureShow raz w miesiącu</title>
<meta name="description" content="Raz w miesiącu: co nowego na futureshow.pl, jeden rozdział do obejrzenia dziś wieczorem, jedna rzecz zza kulis. Bez reklam, bez śledzenia, wypisanie jednym kliknięciem.">
<link rel="canonical" href="https://futureshow.pl/newsletter/">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:title" content="Nowy rozdział — list FutureShow"><meta property="og:description" content="Raz w miesiącu: co nowego, jeden rozdział na wieczór, jedna rzecz zza kulis. Bez reklam i śledzenia."><meta property="og:url" content="https://futureshow.pl/newsletter/"><meta property="og:image" content="https://futureshow.pl/og-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--bg2:#0a0e17;--ink:#e9edf5;--dim:#aab4c6;--faint:#7a8499;--cyan:#6fd6ff;--green:#3ddc97;--red:#ff6b6b;--line:rgba(233,237,245,.1);--sans:'Inter','Helvetica Neue',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;gap:18px;padding:16px 4vw;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.04em}.logo span{color:var(--cyan)}
.spacer{flex:1}
.langbtn{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
main{max-width:720px;margin:0 auto;padding:56px 4vw 80px}
.kick{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
h1{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.lede{color:var(--dim);margin:18px 0 30px;line-height:1.6;font-size:16px}
ul.what{list-style:none;display:grid;gap:10px;margin-bottom:34px}
ul.what li{padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;line-height:1.5;color:var(--dim)}
ul.what li b{color:var(--ink);display:block;font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
form{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=email]{flex:1;min-width:220px;background:#0d1320;border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;padding:13px 14px}
input[type=email]:focus{outline:none;border-color:var(--cyan)}
button[type=submit]{background:var(--cyan);color:#05070c;border:0;border-radius:10px;font:inherit;font-weight:700;font-size:14px;padding:13px 20px;cursor:pointer}
button[type=submit]:disabled{opacity:.6;cursor:default}
.langs{display:flex;gap:16px;margin:14px 0 4px;font-size:13.5px;color:var(--dim)}
.langs label{display:inline-flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:13.5px;margin:0;cursor:pointer}
.status{margin-top:12px;font-size:13.5px;min-height:1.4em}
.status.ok{color:var(--green)}.status.err{color:var(--red)}
.fine{margin-top:14px;font-size:12px;color:var(--faint);line-height:1.5}
.issue{margin-top:40px;padding-top:26px;border-top:1px solid var(--line);color:var(--dim);font-size:14px;line-height:1.6}
.issue b{color:var(--ink)}
footer{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;padding:30px 4vw;border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav><a class="logo" href="../">FUTURE<span>SHOW</span></a><div class="spacer"></div><button class="langbtn" id="langbtn">EN</button></nav>
<main>
  <div class="kick" data-i="kick"></div>
  <h1 data-i="h1"></h1>
  <p class="lede" data-i="lede"></p>
  <ul class="what" id="what"></ul>
  <form id="nl" novalidate>
    <input type="hidden" name="access_key" value="41c76e7b-9154-4f68-a910-e76ae4d498f4">
    <input type="hidden" name="subject" id="subj" value="[LISTA] Newsletter „Nowy rozdział” — zapis">
    <input type="hidden" name="from_name" value="futureshow.pl / newsletter">
    <input type="hidden" name="jezyk" id="jezyk" value="pl">
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
    <label for="email" data-i="label"></label>
    <div class="row"><input id="email" name="email" type="email" required placeholder="jan@example.com" autocomplete="email"><button type="submit" id="btn" data-i="btn"></button></div>
    <div class="langs"><span data-i="langq"></span><label><input type="radio" name="wersja" value="pl" checked> polski</label><label><input type="radio" name="wersja" value="en"> English</label></div>
    <div class="status" id="status" role="status"></div>
    <p class="fine" data-i="fine"></p>
  </form>
  <div class="issue"><b data-i="i_t"></b><br><span data-i="i_b"></span></div>
</main>
<footer><a href="../" data-i="back"></a></footer>
<script>
const UI={
 pl:{kick:"List · raz w miesiącu",h1:"Nowy rozdział",
  lede:"Krótki list z futureshow.pl, zawsze w tym samym układzie. Bez reklam, bez mierzenia otwarć i kliknięć. Wypisanie jednym kliknięciem, od razu.",
  what:[["Co nowego","Nowe portale, rozdziały i aktualizacje z ostatniego miesiąca, w trzech akapitach."],["Jeden rozdział na dziś wieczór","Jedna rzecz do obejrzenia albo posłuchania, z krótkim wprowadzeniem: dlaczego warto i ile to zajmie."],["Z pracowni","Jedna rzecz, która właśnie powstaje: nowy rozdział, nowa funkcja albo nagranie odnalezione w archiwach, zanim trafi na stronę."]],
  label:"Twój e-mail",btn:"Zapisz mnie",langq:"Wersja listu:",
  fine:"Adres trafia prosto do nas i służy wyłącznie do wysyłki tego listu. Pierwszy numer wychodzi pod koniec października 2026. Zgodę możesz cofnąć w każdym liście (link na dole) albo mailem na futureshow@proton.me.",
  ok:"Dziękujemy. Jesteś na liście; pierwszy list przyjdzie pod koniec miesiąca.",err:"Nie udało się zapisać. Spróbuj jeszcze raz albo napisz na futureshow@proton.me.",bad:"Wpisz poprawny adres e-mail.",
  i_t:"Numer 1, październik 2026",i_b:"Premiera Sejm Symulatora, Słuchowiska dla dzieci, Kino nieme, wszystko po angielsku, rozdział o polskim kinie niemym na wieczór i nowa wyszukiwarka po 2 800 filmach i nagraniach.",back:"← futureshow.pl"},
 en:{kick:"Letter · once a month",h1:"New Chapter",
  lede:"A short letter from futureshow.pl, always in the same shape. No ads, no open or click tracking. Unsubscribe with one click, instantly.",
  what:[["What's new","New portals, chapters and updates from the past month, in three paragraphs."],["One chapter for tonight","One thing to watch or listen to, with a short introduction: why it matters and how long it takes."],["From the studio","One thing in the making: a new chapter, a new feature or a recording found in the archives, before it goes live."]],
  label:"Your e-mail",btn:"Sign me up",langq:"Letter language:",
  fine:"Your address goes straight to us and is used only to send this letter. The first issue goes out at the end of October 2026. Withdraw consent in any letter (link at the bottom) or by e-mail to futureshow@proton.me.",
  ok:"Thank you. You are on the list; the first letter arrives at the end of the month.",err:"Sign-up failed. Please try again or write to futureshow@proton.me.",bad:"Please enter a valid e-mail address.",
  i_t:"Issue 1, October 2026",i_b:"Sejm Simulator launch, audio stories for children, Silent Cinema, everything in English, the Polish School of animation for tonight, and a new search across 2,800 films and recordings.",back:"← futureshow.pl/en/"}
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LANG=(new URLSearchParams(location.search).get("lang"))||store.get("fs-lang")||store.get("lang")||"pl"; if(LANG!=="en")LANG="pl";
function render(){const t=UI[LANG];document.documentElement.lang=LANG;document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]||"");
 document.getElementById("langbtn").textContent=LANG==="pl"?"EN":"PL";
 document.getElementById("what").innerHTML=t.what.map(([a,b])=>`<li><b>${a}</b>${b}</li>`).join("");
 document.querySelector(`input[name=wersja][value=${LANG}]`).checked=true;}
document.getElementById("langbtn").onclick=()=>{LANG=LANG==="pl"?"en":"pl";store.set("fs-lang",LANG);store.set("lang",LANG);render();};
render();
const f=document.getElementById("nl"),st=document.getElementById("status");
f.addEventListener("submit",e=>{e.preventDefault();const t=UI[LANG];const em=f.email.value.trim();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){st.className="status err";st.textContent=t.bad;return}
 const w=f.querySelector("input[name=wersja]:checked").value;document.getElementById("jezyk").value=w;
 document.getElementById("subj").value="[LISTA] Newsletter „Nowy rozdział” — zapis ("+w.toUpperCase()+")";
 const b=document.getElementById("btn");b.disabled=true;const fd=new FormData(f);fd.set("name",em);
 fetch("https://api.web3forms.com/submit",{method:"POST",headers:{Accept:"application/json"},body:fd}).then(r=>r.json()).then(d=>{if(!d.success)throw 0;st.className="status ok";st.textContent=t.ok;f.email.value=""}).catch(()=>{st.className="status err";st.textContent=t.err}).finally(()=>{b.disabled=false});});
</script>
<script data-goatcounter="https://futureshow.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
