<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181c14">
<title>FutureForm — trener sprawdzianu sprawności</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">Future<em>Form</em></span><span id="app-tag" class="tag"></span></div>
  <div class="hdr-btns">
    <button id="btn-lang" class="hbtn" title="PL/EN">PL·EN</button>
    <button id="btn-settings" class="hbtn" title="Ustawienia">⚙</button>
  </div>
</header>
<main id="main"></main>
<nav>
  <button class="nav-btn" data-view="today"><i>◉</i><span></span></button>
  <button class="nav-btn" data-view="plan"><i>▤</i><span></span></button>
  <button class="nav-btn" data-view="test"><i>✓</i><span></span></button>
  <button class="nav-btn" data-view="progress"><i>↗</i><span></span></button>
  <button class="nav-btn" data-view="health"><i>♥</i><span></span></button>
  <button class="nav-btn" data-view="info"><i>ℹ</i><span></span></button>
</nav>
<div id="onboarding" class="overlay hidden"></div>
<div id="modal" class="overlay hidden"></div>
<script src="js/norms-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/exercises.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script data-goatcounter="https://futureshow.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
