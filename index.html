<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FutureShow — Baw się wiedzą: portale, śledztwa, gry, aplikacje</title>
<meta name="description" content="FutureShow: interaktywne portale wiedzy, śledztwa danych, gry edukacyjne, symulacje i darmowe aplikacje. Przeglądaj jak w serwisie streamingowym.">
<link rel="canonical" href="https://futureshow.pl/">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Katalog interaktywnych portali, symulacji i śledztw studia FutureShow — przeglądaj jak w serwisie streamingowym.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305070c'/%3E%3Ctext x='32' y='42' font-family='Helvetica' font-size='26' font-weight='800' fill='%236fd6ff' text-anchor='middle'%3EFS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
/* ============ FutureShow studio tokens ============ */
:root{
  --bg:#05070c; --bg2:#0a0e17; --panel:rgba(5,7,12,.82);
  --ink:#e9edf5; --dim:#aab4c6; --faint:#7a8499;
  --cyan:#6fd6ff; --purple:#a78bfa; --green:#3ddc97; --yellow:#f2c94c; --red:#ff6b6b;
  --line:rgba(233,237,245,.08);
  --sans:'Inter','Helvetica Neue',sans-serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --disp:'Archivo Black','Arial Black',sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--cyan);color:#05070c}

/* ============ nav ============ */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;
  gap:22px;padding:14px 4vw;background:linear-gradient(to bottom,rgba(5,7,12,.92),rgba(5,7,12,0));
  transition:background .3s}
nav.solid{background:var(--panel);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.logo span{color:var(--cyan)}
.navlinks{display:flex;gap:18px;font-size:13.5px;color:var(--dim)}
.navlinks a:hover{color:var(--ink)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:rgba(233,237,245,.06);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.search input{background:none;border:none;outline:none;color:var(--ink);
  font-family:var(--mono);font-size:12.5px;width:150px}
.search input::placeholder{color:var(--faint)}
.langbtn,.ctc{font-family:var(--mono);font-size:12px;letter-spacing:.05em;
  background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:8px;padding:8px 13px;transition:.2s}
.langbtn:hover{color:var(--ink);border-color:var(--faint)}
.ctc{background:var(--cyan);color:#05131c;border-color:var(--cyan);font-weight:500}
.ctc:hover{filter:brightness(1.1)}

/* ============ hero (photo slideshow, multi-image per project) ============ */
.hero{position:relative;min-height:86vh;overflow:hidden}
.h-track{display:flex;height:100%;min-height:86vh;touch-action:pan-y;
  transition:transform .65s cubic-bezier(.77,0,.18,1);will-change:transform}
.h-track.drag{transition:none}
.h-slide{flex:0 0 100%;min-width:100%;position:relative;display:flex;
  align-items:flex-end;padding:120px 4vw 74px;min-height:86vh}
.h-bgs{position:absolute;inset:0;overflow:hidden}
.h-bgs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 28%;opacity:0;transition:opacity 1.2s ease}
.h-bgs img.cur{opacity:1}
.h-slide.act .h-bgs img.cur{animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.11) translate(-1.4%,.8%)}}
.h-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:52px;height:84px;
  border:none;border-radius:10px;background:rgba(5,7,12,.45);backdrop-filter:blur(4px);
  color:#e9edf5;font-size:26px;cursor:pointer;transition:.2s;opacity:.55}
.h-arr:hover{opacity:1;background:rgba(5,7,12,.75)}
.h-arr--l{left:14px}.h-arr--r{right:14px}
@media(max-width:760px){
 .h-arr{width:38px;height:60px;font-size:22px;opacity:.5;background:rgba(5,7,12,.5)}
 .h-arr--l{left:6px}.h-arr--r{right:6px}
 .h-dots{right:auto;left:0;width:100%;justify-content:center;bottom:16px;gap:4px;
   padding:10px 10px;flex-wrap:wrap;max-width:100%;box-sizing:border-box}
 .h-dot{width:14px;height:4px}
}
.hero-shade{position:absolute;inset:0;background:
  linear-gradient(to right,rgba(3,4,8,.9) 0%,rgba(3,4,8,.6) 42%,rgba(3,4,8,.2) 72%,rgba(3,4,8,.45) 100%),
  linear-gradient(to top,#05070c 3%,rgba(5,7,12,.32) 34%,rgba(5,7,12,.15) 60%,rgba(5,7,12,.55) 100%)}
.hero-inner{position:relative;z-index:2;max-width:760px;margin-right:60px}
.h-kick{font-family:var(--mono);font-size:13px;letter-spacing:.28em;
  text-transform:uppercase;margin-bottom:18px;text-shadow:0 1px 12px rgba(0,0,5,.8)}
.h-title{font-weight:800;font-size:clamp(2.5rem,5.6vw,4.4rem);line-height:1.02;
  letter-spacing:-.02em;text-shadow:0 2px 26px rgba(0,0,5,.78)}
.h-title .serif{font-family:var(--serif);font-weight:600}
.h-title .disp{font-family:var(--disp);font-weight:400;letter-spacing:0}
.h-lede{color:#dee3ec;font-size:17px;line-height:1.55;max-width:560px;
  margin-top:20px;text-shadow:0 1px 14px rgba(0,0,5,.9)}
.h-stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.h-stat{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:#dee3ec;
  border:1px solid rgba(233,237,245,.22);border-radius:999px;padding:7px 14px;
  background:rgba(5,7,12,.46);backdrop-filter:blur(4px)}
.h-ctas{display:flex;gap:12px;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
  border-radius:9px;padding:13px 26px;border:none;transition:.2s}
.btn-play{background:var(--ink);color:#05070c}
.btn-play:hover{background:#fff}
.btn-info{background:rgba(15,20,30,.55);color:var(--ink);backdrop-filter:blur(6px);
  border:1px solid rgba(233,237,245,.22)}
.btn-info:hover{background:rgba(30,38,54,.7)}
.h-dots{position:absolute;right:4vw;bottom:78px;z-index:3;display:flex;gap:8px}
.h-dot{width:26px;height:3px;border-radius:2px;background:rgba(233,237,245,.25);
  border:none;transition:.3s;padding:0}
.h-dot.on{background:var(--ink)}

/* ============ rails ============ */
main{position:relative;z-index:2;padding:10px 0 30px}
.rail{margin:34px 0}
.rail-head{display:flex;align-items:baseline;gap:16px;padding:0 4vw;margin-bottom:14px}
.rail-title{font-size:19px;font-weight:700;letter-spacing:-.01em}
.rail-count{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.rail-nav{margin-left:auto;display:flex;gap:8px}
.rarr{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  background:rgba(233,237,245,.04);color:var(--dim);font-size:15px;transition:.2s}
.rarr:hover{color:var(--ink);border-color:var(--faint)}
.row{display:flex;gap:16px;overflow-x:auto;padding:6px 4vw 22px;
  scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}

/* card + poster (photo fades in on hover) */
.card{flex:0 0 auto;width:198px;scroll-snap-align:start;position:relative;
  transition:transform .28s ease,z-index 0s .1s;cursor:pointer;border:none;
  background:none;text-align:left;color:var(--ink)}
.card:hover{transform:scale(1.07) translateY(-6px);z-index:5}
.poster{aspect-ratio:2/3;border-radius:11px;overflow:hidden;position:relative;
  border:1px solid rgba(233,237,245,.09);
  box-shadow:0 8px 26px rgba(0,0,5,.45)}
.card:hover .poster{border-color:rgba(233,237,245,.25);
  box-shadow:0 18px 44px rgba(0,0,5,.65)}
.poster svg{position:absolute;inset:0;width:100%;height:100%}
.c-photo{position:absolute;inset:0;opacity:0;transition:opacity .35s}
.c-photo.always{opacity:1}
.c-photo img{width:100%;height:100%;object-fit:cover}
.c-photo.band{inset:0 0 auto 0;aspect-ratio:16/9;border-bottom:1px solid rgba(233,237,245,.12);box-shadow:0 10px 30px rgba(0,0,5,.5)}
.c-photo.band img{object-fit:cover}
.card:hover .c-photo.band ~ .p-title,.card:hover .c-photo.band ~ .p-year{opacity:0}
.card:hover .c-photo{opacity:1}
.p-kick{position:absolute;top:13px;left:14px;right:14px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;z-index:2;
  text-shadow:0 1px 8px rgba(0,0,5,.5)}
.p-title{position:absolute;left:14px;right:14px;bottom:34px;line-height:1.04;
  font-size:22px;z-index:2}
.card:hover .p-title,.card:hover .p-kick{text-shadow:0 1px 10px rgba(0,0,5,.9)}
/* zdjęcie na całą kartę bywa jasne — przyciemnienie pod tytułem, żeby dało się go czytać */
.c-photo:not(.band)::after{content:"";position:absolute;inset:auto 0 0 0;height:56%;
  background:linear-gradient(to top,rgba(3,4,8,.92) 6%,rgba(3,4,8,.55) 42%,transparent);
  pointer-events:none}
.card:hover .p-title{color:#fff!important}
.p-year{position:absolute;left:14px;bottom:12px;font-family:var(--mono);
  font-size:10px;letter-spacing:.06em;opacity:.65;z-index:2}
.c-over{position:absolute;inset:auto 0 0 0;padding:44px 14px 12px;border-radius:0 0 11px 11px;
  background:linear-gradient(to top,rgba(3,4,8,.95) 40%,transparent);
  opacity:0;transition:.25s;pointer-events:none;z-index:3}
.card:hover .c-over{opacity:1}
.c-desc{font-size:11.5px;line-height:1.4;color:#c9d0dc;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-open{margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
  color:var(--cyan)}

/* ============ studio section ============ */
.studio{margin:70px 4vw 30px;border:1px solid var(--line);border-radius:16px;
  padding:44px 46px;background:
  radial-gradient(ellipse 60% 120% at 85% 0%,rgba(111,214,255,.07),transparent),
  var(--bg2)}
.s-kick{font-family:var(--mono);font-size:12px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--cyan)}
.s-title{font-size:30px;font-weight:800;letter-spacing:-.015em;margin-top:14px}
.s-lede{color:var(--dim);font-size:15.5px;line-height:1.6;max-width:660px;margin-top:14px}
.s-trust{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.s-chip{font-family:var(--mono);font-size:11.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.s-ctas{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}

/* ============ footer ============ */
footer{padding:34px 4vw 44px;display:flex;gap:20px;flex-wrap:wrap;
  justify-content:space-between;font-family:var(--mono);font-size:11.5px;
  color:var(--faint);border-top:1px solid var(--line)}
footer a{color:var(--dim)} footer a:hover{color:var(--ink)}

/* ============ modal (photo slideshow banner) ============ */
.mback{position:fixed;inset:0;z-index:80;background:rgba(3,4,8,.78);
  backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:6vh 18px}
.mback.open{display:flex}
.modal{width:min(760px,100%);background:var(--bg2);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.m-banner{position:relative;height:330px;background:#000}
.m-banner svg{position:absolute;inset:0;width:100%;height:100%}
.m-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 30%;opacity:0;transition:opacity .9s ease}
.m-banner img.cur{opacity:1}
.m-shade{position:absolute;inset:0;background:
  linear-gradient(to top,rgba(6,8,14,.95) 6%,rgba(6,8,14,.2) 50%,rgba(6,8,14,.35) 100%)}
.m-banner .p-title{font-size:40px;bottom:22px;left:30px;right:30px;
  text-shadow:0 2px 18px rgba(0,0,5,.85)}
.m-banner .p-kick{top:22px;left:30px;text-shadow:0 1px 10px rgba(0,0,5,.85)}
.m-dots{position:absolute;right:22px;bottom:26px;z-index:4;display:flex;gap:6px}
.m-dot{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);
  border:none;transition:.3s;padding:0}
.m-dot.on{background:#fff}
.m-close{position:absolute;top:16px;right:16px;width:38px;height:38px;z-index:4;
  border-radius:50%;border:none;background:rgba(3,4,8,.6);color:#fff;font-size:16px}
.m-body{padding:28px 30px 32px}
.m-tag{display:inline-block;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;border-radius:5px;padding:4px 10px;
  margin-bottom:14px}
.m-desc{color:var(--dim);font-size:15px;line-height:1.6}
.m-stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.m-stat{font-family:var(--mono);font-size:12px;color:var(--dim);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px}
.m-ctas{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.m-note{margin-top:18px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}

/* ============ responsive ============ */
@media(max-width:760px){
  .navlinks,.rail-nav{display:none}
  .search input{width:92px}
  .card{width:150px}
  .p-title{font-size:17px;bottom:30px}
  .hero{min-height:74vh;padding-bottom:56px}
  .studio{padding:30px 24px}
  .m-banner{height:220px}
  .m-banner .p-title{font-size:27px}
}
@media(prefers-reduced-motion:reduce){
  .card,.card:hover{transition:none;transform:none}
  .hero-bg.on img.cur{animation:none}
}
.sburger{display:none;background:none;border:1px solid var(--line);color:var(--ink,#e9edf5);font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer}
.nav-contact-m{display:none}
@media(max-width:760px){.sburger{display:inline-flex;align-items:center;justify-content:center}.ctc{display:none}.nav-contact-m{display:block;color:var(--cyan,#6fd6ff)}
 #nav.open .navlinks{display:flex;flex-direction:column;position:fixed;top:56px;left:0;right:0;background:#0b0d17;border-bottom:1px solid var(--line);padding:10px 18px 14px;gap:0;z-index:60}
 #nav.open .navlinks a{padding:12px 0;font-size:15px}}
.hidden{display:none!important}

.v-frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px 12px 0 0;overflow:hidden}
.v-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.v-locked{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:0 28px;
  background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(197,140,255,.10),transparent 65%),#0d0b14}
.v-lock-ico{font-size:34px;color:#c58cff;opacity:.85}
.v-locked p{color:#cbd2de;font-size:15px;line-height:1.5;max-width:420px;margin:0}

/* ═══ zaproszenie do darmowych aplikacji ═══ */
.appnudge{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(3,4,8,.72);backdrop-filter:blur(5px)}
.appnudge.on{display:flex}
.an-box{position:relative;width:min(560px,100%);max-height:88vh;overflow-y:auto;
  background:linear-gradient(160deg,#0d1220 0%,#080b12 70%);
  border:1px solid var(--line);border-radius:16px;padding:30px 28px 26px;
  box-shadow:0 30px 90px rgba(0,0,5,.7)}
.an-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--green);margin-bottom:10px}
.an-box h3{font-size:26px;line-height:1.12;margin:0 0 8px;color:var(--ink);font-weight:800;letter-spacing:-.01em}
.an-lede{color:var(--dim);font-size:14.5px;line-height:1.55;margin:0 0 20px}
.an-list{display:grid;gap:9px;margin-bottom:20px}
.an-item{display:flex;gap:13px;align-items:center;text-decoration:none;
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;transition:.2s;background:rgba(233,237,245,.02)}
.an-item:hover{border-color:rgba(233,237,245,.24);background:rgba(233,237,245,.06);transform:translateY(-1px)}
.an-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.an-txt{min-width:0}
.an-txt b{display:block;color:var(--ink);font-size:14.5px;font-weight:700}
.an-txt span{display:block;color:var(--faint);font-size:12px;font-family:var(--mono);margin-top:2px}
.an-go{margin-left:auto;color:var(--faint);font-size:15px;flex:0 0 auto}
.an-item:hover .an-go{color:var(--ink)}
.an-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-all{color:var(--cyan);text-decoration:none;font-size:13.5px;font-weight:600}
.an-all:hover{text-decoration:underline}
.an-later{margin-left:auto;background:none;border:none;color:var(--faint);font-size:13px;cursor:pointer;padding:6px 2px}
.an-later:hover{color:var(--dim)}
.an-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:9px;
  background:rgba(233,237,245,.06);border:1px solid var(--line);color:var(--dim);
  font-size:15px;cursor:pointer;line-height:1}
.an-x:hover{color:var(--ink);background:rgba(233,237,245,.12)}
@media(max-width:560px){.an-box{padding:26px 20px 22px}.an-box h3{font-size:22px}}
@media(prefers-reduced-motion:reduce){.an-item{transition:none}}
</style>
</head>
<body>

<nav id="nav">
  <a class="logo" href="./">FUTURE<span>SHOW</span></a>
  <div class="navlinks">
    <a href="studio/" data-i="nav_home"></a>
    <a href="#r-new" data-i="nav_new"></a>
    <a href="#r-data" data-i="nav_data"></a>
    <a href="#r-learn" data-i="nav_learn"></a>
    <a href="#r-apps" data-i="nav_apps"></a>
    <a href="#studio" data-i="nav_studio"></a>
    <a class="nav-contact-m" href="studio/#contact" data-i="nav_contact"></a>
  </div>
  <div class="spacer"></div>
  <button class="sburger" id="sburger" aria-label="Menu">☰</button>
  <div class="search">◉ <input id="q" autocomplete="off"></div>
  <button class="langbtn" id="langbtn">EN</button>
  <a class="ctc" href="studio/#contact" data-i="nav_contact"></a>
</nav>

<header class="hero" id="hero"></header>
<main id="rails"></main>

<section class="studio" id="studio">
  <div class="s-kick" data-i="s_kick"></div>
  <h2 class="s-title" data-i="s_title"></h2>
  <p class="s-lede" data-i="s_lede"></p>
  <div class="s-trust" id="trust"></div>
  <div class="s-ctas">
    <a class="btn btn-play" href="mailto:futureshow@proton.me" data-i="s_cta1"></a>
    <a class="btn btn-info" href="studio/#contact" data-i="s_cta2"></a>
  </div>
</section>

<footer>
  <span>FUTURESHOW · Jan Lubicz-Przyłuski · futureshow@proton.me</span>
  <span data-i="f_priv"></span>
</footer>


<div class="appnudge" id="appNudge" role="dialog" aria-modal="true" aria-labelledby="anTitle">
  <div class="an-box">
    <button class="an-x" id="anClose" aria-label="Zamknij">✕</button>
    <div class="an-kick" id="anKick"></div>
    <h3 id="anTitle"></h3>
    <p class="an-lede" id="anLede"></p>
    <div class="an-list" id="anList"></div>

     fill="${(t+r)%5===2?a:i}" opacity="${(t+r)%5===2?1:.4}"/>`}}

 if(k==="net"||k==="rhizome"){const n=[[35,60],[95,38],[160,66],[62,120],[132,112],[172,150],[40,170]];

 if(k==="ctx"){return sv(`

 if(k==="lines"){const w=[118,86,132,64,104,58,94];let d="";

 return sv("");

/* tekst do wyszukiwarki: bez ogonków, żeby „pokepedia" i „pokemon" trafiały w POKÉPEDIĘ */
function bezOgonkow(t){
 return String(t||"").toLowerCase().replace(/ł/g,"l")
   .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function szukajka(k){
 const p=P[k]; if(!p) return "";
 const czesci=[p.t, p.kick&&p.kick.pl, p.kick&&p.kick.en, p.tag&&p.tag.pl, p.tag&&p.tag.en,
   p.d&&p.d.pl, p.d&&p.d.en, (p.stats||[]).join(" "), p.year, KEYS[k]];
 return bezOgonkow(czesci.filter(Boolean).join(" ")).replace(/"/g,"");
}

let heroIx=0, heroTimer=null, heroImgTimer=null;

 h.innerHTML = `<div class="h-track" id="htrack" style="transform:translateX(-${heroIx*100}%)">${slides}</div>
  <button class="h-arr h-arr--l" data-hnav="-1" aria-label="poprzedni">‹</button>
  <button class="h-arr h-arr--r" data-hnav="1" aria-label="następny">›</button>
  <div class="h-dots">${FEATURED.map((_,ix)=>
   `<button class="h-dot ${ix===heroIx?"on":""}" data-goto="${ix}" aria-label="slajd ${ix+1}"></button>`).join("")}</div>`;

function heroGo(ix){
 heroIx=(ix+FEATURED.length)%FEATURED.length;
 const tr=document.getElementById("htrack");
 if(tr)tr.style.transform=`translateX(-${heroIx*100}%)`;
 document.querySelectorAll(".h-slide").forEach(b=>b.classList.toggle("act",+b.dataset.ix===heroIx));
 document.querySelectorAll(".h-dot").forEach(b=>b.classList.toggle("on",+b.dataset.goto===heroIx));}
function heroSwipe(){
 const tr=document.getElementById("htrack"); if(!tr||tr.dataset.swipe)return;
 tr.dataset.swipe="1";
 let x0=0,y0=0,dx=0,drag=false,lock=null,w=1;
 const at=()=>-heroIx*w;
 tr.addEventListener("touchstart",e=>{
   if(e.touches.length!==1)return;
   const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; lock=null;
   w=tr.getBoundingClientRect().width||1; drag=true;
   clearInterval(heroTimer); clearInterval(heroImgTimer);
 },{passive:true});
 tr.addEventListener("touchmove",e=>{
   if(!drag||e.touches.length!==1)return;
   const t=e.touches[0]; const ax=t.clientX-x0, ay=t.clientY-y0;
   if(lock===null){
     if(Math.abs(ax)<6&&Math.abs(ay)<6)return;
     lock=Math.abs(ax)>Math.abs(ay)?"x":"y";
     if(lock==="x")tr.classList.add("drag");
   }
   if(lock!=="x")return;
   dx=ax;
   /* opor na krancach */
   if((heroIx===0&&dx>0)||(heroIx===FEATURED.length-1&&dx<0))dx*=.35;
   tr.style.transform=`translateX(${at()+dx}px)`;
 },{passive:true});
 const end=()=>{
   if(!drag)return; drag=false; tr.classList.remove("drag");
   const moved=lock==="x"?dx:0; dx=0;
   if(Math.abs(moved)>Math.min(70,w*.14))heroGo(heroIx+(moved<0?1:-1));
   else heroGo(heroIx);
   heroAuto();
 };
 tr.addEventListener("touchend",end,{passive:true});
 tr.addEventListener("touchcancel",end,{passive:true});
}
function heroAuto(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 clearInterval(heroTimer);heroTimer=setInterval(()=>heroGo(heroIx+1),9000);
 /* wewnętrzny fade zdjęć aktywnego slajdu */
 clearInterval(heroImgTimer);heroImgTimer=setInterval(()=>{

/* ================= modal (banner-slideshow) ================= */
let modalTimer=null;
function openPlayer(k){
 const p=P[k], v=p.video, m=document.getElementById("modal");
 const url = v.src==="vimeo"
   ? `https://player.vimeo.com/video/${v.id}?title=0&byline=0&portrait=0&dnt=1`
   : `https://www.youtube-nocookie.com/embed/${v.id}?rel=0&modestbranding=1`;
 const ext = v.src==="vimeo" ? `https://vimeo.com/${v.id}` : `https://www.youtube.com/watch?v=${v.id}`;
 const extLabel = v.src==="vimeo" ? "Vimeo" : "YouTube";
 const locked = !!v.lock;
 const frame = locked
  ? `<div class="v-locked"><div class="v-lock-ico">◍</div>
     <p>${LANG==="pl"?"Film jest zgłoszony na festiwale, więc na razie nie gramy go publicznie."
                     :"The film is under festival submission, so it is not played publicly yet."}</p>
     <a class="btn btn-play" href="mailto:futureshow@proton.me?subject=${encodeURIComponent("Dostęp do filmu: "+p.t)}">
      ${LANG==="pl"?"✉ Poproś o dostęp":"✉ Request access"}</a></div>`
  : `<iframe src="${url}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin" title="${p.t}"></iframe>`;
 m.innerHTML=`
  <div class="v-frame">${frame}<button class="m-close" id="mclose">✕</button></div>
  <div class="m-body">
   <div class="p-kick" style="color:${p.pal.acc};position:static;margin-bottom:6px">${p.kick[LANG]}</div>
   <div class="p-title" style="position:static;color:#fff;font-size:1.5rem;margin-bottom:10px">${p.t}</div>
   <div class="m-stats">${p.stats.map(x=>`<span class="m-stat">${x}</span>`).join("")}</div>
   <p class="m-desc">${p.d[LANG]}</p>
   ${locked?"":`<div class="m-ctas">
     <a class="btn btn-info" href="${ext}" target="_blank" rel="noopener">${LANG==="pl"?"Otwórz na":"Open on"} ${extLabel} ↗</a>
   </div>`}
  </div>`;
 document.getElementById("mback").classList.add("open");
 document.body.style.overflow="hidden";
 document.getElementById("mclose").onclick=closeModal;
}
function openModal(k){
 const p=P[k], m=document.getElementById("modal"), g=gal(k);
 if(p.video){ return openPlayer(k); }
 const banner = g.length
  ? g.map((u,j)=>`<img src="${u}" class="${j===0?"cur":""}" alt="">`).join("")
    +`<div class="m-shade"></div>`
    +(g.length>1?`<div class="m-dots">${g.map((_,j)=>
      `<button class="m-dot ${j===0?"on":""}" data-mgoto="${j}"></button>`).join("")}</div>`:"")
  : posterHTML(k);
 const tStyle=`color:#fff;font-family:${fontFor(p.font)};font-weight:${wFor(p.font)};`+
   (p.font==="disp"?"text-transform:uppercase;":"");
 const credit=CREDIT[k]?`<div class="m-note">${CREDIT[k][LANG]}</div>`:"";
 const contact=!p.link?`<div class="m-note">${LANG==="pl"?"Zamówienia i demo":"Commissions & demos"}:
  <a href="mailto:futureshow@proton.me" style="color:var(--cyan)">futureshow@proton.me</a></div>`:"";
 m.innerHTML=`
  <div class="m-banner">${banner}
   ${g.length?`<div class="p-kick" style="color:${p.pal.acc}">${p.kick[LANG]}</div>
   <div class="p-title" style="${tStyle}">${p.t}</div>`:""}
   <button class="m-close" id="mclose">✕</button></div>
  <div class="m-body">
   <span class="m-tag" style="background:${p.pal.acc}22;color:${p.pal.acc};border:1px solid ${p.pal.acc}55">${p.tag[LANG]}</span>
   <p class="m-desc">${p.d[LANG]}</p>
   <div class="m-stats">${p.stats.map(s=>`<span class="m-stat">${s}</span>`).join("")}</div>
   <div class="m-ctas">
    ${p.link
     ?`<a class="btn btn-play" href="${p.link}" target="_blank" rel="noopener">${openLabel(p)}</a>`
     :`<a class="btn btn-play" href="mailto:futureshow@proton.me?subject=${encodeURIComponent(p.mailSubject||p.t)}">${UI[LANG].demo}</a>`}
    <button class="btn btn-info" id="mclose2" style="backdrop-filter:none;background:rgba(233,237,245,.08)">${UI[LANG].close}</button>
   </div>${contact}${credit}
  </div>`;
 document.getElementById("mback").classList.add("open");
 try{history.replaceState(null,"","#m="+k)}catch(e){}
 document.getElementById("mclose").onclick=closeModal;
 document.getElementById("mclose2").onclick=closeModal;
 clearInterval(modalTimer);
 if(g.length>1 && !matchMedia("(prefers-reduced-motion: reduce)").matches){
  modalTimer=setInterval(()=>{
   const imgs=[...m.querySelectorAll(".m-banner img")];
   const dots=[...m.querySelectorAll(".m-dot")];
   const cur=imgs.findIndex(im=>im.classList.contains("cur"));
   const nx=(cur+1)%imgs.length;
   imgs.forEach((im,j)=>im.classList.toggle("cur",j===nx));
   dots.forEach((d,j)=>d.classList.toggle("on",j===nx));
  },3000);
 }
}
function closeModal(){document.getElementById("mback").classList.remove("open");
 clearInterval(modalTimer);
 document.body.style.overflow="";
 const m=document.getElementById("modal");
 if(m && m.querySelector("iframe")) m.innerHTML="";   // zatrzymaj odtwarzanie

 try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}

renderAll();

document.addEventListener("click",e=>{
 const dotm=e.target.closest("[data-mgoto]");if(dotm){
  const m=document.getElementById("modal");const j=+dotm.dataset.mgoto;

 if(e.target.id==="mback")closeModal();

 LANG=LANG==="pl"?"en":"pl";store.set("fs-lang",LANG);store.set("lang",LANG);renderAll();};
document.getElementById("q").addEventListener("input",e=>{
 const q=bezOgonkow(e.target.value.trim());
 /* krótkie hasła szukamy po całych słowach — inaczej „rodo" trafia w „międzynarodowej" */
 const scisle=q.length>0&&q.length<=4;
 const pasuje=hay=>{
  if(!q) return true;
  if(!scisle) return hay.includes(q);
  return (" "+hay+" ").includes(" "+q+" ") || hay.split(" ").some(w=>w.startsWith(q));
 };
 document.querySelectorAll(".card").forEach(c=>
  c.classList.toggle("hidden",!pasuje(c.dataset.hay||"")));
 document.querySelectorAll(".rail").forEach(r=>{
  const any=[...r.querySelectorAll(".card")].some(c=>!c.classList.contains("hidden"));
  r.classList.toggle("hidden",!any)});
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeModal();return}
 const typing=document.activeElement && ["INPUT","TEXTAREA"].includes(document.activeElement.tagName);
 const modalOpen=document.getElementById("mback").classList.contains("open");
 if(typing||modalOpen)return;
 if(e.key==="ArrowRight"){heroGo(heroIx+1);heroAuto()}
 if(e.key==="ArrowLeft"){heroGo(heroIx-1);heroAuto()}
});
addEventListener("scroll",()=>document.getElementById("nav")
 .classList.toggle("solid",scrollY>40),{passive:true});
if(location.hash.startsWith("#m=")){const k=location.hash.slice(3);if(P[k])openModal(k)}
/* ═══ zaproszenie do darmowych aplikacji ═══
   Pokazuje się raz na 45 dni i dopiero, gdy ktoś naprawdę przegląda stronę:
   po przewinięciu za pierwszy rząd albo po 25 s. Nigdy nad otwartym oknem. */
(function(){
 const KEY="fs.appnudge.v1", DNI=45;
 const box=document.getElementById("appNudge"); if(!box) return;
 let pokazane=false;

 function widzianoNiedawno(){
   try{
     const t=+localStorage.getItem(KEY)||0;
     return t && (Date.now()-t) < DNI*864e5;
   }catch(e){ return false; }
 }
 function zapamietaj(){ try{ localStorage.setItem(KEY,String(Date.now())); }catch(e){} }

 const TXT={
  pl:{kick:"Za darmo · bez konta",
      tytul:"Trzy rzeczy, które możesz mieć od ręki",
      lede:"Nie sprzedajemy ich i nie prosimy o dane. Działają w przeglądarce albo na Twoim komputerze.",
      all:"Zobacz wszystkie do pobrania →", later:"Nie teraz"},
  en:{kick:"Free · no account",
      tytul:"Three things you can have right now",
      lede:"We do not sell them and we do not ask for your details. They run in the browser or on your own machine.",
      all:"See everything to download →", later:"Not now"}
 };
 const APPS=["futuretalk","futureform","anonimizator"];

 function wypelnij(){
   const t=TXT[LANG]||TXT.pl;
   document.getElementById("anKick").textContent=t.kick;
   document.getElementById("anTitle").textContent=t.tytul;
   document.getElementById("anLede").textContent=t.lede;
   const all=document.getElementById("anAll");
   all.textContent=t.all; all.href="downloads.html";
   document.getElementById("anLater").textContent=t.later;
   document.getElementById("anList").innerHTML=APPS.map(k=>{
     const p=P[k]; if(!p) return "";
     const opis=(p.stats||[]).slice(0,2).join(" · ");
     return `<a class="an-item" href="${p.link}" target="_blank" rel="noopener" data-app="${k}">
       <span class="an-dot" style="background:${p.pal.acc}"></span>
       <span class="an-txt"><b>${p.t}</b><span>${opis}</span></span>
       <span class="an-go">→</span></a>`;
   }).join("");
 }

 function pokaz(){
   if(pokazane||widzianoNiedawno()) return;
   if(document.getElementById("mback").classList.contains("open")) return;  // nie nad otwartym oknem
   pokazane=true; wypelnij(); box.classList.add("on");
   document.body.style.overflow="hidden";
   zapamietaj();
 }
 function ukryj(){
   box.classList.remove("on");
   if(!document.getElementById("mback").classList.contains("open")) document.body.style.overflow="";
 }

 document.getElementById("anClose").addEventListener("click",ukryj);
 document.getElementById("anLater").addEventListener("click",ukryj);
 box.addEventListener("click",e=>{ if(e.target===box) ukryj(); });
 document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&box.classList.contains("on")) ukryj(); });
 document.getElementById("anList").addEventListener("click",e=>{
   if(e.target.closest("[data-app]")) ukryj();
 });

 if(widzianoNiedawno()) return;
 const t=setTimeout(pokaz,25000);
 const naScroll=()=>{
   const r=document.getElementById("rails");
   if(r && window.pageYOffset > r.offsetTop + 200){
     clearTimeout(t); window.removeEventListener("scroll",naScroll); pokaz();
   }
 };
 window.addEventListener("scroll",naScroll,{passive:true});
})();

</script>
