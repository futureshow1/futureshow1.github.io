<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maraton — KINO NIEME</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a0a; --bg-card: #141211; --ink: #ece3cf; --ink-dim: #b3a894;
    --ink-faint: #6e665a; --acc: #8dbbdc; --line: #2a2522;
    --display: 'Playfair Display', serif;
    --body: 'Jost', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); min-height: 100vh; display: flex; flex-direction: column; }
  ::selection { background: var(--acc); color: #111; }

  .bar {
    display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
    padding: .8rem 3vw; border-bottom: 1px solid var(--line);
  }
  .back { font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; color: var(--acc); text-decoration: none; border: 1px solid var(--line); padding: .5rem .8rem; }
  .back:hover { border-color: var(--acc); }
  .bar .word { font-family: var(--display); font-size: 1rem; letter-spacing: .04em; }
  .bar .word span { color: var(--acc); }
  .pos { font-family: var(--mono); font-size: .72rem; color: var(--ink-faint); letter-spacing: .08em; }
  .pos b { color: var(--acc); font-weight: 500; }
  .bar .grow { flex: 1; }
  .cbtn {
    font-family: var(--mono); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
    background: none; border: 1px solid var(--line); color: var(--ink-dim);
    padding: .5rem .9rem; cursor: pointer; transition: all .2s;
  }
  .cbtn:hover { border-color: var(--acc); color: var(--ink); }
  .progress { height: 3px; background: var(--line); position: relative; }
  .progress i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); transition: width .4s; }

  .stage { flex: 1; display: grid; place-items: center; padding: 2vh 3vw; position: relative; }
  .frame { width: min(1400px, 96vw); aspect-ratio: 16/9; max-height: 84vh; background: #000; border: 1px solid var(--line); border-bottom: 3px solid var(--acc); position: relative; }
  .frame iframe, .frame #yt { width: 100%; height: 100%; border: 0; display: block; position: absolute; inset: 0; }

  /* plansza zapowiedzi */
  .intro {
    position: absolute; inset: 0; z-index: 5; display: none;
    flex-direction: column; justify-content: center; padding: 6% 7%;
    background: var(--bg);
    overflow: hidden;
  }
  .intro.show { display: flex; }
  .intro::before {
    content: ""; position: absolute; top: 0; right: 7%; width: 3px; height: 100%;
    background: var(--acc); transform: skewX(-16deg); opacity: .85;
  }
  .intro .chap { font-family: var(--mono); font-size: clamp(.6rem, 1.4vw, .85rem); letter-spacing: .3em; text-transform: uppercase; color: var(--acc); margin-bottom: 1.2em; }
  .intro .who { font-family: var(--mono); font-size: clamp(.7rem, 1.8vw, 1.05rem); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: .5em; }
  .intro .what { font-family: var(--display); font-size: clamp(1.4rem, 5vw, 4rem); line-height: 1.02; text-transform: uppercase; }
  .intro .yr { color: transparent; -webkit-text-stroke: 2px var(--acc); }
  .intro .meta { font-family: var(--mono); font-size: clamp(.62rem, 1.3vw, .8rem); color: var(--ink-faint); margin-top: 1.6em; letter-spacing: .1em; }
  .intro .bignum {
    position: absolute; right: 4%; bottom: 2%;
    font-family: var(--display); font-size: clamp(3rem, 12vw, 9rem);
    color: transparent; -webkit-text-stroke: 1.5px var(--line); line-height: 1; pointer-events: none;
  }

  /* start / komunikaty */
  .gate { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; background: rgba(15,14,19,.88); }
  .gate.show { display: grid; }
  .gate .inner { text-align: center; }
  .startbtn {
    font-family: var(--display); font-size: clamp(1.1rem, 3vw, 1.9rem); letter-spacing: .06em;
    background: var(--acc); color: #17130a; border: none; padding: 1rem 2.6rem; cursor: pointer;
    transition: transform .15s;
  }
  .startbtn:hover { transform: scale(1.04); }
  .gate .hint { font-family: var(--mono); font-size: .72rem; color: var(--ink-dim); margin-top: 1.1rem; letter-spacing: .08em; }
  .gate .hint b { color: var(--acc); }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head>
<body>

<div class="bar">
  <a class="back" href="index.html" id="backLink">←</a>
  <div class="word">MARA<span>TON</span></div>
  <div class="pos" id="pos"></div>
  <div class="grow"></div>
  <button class="cbtn" id="seekBack" title="cofnij 30 s (←)">↺ 30s</button>
  <button class="cbtn" id="seekFwd" title="przewiń 30 s (→)">30s ↻</button>
  <button class="cbtn" id="prevBtn" title="poprzedni film (Shift+←)">◀ poprz.</button>
  <button class="cbtn" id="nextBtn" title="następny film (Shift+→)">nast. ▶</button>
  <button class="cbtn" id="restartBtn" title="od początku">⟲</button>
</div>
<div class="progress"><i id="pbar"></i></div>

<div class="stage">
  <div class="frame">
    <div id="yt"></div>
    <div class="intro" id="intro"></div>
    <div class="gate show" id="gate">
      <div class="inner">
        <button class="startbtn" id="startBtn">▶ START</button>
        <div class="hint" id="gateHint"></div>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
const ALL = (window.FILMS || []).filter(f => f && f.id);
const QUEUE = ALL.filter(f => !f.noembed && !f.source);
const SKIPPED = ALL.length - QUEUE.length;
const INTRO_MS = 2000;

let idx = Math.min(parseInt(localStorage.getItem('kn-maraton-idx') || '0', 10) || 0, QUEUE.length - 1);
let player = null, introTimer = null, started = false;

const $ = id => document.getElementById(id);

function chapterNum(f) {
  const secs = [];
  for (const x of ALL) if (!secs.includes(x.section)) secs.push(x.section);
  return String(secs.indexOf(f.section) + 1).padStart(2, '0');
}

function updateBar() {
  const f = QUEUE[idx];
  $('pos').innerHTML = `<b>${idx + 1}</b> / ${QUEUE.length} · ${f.section}`;
  $('pbar').style.width = (100 * (idx + 1) / QUEUE.length) + '%';
  document.title = `${idx + 1}/${QUEUE.length} · ${f.film} — Maraton`;
}

function showIntro(f) {
  $('intro').innerHTML = `
    <div class="chap">Rozdział ${chapterNum(f)} · ${f.section}</div>
    <div class="who">${f.artist}</div>
    <div class="what">${f.film} <span class="yr">${f.year || ''}</span></div>
    <div class="meta">${f.duration || ''}${f.channel ? ' · ' + f.channel : ''}</div>
    <div class="bignum">${String(idx + 1).padStart(3, '0')}</div>`;
  $('intro').classList.add('show');
}

function playCurrent() {
  const f = QUEUE[idx];
  updateBar();
  localStorage.setItem('kn-maraton-idx', String(idx));
  clearTimeout(introTimer);
  if (player && player.pauseVideo) try { player.pauseVideo(); } catch (e) {}
  showIntro(f);
  introTimer = setTimeout(() => {
    $('intro').classList.remove('show');
    player.loadVideoById(f.id);
  }, INTRO_MS);
}

function step(d) {
  idx = (idx + d + QUEUE.length) % QUEUE.length;
  playCurrent();
}

// YouTube IFrame API
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    host: 'https://www.youtube-nocookie.com',
    playerVars: { autoplay: 1, rel: 0 },
    events: {
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) step(1); },
      onError: () => { setTimeout(() => step(1), 1200); }
    }
  });
};

$('startBtn').addEventListener('click', () => {
  if (!player) return;
  started = true;
  $('gate').classList.remove('show');
  playCurrent();
});
function seek(d) {
  if (!started || !player || !player.getCurrentTime) return;
  try { player.seekTo(Math.max(0, player.getCurrentTime() + d), true); } catch (e) {}
}
$('nextBtn').addEventListener('click', () => started && step(1));
$('prevBtn').addEventListener('click', () => started && step(-1));
$('seekFwd').addEventListener('click', () => seek(30));
$('seekBack').addEventListener('click', () => seek(-30));
$('restartBtn').addEventListener('click', () => { if (started) { idx = 0; playCurrent(); } });
document.addEventListener('keydown', e => {
  if (!started) return;
  if (e.key === 'ArrowRight') { e.shiftKey ? step(1) : seek(30); e.preventDefault(); }
  if (e.key === 'ArrowLeft')  { e.shiftKey ? step(-1) : seek(-30); e.preventDefault(); }
});

// init
const resume = idx > 0;
$('gateHint').innerHTML =
  (resume ? `wznowisz od filmu <b>${idx + 1}</b> / ${QUEUE.length} — ⟲ zaczyna od początku` : `${QUEUE.length} filmów, jeden po drugim, od pierwszego do ostatniego`) +
  (SKIPPED ? `<br>${SKIPPED} filmów bez zgody na osadzanie pominięto — obejrzysz je z kart portalu` : '');
updateBar();
</script>
<script data-goatcounter="https://futureshow.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script src="https://futureshow.pl/assets/fs-home.js" defer></script>
</body>
</html>
