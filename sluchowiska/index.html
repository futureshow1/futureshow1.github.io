  },
  en: {

    ledeSrc: 'Sources: official broadcaster channels and archives, digital libraries, public-domain and CC-licensed recordings.',

};
const PALETTE = ['#ff6b6b','#4ecdc4','#845ec2','#ff9f68','#7bd389','#f06292','#4fc3f7','#ffb347','#9575cd','#26a69a','#ef5350','#42a5f5','#ab47bc','#66bb6a'];
const LANGNAME = { pl: 'PL', en: 'EN', de: 'DE', cs: 'CS', uk: 'UK' };
let lang = localStorage.getItem('sl-lang') || 'pl';
const t = k => (I18N[lang][k] ?? I18N.pl[k] ?? k);

const ITEMS = (window.ITEMS || []);
const SECTIONS = (window.SECTIONS || []);
const state = { q: '', lang: 'all', type: 'all', src: 'all', bg: false, here: false };

const fmtDur = s => { if (!s) return ''; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60; return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g,'l');

const playRank = it => it.play?.kind === 'mp3' ? 0 : (it.play?.kind === 'yt' || it.play?.kind === 'embed') ? 1 : 2;
function matches(it) {
  if (state.lang !== 'all' && it.lang !== state.lang) return false;
  if (state.type !== 'all' && it.type !== state.type) return false;
  if (state.src !== 'all' && it.source !== state.src) return false;
  if (state.bg && it.play?.kind !== 'mp3') return false;
  if (state.here && playRank(it) === 2) return false;
  if (state.q) { const h = norm([it.title, it.author, it.performers, it.director, it.note, it.source, it.section].join(' ')); return state.q.split(/\s+/).every(w => h.includes(w)); }
  return true;
}

function card(it) {
  const title = (lang === 'en' && it.title_en) ? it.title_en : it.title;
  const cover = it.cover ? `<img loading="lazy" src="${esc(it.cover)}" alt="">` : '';
  const badge = `<span class="badge${it.type==='sluchowisko'?'':' r'}">${esc(t(it.type))}</span>`;
  const meta = [];
  if (it.year) meta.push(`${t('year')} ${it.year}`);
  if (it.age) meta.push(`${t('age')} ${esc(it.age)}`);
  if (it.parts > 1) meta.push(`${it.parts} ${t('parts')}`);
  if (it.performers) meta.push(`${t('reader')} ${esc(it.performers)}`);
  if (it.director) meta.push(`${t('dir')} ${esc(it.director)}`);
  meta.push(esc(it.source));
  const canPlay = it.play && (it.play.kind === 'yt' || it.play.kind === 'mp3' || it.play.kind === 'embed');
  return `<article class="card${canPlay?'':' extonly'}" data-id="${esc(it.id)}">
    <div class="cover${it.coverBook?' book':''}" data-act="${canPlay?'play':'open'}">${cover}<div class="play"><i>▶</i></div>${badge}<span class="lang">${LANGNAME[it.lang]||it.lang}</span>${it.duration?`<span class="dur">${fmtDur(it.duration)}</span>`:''}${it.official===false?`<span class="unoff">${t('unofficial')}</span>`:''}${it.play?.kind==='mp3'?`<span class="unoff bgok" title="${t('bgTitle')}">📱 ${t('bgShort')}</span>`:''}</div>
    <div class="body">
      <div class="ttl">${esc(title)}</div>
      ${it.author ? `<div class="auth">${esc(it.author)}</div>` : ''}
      <div class="meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>
      ${it.note ? `<div class="note">${esc((lang==='en'&&it.note_en)?it.note_en:it.note)}</div>` : ''}
      <div class="actions">${canPlay ? `<button class="primary" data-act="play">${t('listen')}</button>` : `<a class="ext" href="${esc(it.url)}" target="_blank" rel="noopener">${t('listenExt')} ↗</a>`}<a href="${esc(it.url)}" target="_blank" rel="noopener">${t('open')}</a></div>
    </div>
  </article>`;
}

function render() {
  const main = document.getElementById('main'), toc = document.getElementById('toc');
  const groups = new Map(); SECTIONS.forEach(s => groups.set(s.id, []));
  let shown = 0;
  ITEMS.forEach(it => { if (matches(it)) { (groups.get(it.section) || groups.set(it.section, []).get(it.section)).push(it); shown++; } });
  toc.innerHTML = `<h3>${t('toc')}</h3>`;
  let html = '', n = 0;
  SECTIONS.forEach(s => {
    const list = (groups.get(s.id) || []).slice().sort((a, b) => playRank(a) - playRank(b)); if (!list.length) return; n++;
    const title = lang === 'en' && s.title_en ? s.title_en : s.title;
    const desc = lang === 'en' && s.desc_en ? s.desc_en : s.desc;
    toc.insertAdjacentHTML('beforeend', `<a href="#${esc(s.id)}" style="--c:${PALETTE[SECTIONS.indexOf(s) % PALETTE.length]}">${esc(title)}<small>${list.length}</small></a>`);
    const col = PALETTE[SECTIONS.indexOf(s) % PALETTE.length];
    html += `<section class="chapter" id="${esc(s.id)}" style="--c:${col}"><div class="ch-head"><span class="ch-num">${String(n).padStart(2,'0')}</span><h2>${esc(title)}</h2><span class="count">${list.length}</span></div>${desc?`<p class="ch-desc">${esc(desc)}</p>`:''}<div class="grid">${list.map(card).join('')}</div></section>`;
  });
  const keep = NOW.card?.querySelector('.player');
  if (keep) document.getElementById('parking').appendChild(keep);
  main.innerHTML = html || `<div class="empty">${t('empty')}</div>`;
  if (keep) { const again = main.querySelector(`[data-id="${CSS.escape(NOW.it.id)}"]`); if (again) { again.classList.add('expanded'); again.appendChild(keep); NOW.card = again; } else { NOW.card = document.getElementById('parking'); } }
  document.getElementById('stat-items').textContent = ITEMS.length;
  document.getElementById('stat-hours').textContent = Math.round(ITEMS.reduce((a,i)=>a+(i.duration||0),0)/3600);
  document.getElementById('stat-sources').textContent = new Set(ITEMS.map(i=>i.source)).size;
  document.getElementById('stat-chapters').textContent = SECTIONS.length;
}

const NOW = { card: null, it: null, kind: null, audio: null, iframe: null, paused: false, volume: +(localStorage.getItem('sl-vol') ?? 100), muted: false };
function ytCmdArgs(func, args) { NOW.iframe?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); }
function applyVolume() {
  const v = NOW.muted ? 0 : NOW.volume;
  if (NOW.kind === 'mp3' && NOW.audio) { NOW.audio.volume = v / 100; NOW.audio.muted = NOW.muted; }
  else if (NOW.kind === 'yt') { ytCmdArgs('setVolume', [v]); NOW.muted ? ytCmdArgs('mute', []) : ytCmdArgs('unMute', []); }
  localStorage.setItem('sl-vol', NOW.volume);
}
function ytCmd(func) { NOW.iframe?.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args: [] }), '*'); }
function nowRender() {
  const bar = document.getElementById('nowbar');
  if (!NOW.card) { bar.hidden = true; bar.innerHTML = ''; return; }
  const it = NOW.it, title = (lang === 'en' && it.title_en) ? it.title_en : it.title;
  const canToggle = NOW.kind === 'mp3' || NOW.kind === 'yt', tracks = NOW.card.querySelectorAll('.tracks button').length > 1;
  const cur = tracks ? NOW.card.querySelector('.tracks button.on')?.textContent : '';
  bar.classList.toggle('paused', NOW.paused);
  bar.innerHTML = `<span class="np">${t(NOW.paused ? 'nowPaused' : 'nowPlaying')}</span><span class="nt">${esc(title)}${cur ? ` <small>· ${esc(cur)}</small>` : ''}</span>` +
    (tracks ? `<button data-n="prev" title="${t('prev')}">⏮</button>` : '') +
    (canToggle ? `<button class="big" data-n="toggle" title="${t('playpause')}">${NOW.paused ? '▶' : '❚❚'}</button>` : '') +
    (tracks ? `<button data-n="next" title="${t('next')}">⏭</button>` : '') +
    (canToggle ? `<span class="vol"><button data-n="mute" title="${t('mute')}">${NOW.muted ? '🔇' : '🔊'}</button><input type="range" min="0" max="100" value="${NOW.muted ? 0 : NOW.volume}" aria-label="${t('volume')}"></span>` : '') +
    `<button data-n="goto" title="${t('goto')}">↓</button><button data-n="close" title="${t('close')}">✕</button>`;
  bar.hidden = false;
}
document.getElementById('nowbar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !NOW.card) return;
  const n = b.dataset.n;
  if (n === 'toggle') {
    if (NOW.kind === 'mp3' && NOW.audio) { NOW.audio.paused ? NOW.audio.play() : NOW.audio.pause(); }
    else if (NOW.kind === 'yt') { NOW.paused ? ytCmd('playVideo') : ytCmd('pauseVideo'); NOW.paused = !NOW.paused; nowRender(); }
  } else if (n === 'prev' || n === 'next') {
    const cur = NOW.card.querySelector('.tracks button.on'); const nx = n === 'next' ? cur?.nextElementSibling : cur?.previousElementSibling; if (nx) nx.click(); nowRender();
  } else if (n === 'goto') { if (NOW.card.id === 'parking') { state.q = ''; state.lang = state.type = state.src = 'all'; document.getElementById('q').value = ''; buildChips(); render(); } NOW.card.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (n === 'mute') { NOW.muted = !NOW.muted; applyVolume(); nowRender(); }
  else if (n === 'close') { closePlayer(NOW.card); }
});
document.getElementById('nowbar').addEventListener('input', e => {
  if (e.target.type !== 'range') return;
  NOW.volume = +e.target.value; NOW.muted = NOW.volume === 0; applyVolume();
  const mb = document.getElementById('nowbar').querySelector('[data-n=mute]'); if (mb) mb.textContent = NOW.muted ? '🔇' : '🔊';
});
function closePlayer(cardEl) {
  cardEl.classList.remove('expanded'); cardEl.querySelector('.player')?.remove();
  if (NOW.card === cardEl) { NOW.card = null; NOW.it = null; NOW.audio = null; NOW.iframe = null; nowRender(); }
}
function openPlayer(cardEl, it) {
  document.querySelectorAll('.card.expanded').forEach(c => { if (c !== cardEl) closePlayer(c); });
  if (cardEl.classList.contains('expanded')) { closePlayer(cardEl); return; }
  cardEl.classList.add('expanded');
  const p = document.createElement('div'); p.className = 'player';
  const k = it.play.kind;
  if (k === 'yt') {
    const ids = it.play.ids || [];
    const src = it.play.list ? `https://www.youtube-nocookie.com/embed/videoseries?list=${it.play.list}&autoplay=1&enablejsapi=1` : ids.length > 1 ? `https://www.youtube-nocookie.com/embed/${ids[0]}?autoplay=1&enablejsapi=1&playlist=${ids.join(',')}` : `https://www.youtube-nocookie.com/embed/${it.play.src}?autoplay=1&enablejsapi=1`;
    const names = it.play.names || [];
    p.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>` +
      (ids.length > 1 ? `<div class="tracks">${ids.map((id, i) => `<button data-v="${id}" class="${i ? '' : 'on'}">${i + 1}. ${esc(names[i] || `${t('part')} ${i + 1}`)}</button>`).join('')}</div>` : '');
    p.querySelectorAll('.tracks button').forEach(b => b.onclick = () => { p.querySelectorAll('.tracks button').forEach(x => x.classList.remove('on')); b.classList.add('on'); ytCmdArgs('loadPlaylist', [ids, ids.indexOf(b.dataset.v)]); NOW.paused = false; nowRender(); });
  } else if (k === 'embed') {
    p.innerHTML = `<iframe src="${esc(it.play.src)}" allow="autoplay" loading="lazy" style="aspect-ratio:auto;height:${it.play.height||160}px"></iframe>`;
  } else if (k === 'mp3') {
    const tracks = it.play.tracks || [{ name: it.title, url: it.play.src }];
    p.innerHTML = `<audio controls autoplay playsinline preload="metadata" src="${esc(tracks[0].url)}"></audio>` + (tracks.length > 1 ? `<div class="tracks">${tracks.map((tr,i)=>`<button data-i="${i}" class="${i?'':'on'}">${i+1}. ${esc(tr.name)}</button>`).join('')}</div>` : '');
    const audio = p.querySelector('audio');
    p.querySelectorAll('.tracks button').forEach(b => b.onclick = () => { p.querySelectorAll('.tracks button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); audio.src = tracks[+b.dataset.i].url; audio.play(); });
    audio.onended = () => { const cur = p.querySelector('.tracks button.on'); const nx = cur?.nextElementSibling; if (nx) nx.click(); };
    if ('mediaSession' in navigator) {
      const ms = navigator.mediaSession;
      const setMeta = () => { const cur = p.querySelector('.tracks button.on')?.textContent || ''; ms.metadata = new MediaMetadata({ title: it.title + (cur ? ' — ' + cur.replace(/^\d+\.\s*/, '') : ''), artist: it.author || it.source, album: 'Słuchowiska dla dzieci', artwork: it.cover ? [{ src: it.cover, sizes: '512x512', type: 'image/jpeg' }] : [] }); };
      setMeta(); p.querySelectorAll('.tracks button').forEach(b => b.addEventListener('click', () => setTimeout(setMeta, 0)));
      ms.setActionHandler('play', () => audio.play()); ms.setActionHandler('pause', () => audio.pause());
      ms.setActionHandler('nexttrack', tracks.length > 1 ? () => p.querySelector('.tracks button.on')?.nextElementSibling?.click() : null);
      ms.setActionHandler('previoustrack', tracks.length > 1 ? () => p.querySelector('.tracks button.on')?.previousElementSibling?.click() : null);
      ms.setActionHandler('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 15)); });
      ms.setActionHandler('seekforward', d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + (d.seekOffset || 15)); });
    }
    audio.onplay = () => { NOW.paused = false; nowRender(); }; audio.onvolumechange = () => { if (Math.round(audio.volume*100) !== NOW.volume || audio.muted !== NOW.muted) { NOW.volume = Math.round(audio.volume*100); NOW.muted = audio.muted; localStorage.setItem('sl-vol', NOW.volume); nowRender(); } }; audio.onpause = () => { NOW.paused = true; nowRender(); };
    p.querySelectorAll('.tracks button').forEach(b => b.addEventListener('click', () => setTimeout(nowRender, 0)));
  }
  const closeBtn = document.createElement('div'); closeBtn.style.marginTop = '.6rem';
  closeBtn.innerHTML = `<button class="btn">${t('close')}</button>`; closeBtn.querySelector('button').onclick = () => closePlayer(cardEl);
  Object.assign(NOW, { card: cardEl, it, kind: k, audio: p.querySelector('audio'), iframe: p.querySelector('iframe'), paused: false }); nowRender(); applyVolume();
  if (k === 'yt') NOW.iframe.addEventListener('load', () => { NOW.iframe.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); NOW.ytReady = false; setTimeout(() => { applyVolume(); setTimeout(() => { NOW.ytReady = true; }, 1500); }, 800); });
  p.appendChild(closeBtn); cardEl.appendChild(p); cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('main').addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); if (!act) return;
  const cardEl = act.closest('.card'); const it = ITEMS.find(i => i.id === cardEl.dataset.id); if (!it) return;
  if (act.dataset.act === 'play') openPlayer(cardEl, it); else window.open(it.url, '_blank', 'noopener');
});

function buildChips() {
  const langs = ['all', ...[...new Set(ITEMS.map(i=>i.lang))].sort()];
  document.getElementById('langChips').innerHTML = langs.map(l => `<button class="chip${state.lang===l?' on':''}" data-k="lang" data-v="${l}">${l==='all'?t('all'):LANGNAME[l]||l}</button>`).join('');
  const types = ['all', ...[...new Set(ITEMS.map(i=>i.type))]];
  document.getElementById('typeChips').innerHTML = types.map(x => `<button class="chip${state.type===x?' on':''}" data-k="type" data-v="${x}">${x==='all'?t('all'):t(x)}</button>`).join('');
  document.getElementById('bgChip').innerHTML = `<button class="chip bg${state.here?' on':''}" data-k="here" data-v="1" title="${t('hereTitle')}">▶ ${t('here')}</button><button class="chip bg${state.bg?' on':''}" data-k="bg" data-v="1" title="${t('bgTitle')}">📱 ${t('bg')}</button>`;
  const srcs = [...new Set(ITEMS.map(i=>i.source))].sort((a,b)=>a.localeCompare(b));
  document.getElementById('srcSel').innerHTML = `<option value="all">${t('srcAll')}</option>` + srcs.map(s=>`<option value="${esc(s)}"${state.src===s?' selected':''}>${esc(s)}</option>`).join('');
}
document.querySelector('.toolbar').addEventListener('click', e => { const c = e.target.closest('.chip'); if (!c) return; if (c.dataset.k === 'bg' || c.dataset.k === 'here') state[c.dataset.k] = !state[c.dataset.k]; else state[c.dataset.k] = c.dataset.v; buildChips(); render(); });
document.getElementById('srcSel').onchange = e => { state.src = e.target.value; render(); };
document.getElementById('q').oninput = e => { state.q = norm(e.target.value.trim()); render(); };

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById('langBtn').textContent = lang === 'pl' ? 'EN' : 'PL';
  document.getElementById('titleTop').textContent = lang === 'pl' ? 'SŁUCHOWISKA' : 'AUDIO PLAYS';
  document.getElementById('titleBot').textContent = lang === 'pl' ? 'DLA DZIECI' : 'FOR KIDS';
  buildChips(); render(); nowRender();
}
document.getElementById('langBtn').onclick = () => { lang = lang === 'pl' ? 'en' : 'pl'; localStorage.setItem('sl-lang', lang); applyLang(); };
const setTheme = th => { document.documentElement.classList.toggle('dark', th === 'dark'); document.getElementById('themeBtn').textContent = th === 'dark' ? '☀' : '☾'; localStorage.setItem('sl-theme', th); };
setTheme(localStorage.getItem('sl-theme') || 'light');
document.getElementById('themeBtn').onclick = () => setTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');

window.addEventListener('message', e => {
  if (NOW.kind !== 'yt' || typeof e.data !== 'string') return;
  try { const d = JSON.parse(e.data); if (d.event === 'infoDelivery' && d.info && typeof d.info.playerState === 'number') { const paused = d.info.playerState !== 1 && d.info.playerState !== 3; if (paused !== NOW.paused) { NOW.paused = paused; nowRender(); } }
    if (d.event === 'infoDelivery' && d.info && d.info.videoData && d.info.videoData.video_id && NOW.card) {
      const vid = d.info.videoData.video_id, cur = NOW.card.querySelector('.tracks button.on');
      if (cur && cur.dataset.v !== vid) { const b = NOW.card.querySelector(`.tracks button[data-v="${vid}"]`); if (b) { cur.classList.remove('on'); b.classList.add('on'); nowRender(); } }
    }
    if (NOW.ytReady && d.event === 'infoDelivery' && d.info && typeof d.info.volume === 'number' && typeof d.info.muted === 'boolean') { if (d.info.volume !== NOW.volume || d.info.muted !== NOW.muted) { NOW.volume = d.info.volume; NOW.muted = d.info.muted; localStorage.setItem('sl-vol', NOW.volume); nowRender(); } } } catch (_) {}
});
const tb = document.querySelector('.toolbar');
new ResizeObserver(() => document.documentElement.style.setProperty('--tb', tb.offsetHeight + 'px')).observe(tb);
// scroll-spy
const spy = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) { document.querySelectorAll('nav.toc a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id)); } }); }, { rootMargin: '-20% 0px -70% 0px' });
new MutationObserver(() => document.querySelectorAll('section.chapter').forEach(s => spy.observe(s))).observe(document.getElementById('main'), { childList: true });

document.getElementById('genDate').textContent = window.GENERATED || '';
document.getElementById('ftSrc').innerHTML = (window.SOURCES || []).map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');
applyLang();
</script>
