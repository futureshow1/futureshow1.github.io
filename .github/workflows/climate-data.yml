name: Mapa zmian klimatu — dane NASA GISTEMP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 16 * *"   # co miesiąc, po aktualizacji GISTEMP (ok. 10–15 dnia)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy shapely netCDF4
      - run: python klimat/pipeline/build_climate_data.py
      - run: python klimat/pipeline/build_indicators.py
      - run: python klimat/pipeline/build_emissions.py
      - name: Zatwierdź odświeżone dane
        run: |
          git config user.name "climate-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add klimat/data/climate-data.json klimat/data/indicators.json klimat/data/emissions.json
          git commit -m "klimat: odświeżenie danych NASA/NOAA/NSIDC/OWID ($(date -u +%Y-%m-%d))" || echo "bez zmian"
          git push
