        html: `<p>The third chapter of <em>Anti-Oedipus</em> is the longest and most ambitious part of the book. It is also an attempt to write universal history from the perspective of desiring-production — a history that is neither teleological nor linear, but contingent, ironic, and critical. The authors analyze the three great forms of social organization — the territorial machine, the despotic machine, and the capitalist machine — asking how each of them codes, overcodes, or decodes the flows of desire.</p>
<h4 class="r-h3">7.1 The Recording Socius</h4>
<p><strong>The three forms of the socius: the Earth, the Despot, Capital</strong></p>
<p>The socius is defined as the "full body" that constitutes, within a given social formation, the instance of antiproduction. Its role is not to produce, but to fall back upon the processes of production and to appropriate them to itself as their "quasi-cause." It is the social counterpart of the individual's BwO — a historically shaped "full body" that performs the same function of recording at the collective level.</p>
<p>The three forms of the socius correspond to the three great social formations: the Earth is the full body of the territorial machine, the body of the Despot (or of his god) is the full body of the despotic machine, and Capital-Money is the full body of the capitalist machine.</p>
<p><strong>Coding, overcoding, decoding</strong></p>
<p>Coding the flows is the fundamental task of the socius — it consists in channeling and regulating desire (flows of women, children, seeds, excrement) so as to prevent their uncontrolled "leakage." Every society fears decoded flows, for they threaten the cohesion of the social fabric. Overcoding (surcodage) is the operation proper to the despotic machine: it imposes a higher, transcendent unity upon flows that were already coded — the state does not destroy the old codes but "builds itself over" them, turning them into the bricks of a new system. Decoding is the operation proper to capitalism, which destroys the old codes and replaces them with an axiomatic of abstract quantities — money as general equivalent evacuates sacred and social meanings, rendering the system purely functional.</p>
<p>The history of the socius is thus the passage from the coding of desire on the Earth, through its overcoding in the body of the sovereign, to its decoding in the capitalist machine. It must be stressed, however, that this is not a linear or teleological history — each transition is the outcome of contingent conjunctions, ruptures, and catastrophes, not of a necessary development.</p>
<h4 class="r-h3">7.2 The Primitive Territorial Machine</h4>
<p>The analysis of the territorial machine is one of the most original portions of <em>Anti-Oedipus</em>, weaving structural ethnology (Lévi-Strauss, Mauss), Nietzsche's philosophy, and Clastres's political anthropology into a coherent theory of "savage" societies as coding machines. Deleuze and Guattari stress that the territorial machine does not rest on the principle of geographic territory (that is the domain of the state) but on the Earth as "full body" — the instance of antiproduction that appropriates all the productive forces as their "quasi-cause." Unlike capitalism, which privatizes the organs, the territorial machine invests the organs collectively — the organs are "cut out" of the socius and treated as partial objects belonging to the community.</p>
<p><strong>The system of cruelty and the mnemotechnics of pain</strong></p>
<p>Deleuze and Guattari, following Nietzsche (the second essay of <em>On the Genealogy of Morals</em>, which they call "the great book of modern ethnology"), define primitive culture as a "system of cruelty." This is not innate violence but a movement of culture acting directly upon bodies. Man must create for himself a collective memory — a memory of words and promises — and this is accomplished through the physical marking of bodies: tattooing, incising, mutilation, and initiation rituals. This inscription makes man cease to be a purely biological being and become a part of the social machine.</p>
<p><strong>Alliance and filiation</strong></p>
<p>The operation of the territorial machine rests on the declension of networks of alliance and filiation. Filiation (kinship in the direct line) is administrative and hierarchical in character — it is the "filiative stock," the fixed capital of the social machine. Alliance (affinity in the lateral line) is political and economic in character — it expresses power and economic relations, functioning as "circulating capital." Importantly, alliance does not derive from filiation — the two systems intersect on the territorial surface, and the social economy passes precisely through alliance.</p>
<p><strong>Finite debt</strong></p>
<p>In primitive societies debt takes the place of exchange — an important correction to the anthropological tradition running from Marcel Mauss and Claude Lévi-Strauss, who treated exchange as the fundamental social fact. Deleuze and Guattari argue that exchange is secondary to inscription and debt: it is not the exchange of gifts that constitutes society, but the recording of debt on the surface of the socius. Debt is the direction of movement on the surface of recording — the stock (filiation) is potential energy, while debt (alliance) is kinetic energy. In the "cold economy" of primitive society the gift must be returned with a surplus, which creates a surplus value of code. The imbalance between debtor and creditor is not a pathology but the foundation of the system — the entire apparatus of repression serves to "train" man so that he becomes capable of alliance and of repaying debt.</p>
<p>Debt, however, is finite and mobile — in contrast to the infinite debt of the despotic machine. Primitive societies, as Pierre Clastres shows, actively prevent the concentration of power and debt in a single pair of hands, thereby exorcising the specter of the state (the Urstaat).</p>
<p><strong>The voice–graphism–eye triad</strong></p>
<p>Territorial representation is organized around three independent elements. The voice articulates the rules of alliance. Graphism — not linear writing, but a geo-graphism imprinted directly on the body — is an instrument of action upon the body and a system of signs independent of the voice. The eye "sees" the word by appraising the suffering engraved on the body — pain is the surplus value that the eye extracts from the body in order to confirm the power of the alliance. These three series do not form a unity — their independence is crucial to the territorial system.</p>
<p><strong>Surplus value of code</strong></p>
<p>Territorial representation produces a surplus value of code — a qualitative surplus that is not economic in the modern sense but rests on prestige, honor, and social debt. Detaching a fragment of the signifying chain from the surface of recording makes it possible to draw off part of the flow — this is the mechanism of exploitation in the primitive system.</p>
<h4 class="r-h3">7.3 The Barbarian Despotic Machine</h4>
<p><strong>Overcoding as the essence of the state</strong></p>
<p>Overcoding is the operation that constitutes the essence of the state. It consists in the state's imposing a higher, transcendent unity upon flows that had already been coded by the primitive communities. Instead of destroying the old codes, the state turns them into "bricks" — working parts of a new, monumental system. Overcoding makes every form of production appear to emanate from the body of the despot as its quasi-cause — just as, at the individual level, the BwO appropriates to itself the power of the desiring-machines. The despotic machine is a paranoiac machine: the despot-paranoiac organizes the whole of social production around a single center — his own full body. Paranoia corresponds to the molar organization of power, in which every flow must pass through the body of the sovereign.</p>
<p><strong>The Urstaat</strong></p>
<p>The despotic state does not arise gradually; it appears all at once as a complete, ready-made system — the Urstaat (the primordial state). It is an abstract machine that haunts the whole of universal history as its horizon — it "always was and always will be," a virtuality in the background of every society. Primitive societies actively "exorcise" the Urstaat, preventing the concentration of power (here Deleuze and Guattari invoke Pierre Clastres and his conception of "societies against the state"). Under capitalism the Urstaat returns in the form of the modern regulator-state.</p>
<p><strong>Infinite debt, the system of terror</strong></p>
<p>In the despotic machine the full body of the Earth is replaced by the full body of the despot, who becomes the sole owner and source of all power. Debt, which in primitive societies was finite and mobile, becomes infinite — the debtor (the subject) never ceases to pay what is owed, for the debt becomes an "existential debt" toward the sovereign. The place of the primitive system of cruelty is taken by a system of terror — punishment ceases to be a collective festival and becomes the despot's vengeance. The law is metonymic and unknowable — the verdict does not exist prior to the sanction, as in Kafka's penal machine.</p>
<p><strong>The new alliance and direct filiation</strong></p>
<p>The despot institutes a new genealogical order: he abrogates the old lines of affinity and imposes a new covenant between himself and the people (the new alliance), while at the same time deriving his lineage directly from the deity (direct filiation). Royal incest — marriage with the sister or the mother — serves the appropriation of all the filiative stocks by the single person of the sovereign.</p>
<p><strong>The emergence of writing and exegesis</strong></p>
<p>With the imperial system, writing in the narrow sense is born — as an instrument of bureaucracy and legislation. Graphism, which among the "savages" was independent of the voice, is now subordinated to the voice of the despot, becoming linear writing. In the territorial system the voice–graphism–eye triad consisted of three independent series: the voice articulated the rules of alliance, graphism (geo-graphism) imprinted signs directly on the body independently of the voice, and the eye appraised the pain on the body as a confirmation of value. In the despotic system this independence is abolished: the voice acquires transcendence (it becomes a voice "from on high," the voice of law and revelation), graphism is subordinated to it (linear writing as the record of the law), and the eye changes its function — instead of appraising pain on the body, it now "reads" the written text.</p>
<p>This transformation introduces a paradigm shift: instead of asking about the usefulness of the sign (as in the territorial system), the question "what does it mean?" appears — exegesis as a new way of enslaving desire to the signifier. The "despotic signifier" emerges — a superordinate sign that organizes all the other signs into a chain of significations. Deleuze and Guattari see in this the birth of "hermeneutics" in the broadest sense — the drive to uncover a hidden meaning, which psychoanalysis will carry on under the conditions of capitalism. The penal machine from Kafka's story is the paradigmatic example of despotic inscription — the machine writes the sentence directly onto the body of the condemned, and the verdict does not exist prior to the sanction.</p>
<h4 class="r-h3">7.4 The Civilized Capitalist Machine</h4>
<p><strong>The axiomatic of decoded flows</strong></p>
<p>The capitalist machine constitutes a radical break with the coding mechanisms of previous societies. It is the only social machine built upon decoded flows — whereas earlier societies feared decoded flows as a "nightmare" that would destroy their social fabric, capitalism internalizes this decoding, making it the very core of its production. Instead of qualitative codes assigning sacred or social meaning to actions, capitalism introduces a functional axiomatic of abstract quantities. Money operates as a general equivalent that evacuates meaning from the system, rendering it purely functional and cynical. Unlike the codes, which had to be inscribed on the human body through ritual, the axiomatic operates directly on money and capital, requiring neither belief nor memory, only regulation by the state.</p>
<p><strong>Two flows: free labor and independent capital</strong></p>
<p>The capitalist machine is born of the contingent conjunction of two specific deterritorialized flows: deterritorialized labor (the "free worker," separated from the land and the means of production, possessing nothing but labor-power) and deterritorialized capital (independent money-capital capable of buying that labor-power). Capitalism does not come into being until capital directly appropriates production, passing beyond mercantile activity into the industrial-filiative form in which money begets money.</p>
<p><strong>Deterritorialization and reterritorialization</strong></p>
<p>Capitalism functions through a double movement that constitutes its fundamental dynamic. Deterritorialization ceaselessly breaks up old territories, traditions, and families in order to free flows for profit — it destroys village communities, feudal bonds, craft guilds, traditional forms of life. At the same time reterritorialization creates "artificial residua" and "traps" — the modern state, nationalism, the Oedipal family — in order to bind desire once more to controllable forms. The state serves as a regulator that "axiomatizes with one hand what it decodes with the other," creating a field of immanence in which it captures the very flows it has released. Private property emerges in this context as the "subjective essence" of wealth — capitalism discovers that wealth is produced by "labor in general" (an abstract subjective essence), but immediately re-alienates this discovery by enclosing it in the form of private property.</p>
<p><strong>Tendency and countertendency</strong></p>
<p>Capitalism is governed by the "law of the counteracted tendency." The tendency is capitalism's innate inclination toward absolute decoding and the falling rate of profit, which pushes the system toward its limit. The countertendency is the constant displacement of that limit — the addition of new axioms, the creation of artificial scarcity, the shifting of crises from the center to the peripheries. The system "works only by breaking down," using its own crises as engines of expansion.</p>
<p><strong>Surplus value of flow versus surplus value of code</strong></p>
<p>Deleuze and Guattari introduce the crucial distinction between the surplus value of code (proper to primitive societies — qualitative, based on prestige and social debt) and the surplus value of flow (proper to capitalism — quantitatively determined by the differential relation between flows of different "power," concretely the flow of financing versus the flow of wages).</p>
<p><strong>Schizophrenia as the exterior limit</strong></p>
<p>Schizophrenia is the absolute, exterior limit of capitalism — and it is in this concept that the meeting of clinical analysis and economico-political analysis, which constitutes the originality of <em>Anti-Oedipus</em>, is most clearly visible. Capitalism is a relative limit — it decodes flows but immediately binds them back into its own axiomatic, adding new axioms whenever the limit seems threatened. Schizophrenia, by contrast, represents the state in which the flows are completely decoded and free upon a "desocialized body without organs" — a state of absolute deterritorialization in which no axiom is capable of recapturing desire.</p>
<p>Capitalism effectively produces schizophrenics as its own by-product — since it is itself based on the decoding of flows, it ceaselessly generates subjects whose desire escapes the axiomatic. But it must immediately repress them as clinical "illnesses" in order to avoid its own systemic disintegration. Oedipus is the interior, domestic limit that capitalism sets up against the exterior limit (schizophrenia): it captures desire before it reaches the point of absolute deterritorialization. In this way the system "works only by breaking down" — it uses its own crises as engines of expansion, and its own outcasts as a warning against crossing the limit.</p>
<h4 class="r-h3">7.5 Capitalist Representation and the Arrival of Oedipus</h4>
<p><strong>Figures, images, simulacra</strong></p>
<p>Capitalist representation operates through a hierarchy of abstractions. Figures are the non-figurative "point-signs" of the capitalist axiomatic (abstract quantities of money or labor). Images are the social personae that "personify" abstract capital — the "Capitalist" or the "Worker." Simulacra are the private persons (Mommy, Daddy, Child) — "images of images," which do not represent real social production but are domestic residua allowing the system to apply the social images to private persons.</p>
<p><strong>The three uses of Oedipus</strong></p>
<p>Deleuze and Guattari distinguish three strata of Oedipus. The imaginary Oedipus (imaginaire) centers on real or imagined parental figures and childhood memories — it is the "theater" of personal neurosis. The structural Oedipus, introduced by the Lacanians, treats Oedipus as a formal symbolic invariant (the Name-of-the-Father), but still overcodes desire with law and lack (castration). Finally, beneath these strata lies material reality — molecular desiring-production, which is neither imaginary nor symbolic but constitutes the "Impossible Real" composed of desiring-machines.</p>
<p><strong>Oedipus as capitalism's internal colony</strong></p>
<p>Oedipus "finally arrives" under capitalism, because capitalism creates the unique conditions necessary for it to occupy the unconscious. In primitive and despotic societies the family was an "open" strategy, coinciding directly with the social field. Under capitalism social production becomes independent of human reproduction — capital itself takes over the functions of alliance and filiation, leaving the family as a privatized, desocialized "residuum." Oedipus operates as the interior, domestic limit at which desire is captured and neutralized so that it never reaches its absolute limit — schizophrenia.</p>
<p>The operation of application (rabattement) consists in "folding" the vast social field (a set of 4 + n classes, races, and political agents) onto the small, restricted family set (the 3 + 1 triangle: Mommy–Daddy–Me). Every social figure (boss, priest, policeman) is mapped onto a family figure — the subject learns to see the world exclusively through the prism of parental relations. This spatiotemporal reduction ensures that desiring investments are turned away from revolutionary social ends toward private, neurotic conflicts.</p>
<p>Deleuze and Guattari stress that Oedipus is not merely an internal instrument — it is also an instrument of colonialism. The colonizer imposes the familial frame (daddy–mommy) upon the colonized in order to cut them off from the political and social investments of their own desire — a "cultural euthanasia" through oedipalization. The problem of Oedipus in primitive societies is especially stark: there Oedipus is an "empty, unoccupied limit," because in the territorial system the family is "open" and coincides with the entire socio-historical field. The conditions for Oedipal triangulation in the "3 + 1" format do not exist there, since identifications are group-based and partial, not personal and global. Deleuze and Guattari criticize both the universalists (who see Oedipus as an invariant) and the culturalists (like Malinowski) on the ground that both sides remain trapped in familialism — they treat the family as a "microcosm" that supposedly exists prior to the social field.</p>
<p><strong>Universal history as contingency</strong></p>
<p>For Deleuze and Guattari universal history is not a history of necessity or continuity but a history of contingency, of cuts and limits. Capitalism arose from accidental conjunctions of circumstance and unforeseen encounters of decoded flows. At the same time — following Marx — capitalism allows the whole of history to be understood retroactively, because only in it does the essence of production reveal itself in its pure, decoded form. As in Marx's remark that "human anatomy is the key to the anatomy of the ape," the bourgeois economy provides the key to the ancient economies — but an ironic and critical key, not a teleological one.</p>`

        title: "Introduction to Schizoanalysis (AO Chapter 4)",
        html: `<p>The final chapter of <em>Anti-Oedipus</em> passes from critique to construction, formulating the program of schizoanalysis — a new method for analyzing the unconscious and the social field. Ian Buchanan describes this program as an attempt at a theoretical "reconciliation of psychoanalysis with Marxism" — but a reconciliation requiring a radical transformation of both disciplines. Schizoanalysis is defined as an analysis at once transcendental (examining the immanent criteria of the field of the unconscious instead of imposing external laws upon it, such as Oedipus) and materialist (treating the unconscious as a factory producing reality, not a theater of representations). Its program comprises negative (destructive) and positive tasks, which must be carried out simultaneously — their co-determination is crucial, since one cannot discover the desiring-machines (the positive task) without first demolishing the Oedipal screens (the negative task), nor demolish Oedipus without at the same time setting desiring-production in motion.</p>
<h4 class="r-h3">8.1 The Negative (Destructive) Tasks</h4>
<p><strong>The curettage of the unconscious</strong></p>
<p>The metaphor of the curettage (scraping out) of the unconscious expresses the radicalism of the destructive task. The point is not to "work through" problems — which in fact preserves and internalizes them — but to demolish them physically. Schizoanalysis strives to cleanse the field of desire of the ideological and personological forms imposed upon it.</p>
<p><strong>Destroying Oedipus, castration, the superego</strong></p>
<p>Oedipus is seen not as a psychological fact but as a "counterfeit image," a mask that repression places over desire. The task is to show that desire is by nature anoedipal and directed at the entire socio-historical field. Castration — the ideology that introduces lack into desire — must be destroyed as a "despotic archaism" that totalizes the molecular signs of the unconscious. The superego and the "I" are molar structures that imprison pre-personal singularities — schizoanalysis smashes these marionettes, freeing the flows they block.</p>
<p><strong>The deconstruction of transference</strong></p>
<p>Psychoanalytic transference is deemed a "gigantic perversion" and an instrument for imposing Oedipus under the artificial conditions of the consulting room. Schizoanalysis strives to "schizophrenize" the analytic field — to break up the closed patient–doctor relation in favor of an opening onto the social field. Instead of restaging family dramas on the couch, schizoanalysis wants to connect the subject with real social machines.</p>
<p><strong>Anti-theater</strong></p>
<p>Schizoanalysis rejects the model of the unconscious as theater in favor of the model of the factory. The destructive task consists in tearing down the theatrical scenery of Oedipus and Hamlet, which stands in for real machinic processes. The schizoanalyst is a "mechanic," not a "director" — he repairs machines and sets them running instead of staging performances.</p>
<p>The BwO plays a key role in the negative task. It is the "zero plane" of intensity onto which the process of production withdraws when it is blocked by the structures of Oedipus. In the context of the negative task the BwO serves as the surface from which organization (the organism) and the "judgment of God" (the stratifications) must be removed. It is the site of resistance to molar organization — schizoanalysis uses the BwO as a plane of deterritorialization on which the desiring-machines can be restarted outside the frames of the "I" and the family.</p>
<p>The link between the negative task and the critique of capitalism is direct. Capitalism by its nature decodes the flows of desire (the schizophrenic process), yet at the same time fears them and violently reterritorializes them onto "artificial residues" such as the family and Oedipus. Oedipus is the private territoriality that capitalism produces in order to neutralize its absolute exterior limit, which is schizophrenia. The task of schizoanalysis is to break up these reterritorializations — not to treat schizophrenia as an illness (which is the result of the interruption of the process), but to complete the schizophrenic process, carrying it through to its revolutionary outlet.</p>
<h4 class="r-h3">8.2 The First Positive Task: Discovering the Desiring-Machines</h4>
<p><strong>Leclaire's rule</strong></p>
<p>The first positive task consists in discovering, in a subject, the nature, formation, and functioning of his desiring-machines, entirely independently of any interpretation. Schizoanalysis looks for discordant, mutually independent elements bound together only by an "absence of bond." These elements (partial objects) cannot be opposed determinations of one and the same essence (like the male and female sex); they must be really distinct entities. This is a rule taken from Leclaire, but radicalized — the investigation must cross the threshold of dispersion at which desire loses its imaginary identity and its structural unity.</p>
<p><strong>Machinic indices</strong></p>
<p>The discovery of the desiring-machines proceeds through the analysis of the machinic indices found in the subject's social and technical machines. Schizoanalysis discovers that desire directly invests the socio-historical field, and that love and sexuality are only the indices of these deep investments. The positive goal is to convert primal repression (the moment when the BwO repels the organs) into a functioning based on attraction and the production of intensities.</p>
<p><strong>Functionalism: "How does it work?"</strong></p>
<p>The fundamental methodological change introduced by schizoanalysis is the replacement of the hermeneutic question ("what does it mean?") with the functional question ("how does it work?"). Schizoanalysis is exclusively functional in character — it does not look for hidden meaning but investigates the mechanisms of the production of reality. It establishes what the subject feeds into his machines, what he draws out of them, and what breakdowns make up their operation.</p>
<p>This change of question is not merely a rhetorical device but expresses a deep ontological difference. The question "what does it mean?" assumes that behind phenomena lies a hidden sense to be uncovered through interpretation — and this hidden sense inevitably turns out to be Oedipal (everything "means" daddy and mommy). The question "how does it work?" assumes instead that phenomena are processes of production to be described in mechanical terms — what connections occur, what flows are produced, what cuts organize them. Schizoanalysis replaces associations (which always lead to Oedipus) with dissociations — the freeing of pure singularities from the yoke of molar organizations.</p>
<h4 class="r-h3">8.3 The Second Positive Task: The Social Investments of the Libido</h4>
<p><strong>Subject-groups versus subjugated groups</strong></p>
<p>The second positive task consists in reaching the unconscious libidinal investments of the social field and distinguishing them from the preconscious investments of interest. Deleuze and Guattari distinguish two kinds of group organization. Subjugated groups (groupes assujettis) are characterized by an unconscious paranoiac and reactionary investment — they subordinate desiring-production to molar structures of power, reinforcing hierarchies and group narcissism. Even groups that are revolutionary at the level of interest can remain subjugated groups at the level of desire. Subject-groups (groupes-sujets) are characterized by revolutionary libidinal investments — they subordinate the forms of power to desiring-production, invent "mortal" (mutable) institutions, and strive to liberate flows.</p>
<p><strong>The paranoiac pole versus the schizo-revolutionary pole</strong></p>
<p>The libido's investments in the social field oscillate between two poles, which constitute "the matrix of every unconscious social investment." The paranoiac-reactionary (fascisizing) pole invests the central sovereign formation (State, Nation, Capital), strives for territorialization, wedges desire into codes and axioms, and supports segregation and racism. Its motto is: "Yes, I am one of you, I belong to the superior race." The schizo-revolutionary (nomadic) pole follows the lines of flight, scales the walls of the system, decodes flows, and strives for absolute deterritorialization. Its motto is: "I am not one of you; I have belonged to the inferior race from all eternity; I am a beast."</p>
<p>Crucially, the question of "which side" a given desire is on is always a micropolitical question — it concerns molecular investments, not professed ideologies. This explains the phenomenon that fascinated Reich: why did the masses desire fascism? The answer lies neither in ideology nor in deception, but in desire — the libido can invest a repressive system because desire is part of the economic base, not of the superstructure. One can objectively have a revolutionary interest (at the level of preconscious class interest) and at the same time unconsciously desire repression (at the level of libidinal group investment).</p>
<p><strong>The four theses of schizoanalysis</strong></p>
<p>The program of schizoanalysis rests on four fundamental theses concerning desire:</p>
<p>1. Every investment of the libido is social — desire directly invests the socio-historical field, races, classes, and machines.</p>
<p>2. One must distinguish the unconscious libidinal investment (of group/desire) from the preconscious investment of interest (of class/interest) — one can objectively have a revolutionary interest while unconsciously desiring repression.</p>
<p>3. The unconscious's investments of the social field are primary with respect to familial investments — Oedipus is only a secondary "application" of the social field onto the small family triangle.</p>
<p>4. Social investments oscillate between a paranoiac pole (reactionary, fascisizing, territorializing) and a schizoid pole (revolutionary, nomadic, deterritorializing).</p>
<h4 class="r-h3">8.4 The Balance Sheet–Program</h4>
<p><strong>The definition of desiring-machines (recurrent communication)</strong></p>
<p>The balance sheet–program that closes <em>Anti-Oedipus</em> performs a double function: it is at once a summation of the entire argument and a program for future research. In the summarizing balance sheet, desiring-machines are defined above all as systems of recurrent communication — neither simple tools nor projections of the imagination, but real systems in which heterogeneous elements enter into functional relations. The authors categorically reject treating the machine as a metaphor — desire is a machine, and the machine is desiring. A desiring-machine comes into being when really distinct parts of the world are brought into communication in a system whose probability is low, and man becomes a component part of that machine. The machine is a "daughter born without a mother" — the orphanhood of the unconscious, deriving not from biological reproduction but from connections on the full body of the socius or the BwO. The machines represent nothing — they are pure intensive and affective states, devoid of any signifying function.</p>
<p><strong>Table: schizoanalysis versus psychoanalysis</strong></p>
<div class="r-table"><table><tr><td>Feature</td><td>Psychoanalysis</td><td>Schizoanalysis</td></tr><tr><td>Model of the unconscious</td><td>Theater of representations (myths, tragedies)</td><td>Factory producing reality</td></tr><tr><td>Central construct</td><td>Oedipus and Castration (ideology of lack)</td><td>Desiring-machines and the BwO (plenitude)</td></tr><tr><td>Key question</td><td>"What does it mean?"</td><td>"How does it work?"</td></tr><tr><td>Subject</td><td>Global person (daddy–mommy–me)</td><td>Molecular singularities, n sexes</td></tr><tr><td>Energy</td><td>Desexualization/Sublimation</td><td>Molecular libido (social investment)</td></tr><tr><td>Aim of therapy</td><td>Neuroticization (submission to debt)</td><td>Schizophrenization (completion of the process)</td></tr><tr><td>Unconscious</td><td>Oedipalized, structured</td><td>Orphan, anarchist, atheist</td></tr><tr><td>Transference</td><td>Instrument for reproducing the family debt</td><td>To be dispersed (schizophrenized)</td></tr></table></div>
<p><strong>The concept of the "new earth"</strong></p>
<p><em>Anti-Oedipus</em> closes with the concept of the "new earth" — a conception that is neither a utopian promised land nor a future state, but something created in the very course of deterritorialization. It is a "haven of healing" in which desire is no longer blocked by codes or axioms. The program of schizoanalysis strives to ensure that the process of deterritorialization does not end in a breakdown into illness but becomes a breakthrough toward the new earth. The new earth arises when artistic, scientific, and analytic machines become component parts of the revolutionary machine, forming a plane of immanence on which desire produces reality without the mediation of lack.</p>
<p>The concept of the new earth joins the Nietzschean Eternal Return and the Marxian idea of self-abolishing alienation, forming a horizon in which the identity of nature, industry, and history is fully realized. Yet it is not a goal pursued in linear fashion — it is rather the immanent possibility of every act of deterritorialization, of every line of flight opening onto what has not yet been coded.</p>
<p>The link between psychoanalysis and capitalism, sketched in chapter four, closes the circle of <em>Anti-Oedipus</em>'s argument. Just as Ricardo discovered the subjective and abstract essence of wealth in "labor in general," so Freud discovered the subjective essence of desire in "libido in general." Both systems rest on an absolute decoding of flows: capitalism destroys the old territorial codes in favor of free labor and money, and psychoanalysis dissolves the mythic and social codes in favor of quantitative flows of libido. But both immediately carry out operations of alienation: capitalism alienates labor into private property, and psychoanalysis alienates desire into the privatized family. Psychoanalysis is thus "a gigantic perversion and autism proper to the machine of capital" — its aim is not to cure but to neuroticize and oedipalize, so as to turn man into an obedient worker and consumer. The role of money in psychoanalysis lays this connection bare: therapy rests on a bourgeois contractual relation involving an endless exchange of "a flow of words for a flow of money."</p>
<p>The task of schizoanalysis is to sever this alliance of psychoanalysis with capitalism, restoring to desire its revolutionary productive power. This is not a utopian program but an immanent one — it consists in following the lines of flight that already exist in science, art, and politics, and in transforming flight into an active breach that not only escapes the system but makes "everything that is ossified in the system take flight."</p>`

        html: `<p>The analysis of the four chapters of <em>Anti-Oedipus</em> reveals the strictly logical architecture of a work which, despite its apparent stylistic chaos and its overload of references from the most varied fields of knowledge (psychoanalysis, Marxism, ethnology, molecular biology, literature, cybernetics), follows a precise argumentative plan.</p>
<p>Chapter one lays the ontological foundation — the three passive syntheses, the BwO, the desiring-machines, the nomadic subject — supplying the conceptual apparatus with which the functioning of desire can be described outside the psychoanalytic frame.</p>
<p>Chapter two uses this apparatus for a systematic critique of psychoanalysis, showing that each of the three syntheses can be used legitimately (immanently, molecularly) or illegitimately (transcendently, molarly), and that psychoanalysis systematically performs the latter use through three paralogisms: extrapolation, the double bind, and application.</p>
<p>Chapter three extends the analysis to the level of universal history, showing how the three great social formations — territorial, despotic, and capitalist — code, overcode, or decode the flows of desire, and how Oedipus "finally arrives" only under capitalism, as its internal colony.</p>
<p>Chapter four formulates the positive program of schizoanalysis — the method that is to replace psychoanalysis, joining the destructive tasks (the curettage of Oedipal structures) with the positive ones (the discovery of the desiring-machines and of the social investments of the libido), striving finally to open the space of a "new earth" on which desire and production are identical.</p>
<p>The connections between the chapters are tight and multi-layered, forming a dense network of mutual references and resonances.</p>
<p>The concept of the BwO from chapter one — the sterile surface of antiproduction on which intensities are recorded — returns in chapter three as the socius, the full body of the social machine. The Earth, the Despot, and Capital are historical figures of the BwO, performing the same function of quasi-cause at the collective level: they appropriate to themselves productive forces that do not originate in them. This homology between the individual BwO and the social socius is one of the most important theoretical achievements of <em>Anti-Oedipus</em> — it makes it possible to pass from the analysis of the unconscious to the analysis of social formations without introducing any mediation (such as the family in psychoanalysis or ideology in vulgar Marxism).</p>
<p>The three passive syntheses of chapter one — connective, disjunctive, conjunctive — return in chapter two in the analysis of their legitimate and illegitimate uses, yielding six categories (partial/global, inclusive/exclusive, nomadic/segregative) and three paralogisms (extrapolation, double bind, application). The same syntheses are then mapped onto the three social formations in chapter three: territorial coding corresponds to the connective synthesis (the coupling of flows), despotic overcoding corresponds to the disjunctive synthesis (recording on the full body), and capitalist decoding corresponds to the conjunctive synthesis (the consumption of decoded flows by the privatized subject).</p>
<p>The distinction between the molar and the molecular, introduced in chapter one, becomes the key to understanding both the critique of psychoanalysis (chapter two: psychoanalysis performs a molar totalization of the molecular processes of desire) and universal history (chapter three: every social formation is a molar capture of molecular flows that ceaselessly threaten its cohesion), and finally the foundation of the program of schizoanalysis (chapter four: schizoanalysis strives to reach beyond the molar illusions to the molecular productive forces).</p>
<p>The question "what does it mean?" versus "how does it work?" runs through all the chapters as a leitmotif: in chapter one it is formulated as the program of materialist psychiatry; in chapter two it serves the critique of psychoanalysis's hermeneutic approach; in chapter three it marks the difference between territorial representation (which asks about the usefulness of the sign) and despotic representation (which asks about meaning); in chapter four it becomes the fundamental methodological principle of schizoanalysis.</p>
<p>Finally, the breakthrough/breakdown opposition — present in chapters two and four — gives the whole of <em>Anti-Oedipus</em> its ethical and political dimension. Schizophrenia as process is a positive creative force; schizophrenia as clinical entity is the result of the repression of that process. The task of schizoanalysis is not to treat the illness but to cure humanity of the "therapeutic cure" that is neuroticization — that is, to open the way toward a new earth on which desire and production are identical.</p>
<p>This spiral return of the same concepts at ever higher levels of analysis gives <em>Anti-Oedipus</em> its characteristic density and coherence — contrary to many readers' impression, the work is not so much "mad" as rigorously and relentlessly systematic. Its apparent chaos is rather the effect of the richness of its material and of the ambition of a synthesis that joins psychoanalysis, Marxism, ethnology, biology, and aesthetics in a single ontological project — a project whose stake is nothing less than a redefinition of what desire, the subject, and society are.</p>`

        html: `<h4 class="r-h3">9.1. Introduction: From Tree to Rhizome</h4>
<p>The first plateau of <em>A Thousand Plateaus</em> — entitled simply "Introduction: Rhizome" — serves a programmatic function for the work as a whole. In it Deleuze and Guattari establish the fundamental methodology of "nomad thought," opposing the nonlinear, decentered <strong>rhizome</strong> to the hierarchical, binary structures of Western <strong>arborescent</strong> (tree-like) thinking. This plateau is not merely a theoretical introduction — it is an ontological and epistemological declaration that conditions the way all the remaining plateaus are to be read.</p>
<p>The authors formulate three models of the book, which correspond at the same time to three models of thinking and three models of the organization of reality: the <strong>root-book</strong>, the <strong>radicle-system</strong>, and the <strong>rhizome-book</strong>. The root-book is the classical figure of Western thought — a signifying, subjective organic interiority that imitates the world by way of reflection (mimesis). The radicle-system is the modern variant: the taproot has been severed, yet a summital unity survives as a latent totality. The fragmentation we meet in Joyce or Nietzsche merely invokes a higher unity. Only the rhizome-book accomplishes the true departure from unity — it subtracts the one from the multiple according to the formula n–1.</p>
<h4 class="r-h3">9.2. The Six Principles of the Rhizome</h4>
<p>Deleuze and Guattari single out six interconnected principles that define the rhizome:</p>
<p><strong>Principles 1 and 2: Connection and heterogeneity.</strong> Any point of a rhizome can and must be connected to any other. Unlike the tree, which fixes an order and assigns points, the rhizome connects semiotic chains of every nature — biological, political, economic — with highly diverse modes of coding and states of things. There is no privileged point here: linguistic semiosis connects directly with the material state of a body, an economic flow with a political discourse.</p>
<p><strong>Principle 3: Multiplicity.</strong> Multiplicity is treated here as a substantive, not an adjective. There is neither subject nor object — only determinations and dimensions that cannot increase without the multiplicity itself changing in nature. A multiplicity is defined not by interior points but by the "outside" — the lines of flight or deterritorialization along which it connects with other multiplicities. This concept is one of the most significant conceptual contributions of <em>A Thousand Plateaus</em> and is developed in plateau 2 (in the context of the critique of Freud) and in plateau 10 (as the substance of becoming).</p>
<p><strong>Principle 4: Asignifying rupture.</strong> A rhizome may be broken or shattered at any point, but it will start growing again — along one of its old lines, or along new lines. It is an "anti-genealogy." It contains lines of segmentarity (territorialization) and lines of flight (deterritorialization), which ceaselessly intertwine. This principle anticipates the later analysis of the three lines in plateaus 8 and 9.</p>
<p><strong>Principles 5 and 6: Cartography and decalcomania.</strong> The rhizome is a <strong>map</strong>, not a <strong>tracing</strong>. The tracing always "comes back to the same," reproducing a ready-made model or deep structures — it is an instrument of reproduction and representation. The map, by contrast, is entirely oriented toward experimentation in contact with the real: open, connectable, detachable, reversible. The authors' methodological rule runs: "plug the tracings back into the map" — so as to reopen blocked lines of flight and restore their transformative potential.</p>
<h4 class="r-h3">9.3. The Concept of the "Plateau"</h4>
<p>The term "plateau" is borrowed from Gregory Bateson, who in his studies of Balinese culture described a "continuous, self-vibrating region of intensity" that avoids any orientation toward a climax or an external end. Unlike a chapter, which has a culmination and a point of termination, a plateau is a region of intensity whose energy is not discharged in a finale but persists as a continuous vibration. Each plateau in the book is "a multiplicity connected to other multiplicities by superficial underground stems" and — importantly — can be read in any order. The very layout of the book realizes the principles of the rhizome: no linear progression, no teleology, a multiplicity of entry points.</p>
<h4 class="r-h3">9.4. Map vs. Tracing — Methodological Implications</h4>
<p>The map/tracing opposition has far-reaching methodological implications. The tracing copies something that already exists — it represents an alleged "competence" and translates the map into an image. Psychoanalysis is for the authors the paradigmatic example of tracing-thought: it reproduces a ready-made model (the Oedipal triangle) and overlays it on every case, instead of constructing a map of concrete multiplicities and lines of flight. Chomsky's generative linguistics is another tracing — grammatical trees as "markers of power" reproducing the arborescent model. The map, by contrast, has multiple entrances — it is a "performance," not a competence. It is constructed in contact with the real, not from a pre-established model. The methodological rule "plug the tracings back into the map" is an instruction for transforming closed systems of representation into open processes of experimentation.</p>
<h4 class="r-h3">9.5. The Book as Assemblage</h4>
<p>The authors reject the idea of the book as an "image of the world." The book is an <strong>assemblage</strong> — a "little machine" that has neither object nor subject. It is made of variously formed matters and very different speeds; it exists only through the "outside" and on it, being plugged into other machines (war machines, revolutionary machines, literary machines). The concept of assemblage, introduced here in embryonic form, is fully developed in plateau 3 ("The Geology of Morals"), where it acquires a precise definition comprising a horizontal axis (machinic assemblage of bodies / collective assemblage of enunciation) and a vertical axis (territory / deterritorialization). The book does not imitate the world — it is a machine functioning in the world, "plugged into" other machines, producing real effects.</p>
<p>Among the examples illustrating the logic of the rhizome, the most telling is the image of <strong>the wasp and the orchid</strong>: they form a rhizome through "aparallel evolution." The orchid deterritorializes itself by forming an image of the wasp, and the wasp reterritorializes itself on that image — this is a "capture of code," not simple imitation. The image will return in plateau 10 as the model of the block of becoming. Other examples include animal burrows (animal rhizomes functioning as shelter, provision, movement, and escape), rats and ants (which cannot be destroyed, because they rebuild themselves through manifold connections), and grass and weeds — the authors cite Henry Miller in maintaining that "the brain is much more a grass than a tree." Heinrich von Kleist is praised for creating a "broken chain of affects" and a "book–war machine" existing only on the outside — his writing realizes the logic of the rhizome avant la lettre.</p>
<p>Plateau 1 thus establishes not only the methodology for reading <em>A Thousand Plateaus</em> but also the ontological frame within which reality is not a hierarchical tree of beings but a rhizome — a heterogeneous network of connections, multiplicities, and lines of flight. Each subsequent plateau develops and concretizes this frame with respect to specific problems: psychoanalysis, geology, linguistics, politics, aesthetics.</p>`
      },
      {
        id: 11,
        title: "Multiplicity and the Critique of Psychoanalysis (Plateau 2)",
        html: `<h4 class="r-h3">10.1. From the Pack to the Father: The Procedure of Reduction</h4>
<p>The second plateau — "1914: One or Several Wolves?" — is a frontal attack on psychoanalytic procedure. The central object of the critique is Freud's analysis of the case of the "Wolf-Man." When the patient recounts a dream of six or seven wolves sitting in a tree, Freud's immediate reaction is to reduce this number to unity. Through a series of subtractions — the seven wolves become the six goat-kids eaten in the fairy tale; the seventh is the kid hidden in the clock; the five wolves refer to five o'clock (the presumed hour of the primal scene) — Freud arrives at the conclusion: "One wolf: the wolf is the father."</p>
<p>Deleuze and Guattari maintain that "any child knows" that wolves travel in packs, and yet Freud treats the animal merely as a <strong>representative</strong> of a family member. For Freud an animal can only ever represent a relation between the parents, never a "call to becoming-wolf." Psychoanalysis operates here as a "despotic agency" that replaces "asignifying proper names" with "the dreary unity of an object declared lost."</p>
<h4 class="r-h3">10.2. Pack and Mass — Canetti's Distinction</h4>
<p>Drawing on Elias Canetti, the authors distinguish two types of multiplicity, which coexist and interpenetrate. The <strong>mass</strong> (molar multiplicity) is characterized by large quantity, divisibility, equality of its members, hierarchy, and territorialization — it is the "paranoiac position" of a subject securely embedded in the group. The <strong>pack</strong> (molecular multiplicity) is defined by small numbers, dispersion, non-decomposable variable distances, and the impossibility of establishing a hierarchy. The pack constitutes itself through lines of flight or deterritorialization — in it one is always on the edge, in the "schizo position."</p>
<p>This distinction is of fundamental importance for the entire schizoanalytic project: the unconscious is not an Oedipal (molar) theater but a factory — a machinic field of packs, intensities, and becomings (molecular). Molar multiplicities are extensive, divisible, organizable; molecular multiplicities are libidinal, unconscious, and intensive, composed of particles that do not divide without changing in nature.</p>
<h4 class="r-h3">10.3. The Body without Organs and the Wolf-Man</h4>
<p>The Body without Organs (BwO) appears here as the "full body," the surface of recording on which multiplicities spread out. "Zero" is the Wolf-Man's BwO — it denotes not a lack but a positive "matrix of intensity." The BwO is not an empty body but one on which the organs (the wolves' eyes, jaws, anuses) are distributed like a "crowd" in Brownian motion. The wolves represent a "threshold of intensity" on the BwO.</p>
<h4 class="r-h3">10.4. Becoming-Wolf</h4>
<p>Becoming-animal is a real process, not a fantasy or an imitation. It is not mimicry — it is an emission of particles that enter a "zone of proximity" with animal particles. Every pack has its <strong>Anomalous</strong> or "Outsider" — a borderline figure with whom the subject contracts a "monstrous alliance" in order to unleash a becoming. Captain Ahab's Moby Dick is such an Anomalous — the "Unique," the borderline of the pack. These concepts are fully developed in plateau 10.</p>
<p>It is worth stressing that Deleuze and Guattari reinterpret the wolf dream in a manner radically different from Freud's: the wolves are not symbols but <strong>intensities, speeds, and temperatures</strong>. The name "Wolf-Man" is a true proper name, because it is "an instantaneous apprehension of a multiplicity." The "field of anuses" connects the "wolf-machine" with the "anal machine" — the child holds on to the wolves by his anus, which is not an Oedipal regression but a composition of speeds and affects on the BwO. The key references are Jung, praised for seeing multiplicity where Freud saw unity, and Riemann and Bergson, cited for the mathematical and philosophical grounding of the theory of multiplicities. Virginia Woolf experiencing herself as a "troop of monkeys" or a "school of fish" is a literary example of molecular multiplicity that psychoanalysis is incapable of grasping with its tools.</p>
<p>This plateau thus formulates a fundamental alternative to psychoanalysis: instead of the reduction of multiplicity to unity (Father, Phallus, Castration), schizoanalysis proposes a theory of multiplicity as the substance of the unconscious — a machinic field of packs, intensities, and becomings. The critique extends to Melanie Klein, whose case of "Little Richard" (the child's geopolitical maps) was reduced to "daddy and mommy" — and yet the child was drawing maps of empires, of naval and aerial battles, not family scenes. Psychoanalysis cannot see what is obvious to the child: multiplicities are real, packs are real, intensities are real. Their reduction to molar unities is an act of semiotic violence — an overcoding of flows that ought to circulate freely on the BwO.</p>
<p>The mathematical grounding of the theory of multiplicities comes from Riemann (continuous multiplicities defined by dimensions, not by points) and Bergson (qualitative versus quantitative multiplicities). Deleuze and Guattari transform these inspirations into an instrument for the critique of psychoanalysis and — more broadly — of all thinking that reduces n to 1 instead of performing the operation n–1.</p>`
