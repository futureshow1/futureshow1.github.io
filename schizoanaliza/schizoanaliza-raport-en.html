      {
        id: 12,
        title: "The Geology of Morals — Stratification (Plateau 3)",
        html: `<h4 class="r-h3">11.1. Strata and Double Articulation</h4>
<p>The plateau "10,000 B.C.: The Geology of Morals (Who Does the Earth Think It Is?)" constructs an ontology of stratification, crucial for understanding the relation between order and chaos. The <strong>strata</strong> are described as "layers" or "belts" existing as thickenings on the Body of the Earth (the Body without Organs). They consist in giving form to unstable matters and in "imprisoning" free intensities in systems of resonance and redundancy. Stratification is compared to the "judgment of God" — an inescapable operation that organizes "nomadic singularities" into molar aggregates.</p>
<p>Following the linguist Louis Hjelmslev, the authors maintain that every stratum is "doubly articulated" — it has a "double pincer" or "double bind." The <strong>first articulation</strong> (content) "selects or deducts" metastable molecular units from unstable flows and imposes upon them a statistical order of connections. In Hjelmslev's terms this comprises the form of content (order) and the substance of content (the selected matter). The <strong>second articulation</strong> (expression) establishes functional, compact, stable structures and constructs the molar compounds in which these structures are actualized. The key geological example: <strong>sedimentation</strong> is the first articulation (the deposition of units), and <strong>folding</strong> is the second (the establishment of a stable structure). Between content and expression there is no correspondence of the "signified–signifier" type — only isomorphism and mutual presupposition.</p>
<h4 class="r-h3">11.2. The Three Major Strata</h4>
<p>The authors single out three major strata, each characterized by a specific configuration of the relation between content and expression:</p>
<p>The <strong>physicochemical strata</strong> are governed by resonance and "amplifying structuration," in which the molar expresses molecular interactions. The crystal is the paradigmatic example: it is the macroscopic (molar) expression of microscopic (molecular) interactions. On this stratum content is molecular and expression molar — a relatively simple relation, though not without its complexities.</p>
<p>The <strong>organic strata</strong> are distinguished by linearity, which constitutes their fundamental innovation. Unlike crystals, confined to three-dimensionality, the organic stratum sets apart an autonomous "line of expression" — the sequences of nucleic acids (DNA, RNA). This linearity allows the organism to attain a far higher threshold of deterritorialization and reproduction than the crystal. The genetic code constitutes an autonomous line of expression, independent of the substances in which it is actualized — this is "the deterritorialization proper to life." Here <strong>epigenesis</strong> appears as the process by which the organism develops not according to a preformed plan but through successive inductions and differentiations — which provides a model for the concept of the plane of consistency.</p>
<p>The <strong>alloplastic</strong> (anthropomorphic) <strong>strata</strong> introduce a new distribution of content and expression. Content is bound to the <strong>hand–tool</strong> pole (formal manual traits), and expression to the <strong>face–language</strong> pole (vocal/symbolic traits). This stratum introduces <strong>translation</strong> and <strong>translatability</strong> — the fundamental innovation that allows language to represent all the other strata. There appears a "superlinearity" of linguistic expression, which absorbs genetic linearity and transforms it into the symbolic. Technology (the tool) and language (the symbol) form the "double articulation" specific to the human stratum — yet the authors warn against anthropocentrism: the alloplastic strata are not "higher" than the organic or physicochemical ones, merely differently configured.</p>
<h4 class="r-h3">11.3. The Abstract Machine and the Assemblage</h4>
<p>The abstract machine exists in two coexisting states: as <strong>enveloped</strong> (the Ecumenon) — a prisoner of stratification, defining the "unity of composition" of a given stratum (e.g., the "abstract Animal"); and as <strong>developed</strong> (the Planomenon) — cutting across all stratifications, unfolding on the plane of consistency in order to pilot the flows of absolute deterritorialization. It is pure "Matter-Function," which knows no distinction between content and expression.</p>
<p>The <strong>assemblage</strong> (<em>agencement</em>) is a "two-headed" concrete entity, distinct from the abstract machine though effectuating it. It has a side facing the strata (the machinic assemblage of bodies, i.e., content) and a side facing the plane of consistency (the collective assemblage of enunciation, i.e., expression). It secures the "co-adaptation" of content and expression on a stratum and regulates the relations between the strata and the plane of consistency.</p>
<h4 class="r-h3">11.4. Destratification and Its Dangers</h4>
<p>Destratification is the movement toward the plane of consistency, away from the "judgment of God." It is, however, fraught with dangers: violent destratification — blowing the strata apart too fast — leads to catastrophe, to a "suicidal collapse," or to falling into a "black hole." A stratum can also lose its configuration and proliferate wildly (like a cancer), creating "totalitarian and fascist BwOs," which are "terrifying caricatures of the plane of consistency." Hence the fundamental rule of caution: one must "mimic the strata" and retain small rations of subjectivity and organization in order to survive, while patiently dismantling the organism. The motif of caution — one of the guiding threads of the whole book — returns explicitly in plateau 6 and in the conclusion.</p>
<h4 class="r-h3">11.5. The BwO as the Body of the Earth</h4>
<p>The BwO is here identified with the "Body of the Earth" — the plane of consistency on which the strata form as "thickenings" or "residues." The BwO is not an empty body but one peopled by multiplicities, flows, and intensities. It is "unformed, unorganized, nonstratified" matter existing beneath all structures — the ontological ground on which the dialectic of stratification and destratification is played out.</p>
<p>Among the examples illustrating this ontology of stratification, the most extraordinary is Professor Challenger — a character borrowed from Arthur Conan Doyle, described as "apish" and "doubly articulated." His voice grows more and more animal as the lecture proceeds, until at last he deterritorializes on the spot, vanishing into the plane of consistency. The image illustrates the dynamics of destratification: even a lecturer delivering a treatise on the strata is susceptible to the forces that decompose him. The metaphor "God is a Lobster" (the double pincer of articulation) and the example of the tick (defined by just three affects — light, smell, warmth) enrich the conceptual arsenal of this plateau. The opposition between Geoffroy Saint-Hilaire (praised for the idea of a single "abstract Animal" realized through different foldings) and Cuvier (presented as a "rigid specialist" insisting that there are irreducible types) models the tension between the topological thinking of the plane of consistency and the metric thinking of stratification — a tension that returns in all the subsequent plateaus.</p>`
      },
      {
        id: 13,
        title: "Postulates of Linguistics (Plateau 4)",
        html: `<h4 class="r-h3">12.1. The Four Postulates and Their Critique</h4>
<p>The plateau "November 20, 1923: Postulates of Linguistics" is a systematic deconstruction of the basic assumptions of structural linguistics. The authors single out four postulates, each of which is subjected to critique:</p>
<p><strong>Postulate 1:</strong> "Language is informational and communicational." Critique: language is not about communicating information but about <strong>obedience</strong>. The schoolteacher does not inform the pupils about a rule — she "marks" the rule by issuing a command. Information is merely the minimum required for the transmission of order-words.</p>
<p><strong>Postulate 2:</strong> "There is an abstract machine of language that appeals to no external factor." Critique: there is no "language in itself." Linguistics is nothing without a pragmatics (semiotic or political) that defines the use of linguistic elements. Linguistic models are often not abstract enough, because they fail to reach the abstract machine that connects language with the micropolitics of the social field.</p>
<p><strong>Postulate 3:</strong> "There are constants or universals of language that make it possible to define it as a homogeneous system." Critique: every language is "an essentially heterogeneous reality." Following William Labov, the authors argue that variation is systematic and internal to the linguistic system, not an external error of performance.</p>
<p><strong>Postulate 4:</strong> "Language can be scientifically studied only under the conditions of a standard or major language." Critique: the unity of a language is fundamentally political, not scientific. The extraction of constants is bound up with the political enterprise of imposing them on speakers. There is no "mother tongue" — only a seizure of power by a dominant language within a political multiplicity.</p>
<h4 class="r-h3">12.2. The Order-Word as Elementary Unit</h4>
<p>The authors replace the "sign" or the "phoneme" with the <strong>order-word</strong> (<em>mot d'ordre</em>) as the elementary unit of language. The order-word is the relation of every word or utterance to implicit presuppositions — to the speech acts performed <em>in</em> the utterance. Language is made not to be believed but to be obeyed. Every order-word carries with it a "little death sentence," a verdict. It is the redundancy of act and utterance — it is through redundancy that the face of the father, the teacher, or the boss refers back to a center of signification.</p>
<h4 class="r-h3">12.3. Incorporeal Transformations</h4>
<p>Order-words express <strong>incorporeal transformations</strong> attributed to bodies. These are pure acts, recognizable by their instantaneity: the judge's sentence transforms the accused into a convict; the hijacker transforms the passengers into hostages. Expressions do not represent bodies — they <strong>intervene</strong> in them, to speed them up, slow them down, or regroup them. Incorporeal transformations constitute the linguistic "warp" in the "weft" of material bodies — a weaving metaphor that links this plateau with the analysis of striated space in plateau 14.</p>
<h4 class="r-h3">12.4. Indirect Discourse as the Primary Form</h4>
<p>Contrary to the belief that language begins with direct communication, Deleuze and Guattari maintain that <strong>indirect discourse</strong> is the primary form of language. Language always "goes from saying to saying" — narration consists in passing on what one has heard, not what one has seen. There is no individual enunciation: enunciation is always the product of a <strong>collective assemblage</strong>. Even the "I" is an order-word issuing from indirect discourse. The concept of the collective assemblage of enunciation, already developed in plateau 3, here acquires its full political force.</p>
<h4 class="r-h3">12.5. Continuous Variation and Becoming-Minor</h4>
<p>Style is a procedure of <strong>continuous variation</strong>. The minor author (Kafka, Beckett, Luca, Godard) makes his own language "stammer" — not through a speech defect, but by placing all its elements in variation. Atypical expressions function as <strong>tensors</strong>, wrenching correct forms out of their state as constants and pushing language toward its limit. The conjunction "and" can play the role of a tensor, overthrowing the ontology of the verb "to be" — replacing the logic of identity with a logic of conjunction and connection.</p>
<p>The distinction between a <strong>major</strong> language (defined by the power of constants and the establishment of a standard, e.g., standard British or American English) and a <strong>minor</strong> language (defined by the power of variation) is fundamentally political. All becoming is minoritarian — one must "conquer one's own language" in order to find the minor languages within it.</p>
<p>This plateau also introduces the concept of the <strong>tetravalence of the assemblage</strong>: the horizontal axis comprises the machinic assemblage of bodies and the collective assemblage of enunciation; the vertical axis marks the oscillation between territory and deterritorialization. The assemblage is thus a four-dimensional structure that cannot be reduced to either a purely linguistic or a purely material analysis. This tetravalence links the linguistic analysis of plateau 4 with the ontology of stratification of plateau 3 and the micropolitical analysis of plateaus 8 and 9.</p>
<p>The title itself — "November 20, 1923" — refers to the end of the hyperinflation crisis in Germany (the introduction of the Rentenmark), an example of the semiotic transformation of the monetary body — an incorporeal transformation par excellence, in which an order-word (a monetary decree) transforms the entire system of economic relations.</p>
<p>Among the references to other thinkers, the key ones are: Austin (performatives and illocutionary acts), Ducrot (the inversion of Benveniste's schema), Labov (variation as an internal component of language), Bakhtin/Voloshinov (a single word as a complete enunciation), and Chomsky (criticized for identifying the abstract with the universal/constant). The connection between major/minor language and the apparatus of capture and the war machine will become explicit in plateaus 12 and 13.</p>`
      },
      {
        id: 14,
        title: "Regimes of Signs (Plateau 5)",
        html: `<h4 class="r-h3">13.1. The Four Semiotic Regimes</h4>
<p>The plateau "587 B.C.–A.D. 70: On Several Regimes of Signs" constructs a typology of four principal semiotic regimes, each of which has its own logic, its own way of treating lines of flight, and its own form of deterritorialization.</p>
<p>The <strong>signifying</strong> (despotic) <strong>regime</strong> is characterized by the overcoding of all flows by a central instance of power. Every sign refers to another sign ad infinitum; signifiance replaces any concrete relation to a state of things. The whole set of signs refers to a supreme Signifier, which is a pure abstraction — marked at once by lack and by excess. "Interpretosis" — the disease of this regime — consists in the ceaseless assignment of signs to "hidden" meanings, which serves only to reproduce the Signifier. This regime does not tolerate lines of flight; it defines them negatively and assigns them to the <strong>scapegoat</strong>, which is expelled from the community, carrying with it the "evil" that threatens the system. The face is the icon of this regime — the Signifier needs a surface of inscription (a white wall) on which the signs can settle.</p>
<p>The <strong>post-signifying</strong> (subjective/passional) <strong>regime</strong>, illustrated by the history of the Jewish people, rests on subjectification rather than simple overcoding. In place of the central Signifier there appears a <strong>point of subjectification</strong>, from which proceeds a subject of enunciation tracing lines of passion. God turns his face away (becomes absent), and the subject, seized with fear, turns his face away too — this <strong>double turning-away</strong> traces a positive line of deterritorialization. The prophet is here distinguished from the priest: the priest interprets; the prophet is "ravished" by God — his madness is active, not ideational. Although the line of flight here receives a positive sign, it remains subjective and segmentary, which makes it ultimately "negative" in comparison with the absolute deterritorialization of the plane of consistency.</p>
<p>The <strong>counter-signifying</strong> (nomadic) <strong>regime</strong> is bound up with the nomads and their war machine. Instead of overcoding by the signifier, it operates with the <strong>number</strong> as its form of expression — the "numbering number" (<em>nombre nombrant</em>), not the numbered one. Deterritorialization in this regime proceeds along a line of active destruction or abolition of State structures.</p>
<p>The <strong>pre-signifying</strong> (polyvocal) <strong>regime</strong> occurs in primitive societies. It is characterized by a plurality of substances of expression (dance, gesture, rhythm) coexisting heterogeneously with the voice. It is segmentary and prevents the crystallization of the Signifier or the State through mechanisms of "anticipation-warding-off" and semiophagy (the devouring of the name/of the dead).</p>
<h4 class="r-h3">13.2. The Diagram and the Abstract Machine</h4>
<p>The abstract machine is the moment at which only unformed matters (<em>phylum</em>) and nonformal functions (<em>diagram</em>) remain. The diagram plays a piloting role: it does not represent reality but constructs a reality yet to come. It blurs the boundaries between particle and sign. The opposition between semiology (Saussure), confined to the signifying regime, and semiotics (Peirce/Hjelmslev), broader and pragmatic, constitutes the methodological frame of this plateau.</p>
<h4 class="r-h3">13.3. Mixed Semiotics and Pragmatics</h4>
<p>In practice the regimes are always mixed. Capitalism is a mixed semiotic, combining the imperial Signifier with Jewish and Christian subjectivity. The analysis of these mixtures — not the search for a universal Signifier — is the proper task of schizoanalytic pragmatics. Each regime treats lines of flight differently: the signifying regime curses them (the scapegoat), the subjective regime turns them into passional "proceedings," the counter-signifying regime uses them to destroy empires.</p>
<p>The dates in the plateau's title — 587 B.C. and A.D. 70 — refer to the destructions of the Temple in Jerusalem, marking the historical moment of transition to the subjective regime: the absence of God's face, the Ark as a portable packet of signs, the nation as an exilic subject. Moses as subject of enunciation anticipates God's will through flight and the "betrayal" of Egypt. Christ universalizes the system of betrayal — Judas becomes the "true man," and facialization extends over the whole body.</p>
<p>This plateau also introduces the distinction between Saussure's semiology (confined to the signifying regime, reducing signs to the signified–signifier relation) and the semiotics of Peirce and Hjelmslev (broader and pragmatic, capable of analyzing regimes without recourse to the "signifier"). Peirce's diagram as an icon of relations and Hjelmslev's net (matter, content/expression, form/substance) supply analytic tools that replace structural linguistics with pragmatics — a discipline capable of grasping the multiplicity of semiotic regimes in their historical and political concreteness.</p>
<p>The deterritorialization and reterritorialization of signs proceed differently in each regime: in the signifying regime deterritorialization is relative (the referral from sign to sign); in the subjective regime it becomes absolute, but negative (the black hole of consciousness). Reterritorialization takes place on the face (the icon) or in the "book." The face and faciality — the white wall / black hole system — form the link between this plateau and plateau 7, where the abstract machine of faciality receives its full analysis.</p>`
      },
      {
        id: 15,
        title: "How Do You Make Yourself a Body without Organs? (Plateau 6)",
        html: `<h4 class="r-h3">14.1. The BwO — Definition and Three Types</h4>
<p>The plateau "November 28, 1947: How Do You Make Yourself a Body without Organs?" develops the central concept of schizoanalysis, inaugurated by Antonin Artaud, who on that very day "declared war on the organs." The BwO is not a dead body — it is a body all the more alive the more the organization of the organs called the <strong>organism</strong> has been dismantled. The key distinction: the BwO is not the opposite of the organs; it is opposed only to the organism, that is, to a specific organization of those organs.</p>
<p>The authors distinguish three types of BwO: the <strong>full BwO</strong> — a successful BwO on the plane of consistency, peopled by intensities that circulate freely; the <strong>empty BwO</strong> — the result of too violent a destratification (e.g., the "glassy" addict, the catatonic schizophrenic), a body of nothingness with blocked intensities; and the <strong>cancerous BwO</strong> — belonging to a proliferating stratum (like fascism or money), in which the elements of the stratum begin to grow uncontrollably.</p>
<h4 class="r-h3">14.2. The Egg as Model of Intensity</h4>
<p>The BwO is modeled on the egg (the Dogon egg, the biological egg), representing a milieu of pure intensity. "Degree zero" signifies not a lack but a positive state of unformed matter. On the BwO the organs function only as pure intensities, thresholds, and gradients, not as fixed forms. Only intensities, waves, and vibrations flow and circulate on the BwO.</p>
<h4 class="r-h3">14.3. The Judgment of God and the Organism</h4>
<p>The "judgment of God" is the theological system that imposes a hierarchized organization upon the body in order to extract useful labor from it. It was precisely this system that Artaud fought. The three major "strata" of the judgment of God are: the organism (the organization of the organs), signifiance (the imposition of meaning), and subjectification (the constitution of the subject). The BwO oscillates between these surfaces of stratification and the plane of consistency.</p>
<h4 class="r-h3">14.4. The Art of Caution</h4>
<p>Deleuze and Guattari warn: one should use not a sledgehammer but "a very fine file," patiently dismantling the organism. The principle runs: <strong>mimic the strata</strong> — keep enough of the organism, of subjectivity, and of meaning to survive, while opening up "small plots of new land" for experimentation. Caution is an art of dosages, needed to avoid empty or cancerous bodies. This rule of caution is one of the most important ethico-political warnings of the whole of <em>A Thousand Plateaus</em>.</p>
<h4 class="r-h3">14.5. Practices of Constructing the BwO</h4>
<p>The authors analyze concrete practices, each of which constitutes a specific way of constructing a BwO:</p>
<p><strong>Masochism</strong> — the masochist uses suffering and constraints (sewing, binding) to annul the organs and keep them from operating according to the organism. He creates a program for untying desire from the external measure of pleasure, constructing a BwO that waves of pain can populate. Crucial here is the difference from the psychoanalytic interpretation: masochism is not a desire for suffering (which would still be subordinated to the category of pleasure) but a desire for intensity itself, freed from organismic logic.</p>
<p><strong>Courtly love</strong> — the renunciation or infinite deferral of external pleasure in order to build a field of immanence in which desire fills itself. "Joy" is the flow of desire, not the culmination that interrupts it. This model is especially important because it shows that the BwO is not exclusively destructive — it can be constructed as a space of intensive joy.</p>
<p><strong>Drugs</strong> — viewed as agents of molecular becoming, in which perception becomes molecular and "the imperceptible is perceived." The drugged body often seeks the BwO of "Absolute Zero" or of "Cold." Yet the authors warn that drugs all too often lead to the empty BwO — to catatonia, glassy bodies, suicidal collapse. Drugs alter the conditions of perception but rarely construct a durable plane of consistency.</p>
<p><strong>The Tao</strong> — Tantric practices constitute a circuit of intensity between male and female energy, avoiding ejaculation in order to sustain the field of immanence rather than discharge it. The Taoist model illustrates the idea of an intensive circuit in which desire strives not for satisfaction (which would be a form of reterritorialization) but for continuous circulation on the BwO.</p>
<p><strong>Spinoza</strong> is cited as the author of "the great book of the BwO" — his <em>Ethics</em> defines bodies by longitude (relations of speed) and latitude (intensive affects) on the plane of immanence. The Spinozist ontology of bodies as compositions of speeds and affects provides the philosophical ground for the concept of the BwO and is developed in plateau 10 as the foundation of haecceity.</p>
<p>This plateau serves as a bridge between <em>Anti-Oedipus</em> and <em>A Thousand Plateaus</em>, confirming the schizoanalytic program: the replacement of interpretation (what does it mean?) with experimentation (how does it work?). The BwO is the "matrix of production" for the real — a concept central to the "desiring-production" of the first volume. The reference to Castaneda — his distinction between the <strong>Tonal</strong> (the organism and everything organized) and the <strong>Nagual</strong> (the BwO and experimentation) — illustrates the need to "clean the tonal" while at the same time protecting it, in order to survive the nagual. Wilhelm Reich with his "rings of armor" (ocular, oral, and so on) provides the model of what must be dissolved, and William Burroughs — models of the "inefficient" human body and the "meat circuit" of intensities.</p>`

        id: 16,
        title: "Faciality (Plateau 7)",
        html: `<h4 class="r-h3">15.1. The Abstract Machine of Faciality</h4>
<p>The plateau "Year Zero: Faciality" analyzes the face not as a natural element of the human body but as the product of an <strong>abstract machine</strong> composed of two components: the <strong>white wall of signifiance</strong> (the surface of reference on which signs are inscribed and redundancies of frequency established) and the <strong>black hole of subjectification</strong> (the <em>locus</em> of resonance where consciousness and passion are lodged). The face system is the intersection of the two: a broad white wall (cheeks/surface) with black holes (eyes/points of resonance).</p>
<p>The authors distinguish the <strong>head/body system</strong> (a "volume-cavity" system, coded by biological functions) from the <strong>face system</strong> (a "holey surface" system). The face is produced only when the head is detached from the stratum of the organism and overcoded by the faciality machine. What is more, the body is "facialized" — a breast, a tool, an object can become a face when taken over by the white-wall/black-hole system. There is a fundamental correlation between the face and the <strong>landscape</strong> — just as the head becomes a face, so the milieu becomes a deterritorialized world.</p>
<h4 class="r-h3">15.2. The Face of Christ as the Western Standard</h4>
<p>"Year zero" refers to the birth of Christ, who is the central point of the European faciality machine. The face of Christ invented the facialization of the entire body and functions like a "central computer" for biunivocalization, organizing all possible faces into binary choices (man/woman, adult/child, white/black). The face of Christ is the "Average Sensual Man" — the standard measure for Western humanity.</p>
<h4 class="r-h3">15.3. Racism as the Measurement of Deviation</h4>
<p>Western racism does not operate by excluding "others" but by determining <strong>degrees of deviation</strong> from the standard of the White-Man-Christ. The machine scans the face and judges whether it "passes." If it deviates, it is categorized as a "type of divergence." Racism strives to integrate these deviations into ever more eccentric waves, or to erase them if they resist identification. The face is therefore inherently political — social control in contemporary society operates through the faciality machine.</p>
<h4 class="r-h3">15.4. Probe-Heads and the Dismantling of the Face</h4>
<p>Dismantling the face is a political act, involving breaking through the wall of the signifier and escaping the black hole of subjectivity. It is not a regression to the "primitive head" (which would be a nostalgic, neurotic trap) but the invention of new combinations. <strong>Probe-heads</strong> (<em>têtes chercheuses</em>) are navigational devices that appear when "defacialization" takes place — they decompose the strata, break through the wall of signifiance, and steer the flows into creative lines of flight. The aim is to free the "traits of faciality" like birds, combining them with freed traits of landscape, music, or painting, so as to attain a state of absolute, positive deterritorialization.</p>
<p>The faciality machine operates in different states and mixtures, producing four combinations: the limit-faces — terrestrial/despotic (black holes distributed on the white wall — a proliferation of eyes/signifiance) and maritime/authoritarian (the white wall unspooling toward a single black hole — passion/subjectification). The four circular components of pragmatics — generative (mixtures), transformational (creations), diagrammatic (abstract machines), and machinic (assemblages) — supply the tools for analyzing concrete configurations of faciality. Among the references: Spitz, Isakower, and Lewin (studies of child development and the "white screen" of the dream); Sartre and Lacan (criticized for making the "gaze" or the "mirror" primary, when they are secondary to the abstract machine of faciality); Giotto, Titian, and Eisenstein (illustrating the history of the "face of Christ" and the cinematic close-up as instruments of facialization); Henry James and D.H. Lawrence (the exploration of the "secret" and of the "line of flight" leading to the dismantling of the face).</p>
<p>This plateau connects with plateau 5 (the face as the icon of the signifying regime), with plateau 8 (the face and the secret), with plateau 10 (becoming-imperceptible as the dismantling of the face), and with plateau 14 (the haptic vs. the optical — the face as an optical structure whose dismantling leads to haptic perception).</p>`
      },
      {
        id: 17,
        title: "Three Lines and Micropolitics (Plateaus 8 and 9)",
        html: `<h4 class="r-h3">16.1. The Three Lines: Molar, Molecular, Line of Flight</h4>
<p>Plateau 8 ("1874: Three Novellas, or 'What Happened?'") and plateau 9 ("1933: Micropolitics and Segmentarity") form a diptych devoted to the cartography of lines — the central practice of schizoanalysis. The authors single out three types of line, which <strong>coexist in everything</strong> — in every life, every society, and every work of art:</p>
<p>The <strong>molar (rigid) line</strong> corresponds to the great structures — the state, social classes, the family, institutions. On this line life is divided into distinct stages and segments (school, army, work), and everything seems predictable and calculable. The <strong>molecular (supple) line</strong> operates at the level of micro-movements, small shifts in desire, leakages and "micro-cracks." Its segments are fluid, and its relations concern flows and particles, not fixed identities. The <strong>line of flight (rupture)</strong> is an abstract, nonsegmentary line corresponding to absolute deterritorialization. It does not join points but passes between them, leading to total transformation and to becoming "imperceptible."</p>
<h4 class="r-h3">16.2. The Secret: Content, Form, Clandestinity</h4>
<p>The evolution of the secret corresponds to the three lines: on the molar line the secret has a <strong>content</strong> — it is a "dirty little secret" (an Oedipal one, for instance), something hidden in the past. On the molecular line the secret becomes a <strong>form</strong> in itself — an unknowable and imperceptible matter. On the line of flight the secret attains <strong>clandestinity</strong> — there is no longer anything to hide; the subject becomes transparent and imperceptible.</p>
<h4 class="r-h3">16.3. Break, Crack, Rupture</h4>
<p>Three types of discontinuity correspond to the three lines: the <strong>break</strong> (molar) consists of great, sudden blows from outside (loss of fortune, illness) that shift us between rigid segments. The <strong>crack</strong> (molecular) happens almost without our knowledge, inside, when everything seems to be going well — a subtle change of intensity. The <strong>rupture</strong> (line of flight) is the point of no return — the past ceases to exist, and the subject becomes "imperceptible."</p>
<h4 class="r-h3">16.4. Molar and Molecular Segmentarity</h4>
<p>In plateau 9 the authors abandon the classical opposition between segmentary (primitive) and centralized (State) societies, arguing that modern states are just as segmentary, only in a rigid way. Every politics is at once macropolitics and micropolitics — neither exists without the other.</p>
<p>Molar (rigid) segmentarity is characterized by three features: <strong>binary oppositions</strong> (social classes, men–women, adults–children), <strong>concentric circles</strong> resonating in a single center (my house, my neighborhood, my city, my country — expanding circles, yet subordinated to a single center of power), and <strong>overcoded lines</strong> (a measurable, homogeneous space subjected to a single measure). This is the domain of the <strong>State apparatus</strong>, which produces and reproduces rigid segments.</p>
<p>Molecular (supple) segmentarity is a micro-segmentation based on flows of desire and belief — its segments are fluid, and its relations concern particles and quanta, not fixed identities. Each of us is composed of both segmentarities at once — molar and molecular. They are not simply "different scales" of the same phenomenon but two ontologically distinct orders that interpenetrate in every concrete case.</p>
<p>The two poles of the abstract machine correspond to these two segmentarities: the <strong>abstract machine of overcoding</strong> creates rigid segmentarity and homogeneous space (identified with the State apparatus), while the <strong>abstract machine of mutation</strong> operates through decoding and deterritorialization, tracing lines of flight and creating war machines.</p>
<h4 class="r-h3">16.5. Microfascism</h4>
<p>The analysis of fascism is one of the most penetrating achievements of this diptych. Fascism differs from totalitarianism in its origin: totalitarianism is a State operation of rigid overcoding; <strong>fascism is a mass movement grounded in microfascisms</strong>. Fascism arises from the proliferation of molecular "black holes" that begin to resonate with one another. It is a <strong>cancerous body</strong>, not merely a totalitarian organism — it penetrates the smallest cells of society (family, office, school). The danger of fascism lies in the fact that people desire their own repression by investing desire in micro-arrangements of power. Gabriel Tarde, the founder of a true microsociology, and Michel Foucault with his analysis of micro-powers supply the theoretical tools for this diagnosis.</p>
<h4 class="r-h3">16.6. Quantum Flows and Centers of Power</h4>
<p>A society is defined not by its contradictions but by what escapes it — by its lines of flight. Centers of power operate on the boundary between the molar lines and the quantum flows, possessing three zones: a zone of power (relating to the rigid segments), a zone of indiscernibility (dispersal into the microphysical social fabric), and a zone of impotence (the point at which power can no longer control the flows).</p>
<h4 class="r-h3">16.7. The Four Dangers</h4>
<p>Following Castaneda and Nietzsche, the authors name four dangers lying in wait along the lines: <strong>fear</strong> (fleeing the line of flight back into rigid segments and binary logic — the danger of the molar line); <strong>clarity</strong> (the monomanias and microfascisms flowing from molecular "black holes," the conviction that one has understood everything, which leads to setting oneself up as everyone's judge — the danger of the molecular line); <strong>power</strong> (the attempt to arrest the flows of mutation within an apparatus of overcoding — the danger on the boundary between the lines); and the fourth, most terrible of all — the <strong>passion for abolition</strong> (when the line of flight turns into a <strong>line of death</strong> and pure destruction, leading to the suicide of a state, as in fascism, or of an individual, as in the case of Ahab in <em>Moby-Dick</em>).</p>
<p>Literary analysis is an integral part of the argumentation of these plateaus. Henry James, in the novella "In the Cage," shows a telegraphist heroine living on a rigid segmentary line (job–fiancé) who enters into a molecular relation with a wealthy client until she reaches a state in which "she knows so much that she can no longer interpret anything" — and must choose between returning to the molar line and escaping onto the line of flight. F. Scott Fitzgerald in "The Crack-Up" analyzes his own fall as a passage from molar misfortunes to a molecular crack and the necessity of a "clean break." Pierrette Fleutiaux, in "The Story of the Abyss and the Spyglass," depicts a society divided into segments watched over by the "near-seers" (State geometry) and the "far-seers" (micro-segmentation), ending with an escape onto the line of flight.</p>
<p>The diptych of plateaus 8–9 thus supplies a complete cartographic toolkit for schizoanalytic practice: three lines, three forms of the secret, three types of discontinuity, two kinds of segmentarity, and four dangers make up a map on which the schizoanalyst can locate and analyze the desire of an individual or a group — asking not "what does it mean?" but "what are your lines? Where are you cracking? What lines of flight are you tracing?"</p>`
      },

        id: 18,
        title: "Becoming (Plateau 10)",
        html: `<h4 class="r-h3">17.1. Becoming vs. Imitation, Filiation, Resemblance</h4>
<p>The plateau "1730: Becoming-Intense, Becoming-Animal, Becoming-Imperceptible" offers the most elaborate processual ontology of the whole of <em>A Thousand Plateaus</em>. Becoming is strictly distinguished from imitation (it is not mimicry, not "playing" the animal — no mimesis), from resemblance (it does not rest on an analogy of relations), and from filiation (it is not evolution through descent or heredity — filiation is the domain of the State and the family, whereas becoming is of the order of <strong>alliance</strong> or the <strong>pact</strong>). Becoming is <strong>involution</strong> — a creative movement running "between" terms and beneath assignable relations. It is the process of desire itself.</p>
<h4 class="r-h3">17.2. The Block of Becoming and the Zone of Proximity</h4>
<p>The <strong>block of becoming</strong> constitutes a zone of proximity or indiscernibility — a "no-man's-land" in which points of departure and arrival vanish. The wasp and the orchid — their connection forms a block of becoming that produces a shared deterritorialization. The block of becoming is asymmetrical and double: the wasp does not become an orchid, and the orchid does not become a wasp — both enter a zone of indiscernibility from which they emerge transformed.</p>
<h4 class="r-h3">17.3. The Anomalous and the Outsider</h4>
<p>Every multiplicity or pack has its <strong>anomalous</strong> figure — neither an individual nor a species, but a borderline phenomenon (<em>phenomenon of bordering</em>), an "Outsider" (a reference to Lovecraft) that exists at the edge of the pack, determining its dimensions. It is with this anomalous figure that the sorcerer or the subject enters into alliance in order to set a becoming in motion. Moby Dick is the Anomalous for Ahab — the "Unique" with whom a demonic pact is sealed. The concept of the Anomalous links plateau 10 with plateau 2 (the wolves and the pack) and with plateau 12 (the nomad war machine).</p>
<h4 class="r-h3">17.4. Haecceity as Individuation</h4>
<p><strong>Haecceity</strong> is a mode of individuation distinct from that of a person or a substance. A body is defined by <strong>longitude</strong> (relations of speed and slowness between particles) and <strong>latitude</strong> (the intensive affects of which it is capable). A season, an hour, a wind — these are haecceities. They are perfect individualities consisting entirely of relations and affects, independent of any subject. The concept is drawn directly from the Spinozist ontology of bodies, while at the same time radicalizing it by rejecting substantiality in favor of pure relations and affects.</p>
<h4 class="r-h3">17.5. Two Planes: Organization vs. Consistency</h4>
<p>The authors distinguish two fundamentally different planes, whose differentiation constitutes one of the most important conceptual axes of the whole of <em>A Thousand Plateaus</em>:</p>
<p>The <strong>plane of organization/development</strong> is a transcendent "plan" — hidden and inferred from its effects, governing the development of forms and the formation of subjects. It is the "judgment of God" — a teleological structure that determines in advance what something is to become. The organism, signifiance, and subjectification are the three great forms of organization of this plane. Psychoanalysis, evolutionary biology in its neo-Darwinian version, and structural linguistics operate on this plane — they look for the hidden structures that determine the development of forms and subjects.</p>
<p>The <strong>plane of consistency/composition</strong> is an immanent plane (the Planomenon) on which there exist only speeds and slownesses between unformed elements, and affects. It is the Body without Organs on which all haecceities and becomings are written. There are no forms or subjects here — only relations of movement and rest, of speed and slowness, and intensive affects. The Spinozist ontology of bodies defined by longitudo (relations of speed between particles) and latitudo (the capacity for affects) is the philosophical basis of this plane.</p>
<p>This opposition runs through the entire book and provides the frame for all the distinctions between molar and molecular, stratification and destratification, tool and weapon, royal science and minor science. It is not, however, a simple binary opposition: the plane of consistency does not exist "beyond" the plane of organization — it is rather its limit, that which undermines it from within and opens it onto new possibilities.</p>
<h4 class="r-h3">17.6. The Series of Becomings</h4>
<p>Becomings follow a specific, though not strictly logical, sequence: <strong>becoming-woman</strong> (the first molecular segment, the "introductory power" of all other becomings, necessary because the standard is the White-Human-Adult-Male), then <strong>becoming-animal</strong>, <strong>becoming-molecular</strong> (becoming-bacterium, -virus, -molecule), and finally <strong>becoming-imperceptible</strong> as the ultimate end.</p>
<h4 class="r-h3">17.7. Majority and Minority</h4>
<p>Majority refers not to numbers but to a state of domination and a standard of measure. Minority is defined as a <strong>nondenumerable set</strong>, a power of becoming. There is no "becoming-majoritarian"; all becoming is minoritarian, since it involves a subject withdrawn from the majority and a medium emerging from the minority. The concept connects directly with the analysis of major and minor languages in plateau 4.</p>
<h4 class="r-h3">17.8. Sorcery as Alliance</h4>
<p>Sorcery is the practical model of becoming: it replaces the filiative logic of families and States with the logic of the pact or alliance. Becoming proceeds by contagion and epidemic rather than by heredity — one does not reproduce; one infects. The sorcerer seals a demonic pact with the Anomalous (the borderline of the pack) in order to set becoming-animal in motion. This model has deep political implications: whereas filiation is the order of the State and of reproduction, alliance is the order of the war machine and of the creation of the new. Becoming-animal is therefore always a political act — a subversion of the filiative order of domination.</p>
<h4 class="r-h3">17.9. The Role of Music and Painting</h4>
<p>Music and painting perform special functions in the process of becoming. Painting deals with the face–landscape problem — its aim is the deterritorialization of the face/landscape in favor of "probe-heads" that no longer trace forms. Music deals with the <strong>refrain</strong> (ritornello) — it is the creative operation that deterritorializes the territorial refrain (e.g., birdsong) into a sonorous block of becoming. Music has a stronger deterritorializing power than painting and can more directly attain the "cosmic." These distinctions link plateau 10 with plateau 11 (on the refrain) and with plateau 7 (on faciality), forming a coherent aesthetic theory as a practice of becoming.</p>
<p>Among the literary and philosophical references, the central ones are: Lovecraft (the conception of the "Outsider" and of the "Thing" at the edge of the universe), Melville (Ahab and Moby Dick as the supreme example of becoming-whale through a demonic alliance), Virginia Woolf (praised for "saturating every atom" and attaining becoming-imperceptible through group individuation), Castaneda (the Tonal and the Nagual), von Uexküll (the tick as a body defined by three affects), and Spinoza (bodies defined by longitude and latitude on the plane of immanence).</p>`
      },
      {
        id: 19,
        title: "The Refrain and the Territory (Plateau 11)",
        html: `<h4 class="r-h3">18.1. Milieus and Rhythm</h4>
<p>The plateau "1837: Of the Refrain" constructs a theory of territory and expression, joining ethology with aesthetics. A <strong>milieu</strong> is a vibratory block of space-time defined by the periodic repetition of a given component. <strong>Rhythm</strong> is the milieus' answer to chaos — it is neither meter nor cadence but the "unequal" passage between milieus. Rhythm exists in the "in-between," on the border between one milieu and another. The refrain is a "prism" or "crystal" of space-time, which living beings use to establish a center in the heart of chaos, to organize a stable "home," and finally to break out of the circle and join with cosmic forces.</p>
<h4 class="r-h3">18.2. Territory as Expression</h4>
<p>A <strong>territory</strong> arises when milieu components cease to be purely functional and become <strong>expressive</strong> or qualitative. The territory is the first assemblage — a "having" deeper than "being." It marks out the critical distance between members of a species, organizing space around expressive signs. The central claim: art is not a human privilege but an ethological, territorializing act present in nature. The Stagemaker bird, turning over leaves to display their paler side, creates a "matter of expression" — the territory as nature's work of art.</p>
<h4 class="r-h3">18.3. Deterritorialization: From Territory to Cosmos</h4>
<p>Deterritorialization is the movement by which one leaves the territory. The refrain serves as a "vector of deterritorialization," enabling the assemblage to open onto the outside, to cross territorial boundaries toward the cosmos. The movement of life and of art is a progression from stratified milieus to territorial assemblages and finally to the cosmic machine. The <strong>natal</strong> is the intensive center of the territory, often projected outward as an "unknown homeland." The <strong>earth</strong> is the deterritorialized correlate of absolute deterritorialization — a "glacial reality" belonging to the cosmos and not to any particular territory.</p>
<h4 class="r-h3">18.4. Classicism, Romanticism, Modern Art</h4>
<p>The authors construct an aesthetic periodization: <strong>classicism</strong> operates with the form–matter relation, organizing chaos into coded milieus. <strong>Romanticism</strong> centers on the Territory and the Earth — the artist is a "Hero" who confronts the groundless force of the Earth. <strong>Modern art</strong> (the Cosmic Age) replaces the form–matter relation with the <strong>material–force</strong> relation — the aim is to elaborate a molecular material capable of "capturing" invisible cosmic forces. The synthesizer is the technological instrument of the composition of consistency, molecularizing matter in order to capture cosmic energy.</p>
<h4 class="r-h3">18.5. The Little Refrain and the Great Refrain</h4>
<p>The <strong>little refrain</strong> is the territorial melody — the child singing in the dark to create a center, a point of stability in the chaos. The <strong>great refrain</strong> is the cosmic, deterritorialized refrain that joins with the forces of the future and of the universe, crossing all territories. The passage from the little to the great refrain constitutes the ethico-aesthetic model of the whole of <em>A Thousand Plateaus</em>.</p>
<p>Among the examples, Vinteuil's little phrase from Proust's <em>Search</em> is at first the "billboard" of Swann's love, but ultimately reveals the plane of consistency and the deterritorialized potential of music. The synthesizer is the modern technical instrument of the "composition of consistency," molecularizing matter in order to capture cosmic energy. The political implications of the refrain are fundamental: music and refrains (drums, trumpets) can draw people into a "black hole" of destruction or onto a "line of abolition" — fascism exploited the musical machine on an unprecedented scale. The modern "depopulation" (through the mass media) means that "the people are missing" — the task of the "cosmic artisan" (the poet, the artist) is to release molecular populations that might give birth to "a people to come" (<em>un peuple à venir</em>). Politics is here inseparably joined with aesthetics — the micropolitics of the refrain is at once a question of the organization of desire and of resistance to fascist reterritorializations.</p>
<p>The refrain connects with the concept of the BwO as a "glacial reality" or "egg" on which the refrain traces its lines — this is the plane of consistency resisting oedipalization. Deleuze and Guattari oppose the Oedipal animal (the domestic pet, the dog barking for a bone) to the pack animal or the "anomalous" one (Moby Dick), which represents true becoming. The territory is thus not merely an ethological category — it is the first assemblage, a "having" deeper than "being," a creative act of expression that joins nature to art and art to politics.</p>`
      },
      {
        id: 20,
        title: "The War Machine and Nomadology (Plateau 12)",
        html: `<h4 class="r-h3">19.1. The Two Poles of the State</h4>
<p>The plateau "1227: Treatise on Nomadology — The War Machine" is the most elaborate political analysis in <em>A Thousand Plateaus</em>. Drawing on the research of Georges Dumézil, Deleuze and Guattari point out that political sovereignty has two heads: the <strong>magical despot-king</strong> (processes of capture and binding, magico-religious power) and the <strong>jurist-king</strong> (pacts, contracts, legal and rational organization). The two poles constitute the <em>milieu</em> of interiority and together form the State apparatus as a stratifying layer.</p>
<h4 class="r-h3">19.2. The War Machine as Exteriority</h4>
<p>The war machine is by definition <strong>exterior</strong> to the State apparatus. The State has no war machine of its own — it can only annex one in the form of a military institution, which always involves risk, tension, and instability. The exteriority of the war machine is not reducible to a dialectic with the State — it is an ontological, not a geographical, exteriority. It is represented by deities such as Indra or Thor — the "man of war" brings fury, speed, secrecy, and the power of metamorphosis. From the State's point of view his nature is perceived negatively — as sinful, mad, or illegal, because he destabilizes the State order of sovereignty.</p>
<p>The main thesis: the war machine is the invention of the nomads, and its primary object is not war but the <strong>occupation and holding of smooth space</strong>. War becomes the object of the war machine only at the moment of its collision with the State, which strives to striate space and capture flows. The State's appropriation of the war machine, transforming it into a military apparatus subordinate to the sovereign's political ends, is never complete — the war machine retains its exteriority, ready to slip out of the State's grip at every opportunity.</p>
<h4 class="r-h3">19.3. Minor Science vs. Royal Science</h4>
<p>The opposition between <strong>royal</strong> (State) <strong>science</strong> and <strong>minor</strong> (nomad) <strong>science</strong> corresponds to the opposition between major and minor language in plateau 4. Royal science strives to establish constant laws, operates in striated (metric) space, and employs the hylomorphic model (the imposition of form upon homogeneous matter). Minor science is itinerant; it employs the hydraulic model (flows, turbulences), deals with problems (events) rather than theorems, and strives to follow matter-flow (the machinic <em>phylum</em>). Gothic architecture is here the example of nomad science — an "operative geometry of the trait" creates smooth, soaring spaces in opposition to the State administration imposing the hylomorphic model of fixed forms.</p>
<h4 class="r-h3">19.4. Nomad (Smooth) Space</h4>
<p>Nomad space is <strong>smooth space</strong> (<em>nomos</em>), which one occupies without counting it, in contrast to striated space (<em>polis</em>), which one counts in order to occupy it. Nomads do not migrate (they do not go from point to point) but hold to smooth space, making of points mere resting places along a trajectory. The comparison of chess (a State game, striated, hierarchical) and Go (a nomad game, smooth, territorial) is one of the best-known distinctions of <em>A Thousand Plateaus</em>.</p>
<h4 class="r-h3">19.5. Tools/Signs vs. Weapons/Jewelry</h4>
<p>Tools are bound to the model of work, to gravity and writing (the marking of matter) — they are introjective, subordinated to the organization of labor. Weapons are bound to the model of free action, to pure speed, and to jewelry, which constitutes the "affects" of weapons and is proper to objects in motion — they are projective, oriented toward deterritorialization.</p>
<h4 class="r-h3">19.6. Metallurgy and the Machinic Phylum</h4>
<p>The smith is the primordial type of the itinerant artisan, who <strong>follows the machinic phylum of matter</strong> — thought of matter-flow. Metallurgy reveals that matter possesses its own nonorganic life. The smith occupies a special position — he belongs fully neither to the State nor to the nomads, but moves in "holey space" (<em>holey space</em>) — a third space that communicates with the other two types.</p>
<h4 class="r-h3">19.7. Smooth, Striated, Holey Space</h4>
<p>Three types of space: <strong>striated</strong> (the State measures, builds roads, draws borders — it striates space), <strong>smooth</strong> (the nomads operate in the desert, maritime, or steppe space of continuous variation), and <strong>holey</strong> (<em>holey space</em> — the smiths bore passages through the ground, creating a third, subterranean and mineral space that connects the smooth and the striated). These three spaces do not exist in isolation but ceaselessly transform into and interpenetrate one another.</p>
<h4 class="r-h3">19.8. Political Implications and the Inversion of Clausewitz</h4>
<p>The plateau's argument leads to a fundamental inversion of Clausewitz's formula: in modernity it is not war that is the continuation of politics; rather, <strong>politics becomes the continuation of war</strong>. The war machine, automated and planetary, takes peace (of terror or deterrence) as its object, making states merely its component parts. New war machines (guerrilla warfare, revolutionary movements) arise by tracing lines of flight and creating smooth spaces against the global axiomatic of capitalism.</p>
<p>Among the historical examples: the Hurrians (Hyksos) introducing numerical composition into Egypt, Genghis Khan organizing the steppe, Moses creating the machine of the just in the desert. Kleist (Penthesilea and Achilles) models the exteriority and speed of the war machine — figures possessed by fury, speed, and metamorphosis, irreducible to State logic.</p>`

        title: "The Apparatus of Capture (Plateau 13)",
        html: `<h4 class="r-h3">20.1. The Urstaat: The Hypothesis of the Paleolithic State</h4>
<p>The plateau "7000 B.C.: Apparatus of Capture" constructs a theory of the State as an apparatus of capture. Deleuze and Guattari reject the evolutionist view that the State was the outcome of the progressive development of agriculture and technology. Invoking the example of Çatal Hüyük, they suggest that it was the State (as urban center) that may have <strong>created</strong> agriculture, by crossbreeding seeds and domesticating animals gathered from different territories. The State appears "all at once," fully formed, as the unconditioned <strong>Urstaat</strong>. Primitive societies are defined by mechanisms of anticipation and warding-off (<em>anticipation-prevention</em>) — their purpose is to forestall the crystallization of central power. This means that the State is a limit which primitive societies always "sensed" and strove to push away.</p>
<h4 class="r-h3">20.2. Three Forms of Capture: Rent, Taxation, Profit</h4>
<p>The apparatus of capture operates through three interconnected forms: <strong>ground rent</strong> (the capture of territory through the comparison of lands and their monopolistic appropriation — establishing private property in land); <strong>profit</strong> (the capture of activity/labor through the comparison of efforts and the monopolistic appropriation of surplus labor — establishing surplus value); and <strong>taxation</strong> (the capture of exchange through the creation of money as general equivalent — it is taxation that creates money, not trade, which constitutes a fundamental reversal of classical political economy).</p>
<p>State violence (the police) is a <strong>preaccomplished violence</strong> (<em>preaccomplished violence</em>), which establishes the right of capture before ever being directly employed. Law precedes actual violence — this is the fundamental mechanism of the State's legitimation.</p>
<h4 class="r-h3">20.3. Social Subjection vs. Machinic Enslavement</h4>
<p>The authors distinguish two ways in which the apparatus of capture operates upon human beings: <strong>machinic enslavement</strong> (<em>machinic enslavement</em>) — the human being is a component part of the machine; this concerns both the archaic empires (man as a cog of the despotic megamachine) and modern cybernetics (man as an interface of information networks); and <strong>social subjection</strong> (<em>social subjection</em>) — the State constitutes the human being as a subject who uses the machine (classical industrial capitalism, in which the worker is a subject in relation to the machine as tool). This distinction makes it possible to grasp the specificity of contemporary forms of domination, in which the two modalities are superimposed.</p>
<h4 class="r-h3">20.4. The Capitalist Axiomatic</h4>
<p>Capitalism rests not on codes (qualitative meanings, traditional hierarchies) but on a functional <strong>axiomatic</strong> operating directly on decoded flows (abstract quantities). The axiomatic is flexible — axioms can be <strong>added</strong> to it (the social-democratic state: regulating flows through new rules, extending social rights) or <strong>subtracted</strong> from it (the totalitarian or neoliberal state: reduction to the minimum, deregulation). All modern states — democratic, totalitarian, socialist — are <strong>isomorphic</strong> with respect to the world market, differing only in their concrete variables.</p>
<h4 class="r-h3">20.5. Adding and Subtracting Axioms</h4>
<p>Capitalism needs the State as a <strong>model of realization</strong> for its worldwide axiomatic. The State moderates the "absolute deterritorialization" of capital, supplying it with the necessary reterritorializations (e.g., the domestic market, labor law, border control). The peripheries of global capitalism (the Third World) experience at once the harshest machinic enslavement and the weakest social subjection — an absence of civil rights combined with full exploitation. Minorities and revolutionary movements constitute nondenumerable sets that escape the axiomatic and can create new war machines.</p>
<p>Among the examples illustrating the mechanisms of capture: Corinth — taxation introduced money so that the poor could buy back land, which created monetary circulation and transformed social relations. NASA — the State (the USA) checked the deterritorialization into outer space in order to reterritorialize capital on a "belt" around the Earth — space technology subordinated to capitalist logic. The myth of the zombie as a metaphor of machinic enslavement — a human being stripped of subjectivity, functioning as pure labor power. The notion of "penultimacy" — the marginal point at which an assemblage must either begin anew or change in nature (the passage from limit to threshold) — illustrates the dynamics of an axiomatic that ceaselessly adds or subtracts axioms, never reaching a stable state.</p>
<p>Plateau 13 connects directly with <em>Anti-Oedipus</em> by developing the thesis of capitalism as the abstract conjunction of two decoded flows: free labor (detached from the land) and independent capital (detached from production). In <em>Anti-Oedipus</em> the State was the "full body" of the socius; here it is an apparatus of capture that attributes productivity to itself (rent, profit) on the surface of recording. The earth is the deterritorialized BwO on which states build their stratifications and striations.</p>`

        id: 22,
        title: "The Smooth and the Striated (Plateau 14)",
        html: `<h4 class="r-h3">21.1. Six Models of Analysis</h4>
<p>The plateau "1440: The Smooth and the Striated" systematizes a fundamental spatial duality through six models of analysis:</p>
<p><strong>The technological model:</strong> Woven fabric (striated) vs. felt (smooth). Fabric consists of two parallel elements (warp and weft) crossing at right angles — a closed, bounded space with a definite top and bottom. Felt is an "anti-fabric" formed by the entanglement of fibers through fulling — infinite, open, without fixed elements or center. Patchwork is the primordial example of smooth space — an amorphous collection of juxtaposed pieces (a Riemannian space).</p>
<p><strong>The musical model:</strong> The striated comprises "pulsed time" and metric multiplicities; the smooth — "nonpulsed time" and continuous variation. Pierre Boulez is the principal source of this model.</p>
<p><strong>The maritime model:</strong> The sea is the archetype of smooth space — directional, vectorial, perceived haptically (by touch). Historically the State striated the sea through astronomical navigation and cartographic grids. Modern technology (e.g., the strategic submarine) has "retroactively smoothed" the sea.</p>
<p><strong>The mathematical model:</strong> Riemannian space (smooth) vs. Euclidean space (striated). Riemannian multiplicities are amorphous collections of "neighborhoods" in which the connections are not determined in advance. Fractals define smooth space — aggregates with fractional dimensions that fill space without becoming a full dimension.</p>
<p><strong>The physical model:</strong> Work (striated) vs. free action (smooth). Work is defined by gravity and laminar flow; free action — by the <em>clinamen</em> (the smallest deviation) and the vortex (turbulence).</p>
<p><strong>The aesthetic model:</strong> Optical space (striated) vs. haptic space (smooth). Nomad art is exemplified by "twisted animals" and by the "abstract line" (Gothic/nomadic), which describes smooth space.</p>
<h4 class="r-h3">21.2. Felt vs. Fabric, Haptic vs. Optical</h4>
<p>The felt/fabric opposition is the material model for the smooth/striated opposition. Felt has neither warp nor weft — it is an entanglement without order, boundless, indefinitely extensible. Fabric, by contrast, requires a frame (the loom); it is a bounded, hierarchical space. The haptic/optical opposition answers to the same tension: close vision (haptic) does not distinguish ground from figure and knows no perspective — orientation changes step by step, locally. Distant vision (optical) organizes forms, background, and central perspective.</p>
<h4 class="r-h3">21.3. Interaction and Mutual Transformation</h4>
<p>The central argument is the claim that the smooth and the striated exist <strong>only in mixture</strong> — no space is purely one or the other. The two spaces remain in a constant state of flux and mutual transformation:</p>
<p><strong>The striation of the smooth:</strong> The State apparatus ceaselessly captures smooth space (the sea, the desert, the air) in order to measure, divide, and control it. Astronomical navigation striates the sea; cartography striates the desert; aviation law striates the air.</p>
<p><strong>The smoothing of the striated:</strong> Smooth space ceaselessly emerges from within the striated. The city is a force of striation, yet at the same time it secretes smooth spaces (slums, nomadic transits, squats) that turn against the State. The strategic submarine "retroactively smooths" the sea, using it as a space of absolute movement for controlling the striated land.</p>
<p>One should therefore not evaluate a priori — the smooth is not in advance "better" than the striated. Smooth space can just as well be an instrument of domination (the smoothness of global capital) as of resistance (the smoothness of the guerrilla movement). What matters is tracking the concrete transformations and passages between them. Capitalism operates as an axiomatic effecting a "generalized machinic enslavement" — though it rests on the harshest striation (the control of labor), it simultaneously creates a deterritorialized smooth space for the absolute speed of circulating capital. This is the fundamental duplicity of capitalism, which links the analysis of this plateau with the analysis of the axiomatic in plateau 13.</p>
<p>Among the examples: chess vs. Go (a recurring leitmotif — chess as the striated State game with coded pieces, a front and a rear; Go as the smooth game of the war machine with anonymous stones and open space); Gothic architecture (nomad science — materials-forces creating smooth, soaring spaces); Eskimo and desert space (haptic spaces without horizon or perspective, navigation depending on local, nonmetric haecceities — winds, sounds, textures). The BwO is the spatial correlate of smooth space — it is intensive, informal, filled with multiplicities rather than organized subjects. Striated space corresponds to social subjection (the worker as a subject using a tool), while the new "smooth" spaces of global capitalism facilitate machinic enslavement (human beings as component parts of the informational and logistical system).</p>`

        id: 23,
        title: "Conclusion — Concrete Rules (Plateau 15)",
        html: `<h4 class="r-h3">22.1. Synthesis: Everything Is a Complex of Lines</h4>
<p>The conclusion of <em>A Thousand Plateaus</em> synthesizes all the concepts elaborated in the preceding plateaus. The central claim is the formula: <strong>everything is a complex of lines</strong>. We are composed of three types of line at once: rigid molar lines (macropolitical segments, binary divisions), supple molecular lines (micro-movements, supple segmentarity), and lines of flight (deterritorialization, escape toward the new). The cartography of these lines — not the interpretation of "hidden meanings" — constitutes the proper schizoanalytic practice.</p>
<h4 class="r-h3">22.2. The Abstract Machine of Consistency</h4>
<p>Abstract machines, unlike Platonic Ideas, are immanent and singular. They consist of unformed matters (<em>phylum</em>) and nonformal functions (the diagram). They possess neither form nor substance but serve as "piloting" mechanisms, tracing lines of flight and effecting mutations within concrete assemblages. The abstract machine of consistency must be constructed piece by piece — by selecting and joining lines of flight, creating a plane of consistency that avoids the traps of both rigid stratification and suicidal abolition.</p>
<p>The <strong>plane of consistency</strong> (or of composition) is a plane of immanence that knows only <strong>longitudes</strong> (speeds and slownesses of unformed elements) and <strong>latitudes</strong> (intensive affects). It is opposed to the <strong>plane of organization</strong> (or of development), which is transcendent and teleological, centered on the formation of subjects and the development of forms.</p>
<p>Concrete assemblages are tetravalent structures that arise within the strata but often operate in decoded zones. They have a horizontal axis (the machinic assemblage of bodies as content + the collective assemblage of enunciation as expression) and a vertical axis (the oscillation between territoriality and deterritorialization). Deterritorialization can be relative (bound up with a reterritorialization on a new stratum), absolute (the creation of a new earth and the conjunction of lines of flight), negative (blocked by the State), or positive (creative, opening onto new possibilities). The conclusion systematizes these distinctions, showing that schizoanalysis must simultaneously analyze the strata (the layers of organization), the assemblages (the concrete configurations of desire), and the abstract machines (the mechanisms of mutation and transformation).</p>
<h4 class="r-h3">22.3. Rules of Caution</h4>
<p>The authors formulate concrete rules of caution, which constitute the ethical core of the entire schizoanalytic project. The point is not to destroy the strata with a violent blow — that leads to catastrophe (the empty BwO, the line of death). The point is a patient dismantling that retains a minimum of organism, subjectivity, and meaning in order to survive, while opening spaces for experimentation. The four dangers — fear, clarity, power, the passion for abolition — must be constantly recognized and avoided. Resistance requires tracing lines of flight that "leak" between the molar segments, but this must be done with caution, so as to avoid "cancerous" proliferations or "lines of death."</p>
<h4 class="r-h3">22.4. The Book as Assemblage-Rhizome</h4>
<p>The book itself is presented as an <strong>assemblage-rhizome</strong> designed to function with the "outside." It is not a systematic treatise but a machine for thinking — built of plateaus that can be read in any order, that connect with one another through underground stems and open onto what does not yet exist. The conclusion closes the circle, returning to the principles of the rhizome from plateau 1, but now enriched with the entire conceptual arsenal elaborated across the fourteen plateaus.</p>
<p>The schizoanalytic task — continuing and developing the program of <em>Anti-Oedipus</em> — consists in simultaneously: dismantling the apparatuses of capture (destratification), tracing lines of flight (deterritorialization), constructing new assemblages (creative reterritorialization), and remaining wary of the traps (fascism, abolition, the cancerous BwO). The "desiring-machines" of <em>Anti-Oedipus</em> are developed into the broader notion of "machinic assemblages"; the BwO is refined as the plane of consistency, which is at once the result of destratification and the surface on which the strata form; schizoanalysis becomes a cartography of lines, assemblages, and abstract machines — a practice at once ontological, political, and aesthetic.</p>
<p>The political implications of the conclusion include the call to side with the "nondenumerable" — minorities defined not by their number but by their status as nondenumerable sets that escape the capitalist axiomatic. Resistance requires the creation of <strong>subject-groups</strong> (<em>groupes-sujets</em>) — as opposed to "subjugated groups" (<em>groupes assujettis</em>) — which subordinate power to the production of desire. The war machine must be reclaimed from the State and redirected toward the creation of new forms of life, not toward war or destruction.</p>
<p>Among the recurring leitmotifs: chess vs. Go (State space vs. nomad space), the wasp and the orchid (the block of becoming in the rhizome), the Wolf-Man (the critique of the psychoanalytic reduction of multiplicity to molar unities), and the quilt (the technological model of the passage from striated embroidery to smooth patchwork). Each of these motifs joins several plateaus at once, forming a network of resonances — a conceptual rhizome in which no plateau stands "above" or "before" the others, but all connect through the underground stems of mutual reference.</p>
<h4 class="r-h3">Summary of the Conceptual Grid of <em>A Thousand Plateaus</em></h4>
<p>Running through all the plateaus are several fundamental tensions, which admit of no dialectical synthesis but exist as continuous, irreducible oscillations:</p>
<p>- <strong>Deterritorialization vs. reterritorialization</strong> — every movement of escape can be captured, but no capture is final. - <strong>Smooth vs. striated</strong> — no space is purely one or the other; they exist only in mixture and continuous mutual transformation. - <strong>War machine vs. State</strong> — exteriority and interiority as irreducible political modalities. - <strong>Coding vs. axiomatic</strong> — the passage from traditional societies to capitalism as the passage from qualitative codes to the quantitative axiomatic of decoded flows. - <strong>Caution vs. creativity</strong> — the line of flight can lead to liberation as well as to destruction; the art of caution consists in navigating between these poles. - <strong>Molar vs. molecular</strong> — two levels coexisting in every phenomenon, irreducible to each other yet ceaselessly interpenetrating.</p>
<p><em>A Thousand Plateaus</em> realizes in its form what it proclaims in its concepts: it is a rhizome, an assemblage, a machine for thinking that does not close itself into a system but opens onto experimentation — onto what does not yet exist and can arrive only through the careful tracing of new lines of flight.</p>
<p>Schizoanalysis, inaugurated in <em>Anti-Oedipus</em>, finds in <em>A Thousand Plateaus</em> its full development as a practice joining four dimensions: <strong>cartography</strong> (the mapping of lines rather than the interpretation of symbols — plateaus 1, 8, 9), <strong>pragmatics</strong> (the analysis of concrete assemblages rather than abstract structures — plateaus 3, 4, 5), <strong>micropolitics</strong> (attention to the molecular movements of desire, not only to the molar formations of power — plateaus 9, 12, 13), and <strong>experimentation</strong> (the construction of the plane of consistency rather than the discovery of hidden meanings — plateaus 6, 10, 11). Each of these dimensions is present in every plateau, but each plateau accents a different aspect, forming a multidimensional map that cannot be reduced to a linear narrative.</p>
<p>The final lesson of <em>A Thousand Plateaus</em> is at once ontological, ethical, and political: reality is a multiplicity of lines, not a tree of unity; desire is productive, not grounded in lack; thinking is experimentation, not representation; politics is micropolitics, not merely macropolitics; caution is a virtue, not cowardice. This book does not close — it opens. It does not answer — it asks. It does not end — it begins again, at another point, on another plateau.</p>`
