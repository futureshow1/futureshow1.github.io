      {
        id: 24,
        title: "A Glossary of Key Concepts of Schizoanalysis",
        html: `<p>The following glossary covers the key concepts of both volumes of <em>Capitalism and Schizophrenia</em> -- <em>Anti-Oedipus</em> (1972) and <em>A Thousand Plateaus</em> (1980). Each entry contains a definition, the context in which the concept appears, and, where relevant, its evolution between the two volumes. Abbreviations: AO = <em>Anti-Oedipus</em>; TP = <em>A Thousand Plateaus</em>.</p>
<h4 class="r-h3">1. Axiomatic (<em>axiomatique</em>)</h4>
<p><strong>Definition:</strong> A system of purely functional rules operating on decoded flows by means of abstract quantities (above all money), replacing the qualitative codes of earlier social formations. Unlike codes, the axiomatic does not impose meanings but regulates quantitative relations between flows.</p>
<p><strong>Context:</strong> Introduced in AO, chapter 3, in the analysis of the capitalist machine. Developed in TP, plateau 13 (<em>Apparatus of Capture</em>), where the axiomatic becomes the central mechanism of capitalism -- a flexible system to which axioms can be added or from which they can be subtracted (e.g., the social-democratic state adds social axioms; neoliberalism subtracts them).</p>
<p><strong>Evolution AO--TP:</strong> In AO the axiomatic is described as the feature distinguishing capitalism from coding (the territorial machine) and overcoding (the despotic machine). In TP the concept gains political precision: the axiomatic becomes a tool for analyzing the global system of states and their isomorphy with respect to the world market.</p>
<h4 class="r-h3">2. Alliance (<em>alliance</em>)</h4>
<p><strong>Definition:</strong> A relation of affinity in the lateral line, political and economic in character. In primitive societies alliance constitutes the "circulating capital" of the social machine -- a mobile block of debts and obligations regulating exchanges between groups.</p>
<p><strong>Context:</strong> AO, chapter 3 (the territorial machine). Alliance and filiation form the conceptual pair with which Deleuze and Guattari describe the functioning of the socius in primitive societies. In the despotic machine the despot institutes a "new alliance" with the people, appropriating the existing filiative stocks. Under capitalism alliance takes a banking form.</p>
<p><strong>Evolution AO--TP:</strong> In TP alliance is developed in the context of becoming (plateau 10): becoming proceeds by the order of alliance (the pact), not of filiation (heredity). The sorcerer seals a pact with the Anomalous -- the logic of alliance opposed to the logic of the family.</p>
<h4 class="r-h3">3. The Anomalous (<em>anomal</em>)</h4>
<p><strong>Definition:</strong> A borderline figure within a pack or multiplicity, to be distinguished from the "abnormal" (the pathological). The Anomalous is the Outsider, a being at the edge of the multiplicity, which determines its dimensions and with which the subject enters into a demonic alliance in order to set a becoming in motion.</p>
<p><strong>Context:</strong> TP, plateau 10 (<em>Becoming-Intense</em>) and plateau 2 (<em>One or Several Wolves?</em>). Examples: Moby Dick as the Anomalous of the whale pack, with whom Captain Ahab seals a monstrous pact.</p>
<h4 class="r-h3">4. Antiproduction (<em>antiproduction</em>)</h4>
<p><strong>Definition:</strong> The domain of the sterile, unproductive surface to which the Body without Organs belongs. Antiproduction is not the negation of production but its indispensable complement -- the surface on which production is taken up, recorded, and consumed. At the social level antiproduction takes the form of the socius (the Earth, the Body of the Despot, Capital), which appropriates the productive forces to itself as quasi-cause.</p>
<p><strong>Context:</strong> AO, chapter 1 (section 2) and chapter 3. Under capitalism antiproduction spills across the entire social body in the form of artificial scarcity and of the bureaucratic and military apparatus.</p>
<h4 class="r-h3">5. Assemblage / agencement (<em>agencement</em>)</h4>
<p><strong>Definition:</strong> A concrete, "two-headed" entity joining heterogeneous elements into a functional whole. The assemblage has a horizontal axis (the machinic assemblage of bodies as content + the collective assemblage of enunciation as expression) and a vertical axis (the oscillation between territoriality and deterritorialization). It is not a static structure but a dynamic arrangement subject to continual transformations.</p>
<p><strong>Context:</strong> A concept central to TP, though its beginnings are present in AO in the guise of the "desiring-machine." In TP it appears as early as plateau 1 (the book as assemblage) and is systematically developed in plateau 3 (<em>The Geology of Morals</em>) and in the conclusion.</p>
<p><strong>Evolution AO--TP:</strong> The assemblage replaces and extends the concept of the desiring-machine from AO. Whereas the desiring-machine accented unconscious production, the assemblage also encompasses the dimensions of enunciation, territoriality, and deterritorialization, becoming a more flexible analytic tool.</p>
<h4 class="r-h3">6. White Wall / Black Hole (<em>mur blanc / trou noir</em>)</h4>
<p><strong>Definition:</strong> The two components of the abstract machine of faciality. The white wall is the surface of signifiance on which signs settle and redundancy is established. The black hole is the point of resonance in which consciousness and subjectivity are lodged. Their intersection creates the face system.</p>
<p><strong>Context:</strong> TP, plateau 7 (<em>Year Zero: Faciality</em>) and plateau 5 (<em>On Several Regimes of Signs</em>). The white wall corresponds to the signifying (despotic) regime, the black hole -- to the subjective (post-signifying) regime.</p>
<h4 class="r-h3">7. Block of Becoming (<em>bloc de devenir</em>)</h4>
<p><strong>Definition:</strong> A zone of proximity or indiscernibility in which the points of departure and arrival cease to be recognizable. The block of becoming is neither imitation nor analogy but a real process of "creative involution," in which two heterogeneous elements form a shared deterritorialization (e.g., wasp-orchid).</p>
<p><strong>Context:</strong> TP, plateau 10 (<em>Becoming-Intense</em>). A concept closely bound up with multiplicity, the Anomalous, and haecceity.</p>
<h4 class="r-h3">8. Body without Organs (BwO -- <em>corps sans organes</em>)</h4>
<p><strong>Definition:</strong> A sterile, unproductive surface arising as the product-standstill of the desiring-machines. The BwO is not an absence of organs but an opposition to the organism -- to the hierarchical organization of the organs. It is the "immobile motor" of desire, on which intensities are recorded and multiplicities spread out. It functions as the plane of consistency, on which the organs exist only as pure intensities, thresholds, and gradients.</p>
<p><strong>Context:</strong> A concept borrowed from Antonin Artaud. In AO it appears in chapter 1 (section 2) as an element of the process of desiring-production. In TP it is developed in plateau 6 (<em>How Do You Make Yourself a BwO?</em>), plateau 3 (<em>The Geology of Morals</em>), and the conclusion.</p>
<p><strong>Evolution AO--TP:</strong> In AO the BwO functions above all as a clinical concept -- the surface of recording of intensities on which the subject localizes its states. In TP the BwO acquires an ontological dimension -- it becomes the plane of consistency (the plane of immanence), the Body of the Earth on which the strata form as "thickenings." Three types of BwO are introduced: full (successful), empty (blocked), and cancerous (fascist).</p>
<h4 class="r-h3">9. Cut-Flow (<em>coupure-flux</em>)</h4>
<p><strong>Definition:</strong> The elementary operation of the desiring-machine. The machine functions as a binary system: one machine produces a continuous flow (hylè), and a second machine plugged into it operates as a cut, drawing off a portion of that flow. The cut is not opposed to continuity but is its condition. Three types of cut correspond to the three syntheses: the cut-drawing-off (connective synthesis), the cut-detachment (disjunctive synthesis), and the cut-remainder (conjunctive synthesis).</p>
<p><strong>Context:</strong> AO, chapter 1 (section 5, <em>Machines</em>).</p>
<h4 class="r-h3">10. Deterritorialization (<em>déterritorialisation</em>)</h4>
<p><strong>Definition:</strong> The movement by which an element, a flow, or a subject leaves a territory -- breaks out of the codes, meanings, and boundaries assigned to it. Deterritorialization can be relative (bound up with a reterritorialization on a new territory), absolute (the creation of a new earth), negative (blocked by the State or by Oedipus), or positive (creative, opening new possibilities).</p>
<p><strong>Context:</strong> A concept present in both volumes, though in AO it appears above all in the economico-historical context (the decoding of flows by capitalism), while in TP it acquires an ontological and cosmic dimension (deterritorialization as the fundamental movement of matter and life).</p>
<p><strong>Evolution AO--TP:</strong> In AO deterritorialization describes an economico-historical process: capitalism decodes and deterritorializes flows while simultaneously reterritorializing them on the family (Oedipus) and the state. In TP deterritorialization becomes an ontological category: it is a movement inscribed in the very nature of strata, assemblages, and lines of flight. It receives a systematic typology (relative/absolute, positive/negative).</p>
<h4 class="r-h3">11. Diagram (<em>diagramme</em>)</h4>
<p><strong>Definition:</strong> The non-figurative function of the abstract machine, which does not represent reality but constructs a reality yet to come. The diagram blurs the boundary between particle and sign, operating on unformed matters and nonformal functions.</p>
<p><strong>Context:</strong> TP, plateau 5 (<em>On Several Regimes of Signs</em>) and plateau 15 (the conclusion). A concept inspired by Peirce's semiotics, in which the diagram is an icon of relations.</p>
<h4 class="r-h3">12. Inclusive Disjunction (<em>disjonction inclusive</em>)</h4>
<p><strong>Definition:</strong> The legitimate use of the disjunctive synthesis, in which the alternatives do not exclude one another but coexist as permutations on the surface of the Body without Organs. The logic of "or… or… or…" (not "either/or"), in which the subject can move between states without being permanently imprisoned in any of them. Opposed to the exclusive disjunction imposed by Oedipus.</p>
<p><strong>Context:</strong> AO, chapter 2 (section 4, <em>The Disjunctive Synthesis of Recording</em>).</p>
<h4 class="r-h3">13. Oedipus (<em>Oedipe</em>)</h4>
<p><strong>Definition:</strong> The family complex (the daddy–mommy–me triangle) that psychoanalysis imposes on the unconscious as the sole measure of desire. Oedipus is not a psychological fact but an "intimate colonial formation," an operation that "folds" the infinite social field onto the finite family triangle. Under capitalism Oedipus functions as an interior limit, neutralizing the revolutionary potential of desire.</p>
<p><strong>Context:</strong> AO, above all chapter 2 (<em>Psychoanalysis and Familialism</em>) and chapter 4 (<em>Introduction to Schizoanalysis</em>). In TP present indirectly as the criticized model of the reduction of multiplicity to unity (plateau 2, <em>One or Several Wolves?</em>).</p>
<h4 class="r-h3">14. Filiation (<em>filiation</em>)</h4>
<p><strong>Definition:</strong> Kinship in the direct line, administrative and hierarchical in character. It is the "filiative stock," the fixed capital of the social machine. In the despotic machine the despot institutes a direct filiation with the deity. Under capitalism filiation takes the form of the filiation of capital (money begets money: M--M').</p>
<p><strong>Context:</strong> AO, chapter 3. In TP filiation is opposed to alliance as the order of becoming (plateau 10).</p>
<h4 class="r-h3">15. Smooth / Striated (<em>lisse / strié</em>)</h4>
<p><strong>Definition:</strong> Two types of space existing only in mixture and continuous mutual transformation. Smooth space is directional, vectorial, haptic (tactile-visual), acentered -- "occupied without being counted" by the nomads. Striated space is metric, centralized, optical -- "counted in order to be occupied" by the State. Six models of analysis: technological (felt/fabric), musical, maritime, mathematical (Riemann/Euclid), physical (free action/work), aesthetic (haptic/optical).</p>
<p><strong>Context:</strong> TP, plateau 14 (<em>The Smooth and the Striated</em>), with numerous references in plateaus 12 (<em>Nomadology</em>) and 13 (<em>Apparatus of Capture</em>).</p>
<h4 class="r-h3">16. Haecceity (<em>haecceité / haecceity</em>)</h4>
<p><strong>Definition:</strong> A mode of individuation distinct from that of a person or a substance. A body defined not by its form or organs but by longitude (relations of speed and slowness between particles) and latitude (the intensive affects of which it is capable). Haecceities are perfect individualities composed of relations and affects -- a season, an hour, a wind, an event. The concept is borrowed from Duns Scotus.</p>
<p><strong>Context:</strong> TP, plateau 10 (<em>Becoming-Intense</em>).</p>
<h4 class="r-h3">17. The Imperialism of Oedipus (<em>impérialisme d'Oedipe</em>)</h4>
<p><strong>Definition:</strong> The process by which psychoanalysis imposes the figure of the family triangle as the sole measure of the unconscious. Oedipus operates like an "intimate colonial formation" that corners desire, forcing it to express itself exclusively in familial terms instead of allowing it to invest the socio-historical field directly.</p>
<p><strong>Context:</strong> AO, chapter 2 (section 1).</p>
<h4 class="r-h3">18. Intensity (<em>intensité</em>)</h4>
<p><strong>Definition:</strong> A magnitude that cannot be divided without changing in nature; a pure difference of degree that peoples the Body without Organs. Intensities are not measurable but experiential -- one passes through them as through bands, thresholds, and gradients. The zero degree of intensity signifies not a lack but a positive state of unformed matter.</p>
<p><strong>Context:</strong> AO, chapter 1 (section 3, the nomadic subject passing through intensive states). TP, plateau 6 (the BwO as an egg of intensity) and plateau 10 (becoming as intensive movement).</p>
<h4 class="r-h3">19. Rhizome (<em>rhizome</em>)</h4>
<p><strong>Definition:</strong> An acentered, nonlinear system defined by six principles: connection, heterogeneity, multiplicity, asignifying rupture, cartography, and decalcomania. The rhizome is opposed to the tree (hierarchy, binarity). Any point of a rhizome can be connected to any other; the rhizome has neither beginning nor end, but a middle from which it grows in all directions. It is a map, not a tracing.</p>
<p><strong>Context:</strong> TP, plateau 1 (<em>Introduction: Rhizome</em>) -- the methodological foundation of the whole book.</p>
<h4 class="r-h3">20. Code / Overcoding / Decoding (<em>code / surcodage / décodage</em>)</h4>
<p><strong>Definition:</strong> Three operations on flows defining the three social machines. The <strong>code</strong> is a qualitative system for regulating flows, inscribed on bodies in primitive societies (territorial coding). <strong>Overcoding</strong> (surcodage) is the operation of the despotic state, consisting in the imposition of a transcendent unity upon previously coded flows. <strong>Decoding</strong> is the process proper to capitalism, consisting in stripping flows of their traditional meanings and replacing the codes with an axiomatic of abstract quantities.</p>
<p><strong>Context:</strong> AO, chapter 3 (the three social machines). TP, plateaus 5 (regimes of signs) and 13 (apparatus of capture).</p>
<h4 class="r-h3">21. Libido / Numen / Voluptas</h4>
<p><strong>Definition:</strong> Three forms of energy corresponding to the three passive syntheses of the unconscious. <strong>Libido</strong> is the energy of the connective synthesis (production) -- the energy of drawings-off, connecting partial objects with flows. <strong>Numen</strong> is the energy of the disjunctive synthesis (recording) -- the divine energy of detachments, operating on the surface of the BwO. <strong>Voluptas</strong> is the energy of the conjunctive synthesis (consumption) -- the residual pleasure from which the nomadic subject emerges.</p>
<p><strong>Context:</strong> AO, chapter 1 (sections 1--3) and chapter 2 (the summary of the syntheses).</p>
<h4 class="r-h3">22. Line of Flight (<em>ligne de fuite</em>)</h4>
<p><strong>Definition:</strong> An abstract, nonsegmentary line corresponding to absolute deterritorialization. The line of flight does not join points but passes between them, leading to becoming-imperceptible. It is neither a withdrawal nor a passive escape, but the creative act of "making a way out" for the whole system. It can, however, turn into a line of death if deprived of caution.</p>
<p><strong>Context:</strong> AO, chapter 4 (the schizo-revolutionary pole). TP, plateaus 8 (<em>Three Novellas</em>) and 9 (<em>Micropolitics and Segmentarity</em>), where lines of flight become the central tool of schizoanalytic cartography.</p>
<p><strong>Evolution AO--TP:</strong> In AO the line of flight is bound up above all with the deterritorialization of the flows of desire. In TP the concept gains cartographic precision: it becomes one of the three fundamental lines (alongside the molar and the molecular), and its dangers (the line of death, the passion for abolition) are analyzed in detail.</p>
<h4 class="r-h3">23. Abstract Machine (<em>machine abstraite</em>)</h4>
<p><strong>Definition:</strong> An immanent and singular mechanism consisting of unformed matters (phylum) and nonformal functions (diagram). The abstract machine has neither form nor substance -- it serves as a "piloting" mechanism, tracing lines of flight and effecting mutations in assemblages. It exists in two states: enveloped (ecumenon -- imprisoned in a stratum) and developed (planomenon -- cutting across the strata on the plane of consistency).</p>
<p><strong>Context:</strong> TP, plateau 3 (<em>The Geology of Morals</em>), 5 (<em>On Several Regimes of Signs</em>), and the conclusion.</p>
<h4 class="r-h3">24. Desiring-Machine (<em>machine désirante</em>)</h4>
<p><strong>Definition:</strong> A real system of cuts and flows constituting the microphysical unit of the unconscious. The desiring-machine is neither a metaphor nor a tool -- it is a machinic arrangement in which desire produces reality. It works only by breaking down; it is composed of partial objects bound together by an "absence of bond" (inclusive disjunction). It is a "daughter born without a mother" -- deriving not from reproduction but from connections on the BwO.</p>
<p><strong>Context:</strong> AO, chapter 1 (all sections) and the appendix (<em>Balance Sheet–Program for Desiring-Machines</em>).</p>
<p><strong>Evolution AO--TP:</strong> In TP the desiring-machines are developed into the concept of the assemblage (agencement), which is more flexible and covers additional dimensions (territoriality, enunciation).</p>
<h4 class="r-h3">25. War Machine (<em>machine de guerre</em>)</h4>
<p><strong>Definition:</strong> An invention of the nomads, by definition exterior to the State apparatus. The primary object of the war machine is not war but the occupation and holding of smooth space. War becomes its object only at the moment of collision with the State. The State has no war machine of its own -- it can only annex one in the form of a military institution, which always involves tensions and instability.</p>
<p><strong>Context:</strong> TP, plateau 12 (<em>Treatise on Nomadology</em>).</p>
<h4 class="r-h3">26. Micropolitics / Macropolitics (<em>micropolitique / macropolitique</em>)</h4>
<p><strong>Definition:</strong> Two coexisting and mutually interpenetrating dimensions of politics. Macropolitics deals with molar aggregates and rigid segments (classes, the state, institutions). Micropolitics operates at the level of molecular flows and the "little streams" of desire that escape macropolitical control. There is no macropolitics without micropolitics, and vice versa.</p>
<p><strong>Context:</strong> TP, plateau 9 (<em>Micropolitics and Segmentarity</em>). The key thesis: fascism is above all a micropolitical phenomenon -- a molecular mass movement grounded in microfascisms.</p>
<h4 class="r-h3">27. Molar / Molecular (<em>molaire / moléculaire</em>)</h4>
<p><strong>Definition:</strong> Two orders of magnitude, which are not metaphors but real states of matter and energy. The <strong>molar order</strong> concerns large statistical aggregates, structured wholes subject to the law of large numbers (the state, classes, individuated persons). The <strong>molecular order</strong> is the domain of pre-personal singularities, pure intensities, and partial objects; the microphysics of the unconscious. The two orders coexist -- molar formations are the statistical result of the accumulation of molecular elements.</p>
<p><strong>Context:</strong> AO, chapter 1 (section 5) and chapter 4 (section 2, <em>The Molecular Unconscious</em>). TP, in all the plateaus, especially plateau 3 (strata), 9 (segmentarity), and the conclusion.</p>
<h4 class="r-h3">28. Partial Objects (<em>objets partiels</em>)</h4>
<p><strong>Definition:</strong> Self-standing, functional units of the desiring-machines (e.g., breast, mouth, anus). They are neither fragments of a lost totality (as in traditional psychoanalysis) nor parts of "global persons" (the Mother, the Father). They are molecular functions of the unconscious that emit or interrupt flows. They lack nothing -- lack is an ideological construct imposed by psychoanalysis and the ruling class.</p>
<p><strong>Context:</strong> AO, chapter 1 (sections 1 and 6) and chapter 2 (section 3, the critique of Melanie Klein).</p>
<h4 class="r-h3">29. Paralogism (<em>paralogisme</em>)</h4>
<p><strong>Definition:</strong> A logical error committed by psychoanalysis in its application of the syntheses of the unconscious. Deleuze and Guattari identify three main paralogisms (in some accounts -- five): (1) the paralogism of extrapolation (connective synthesis) -- the extrapolation of the partial object into the transcendent Phallus; (2) the paralogism of the double bind (disjunctive synthesis) -- the imprisonment of the unconscious in the Oedipal trap with no exit; (3) the paralogism of application (conjunctive synthesis) -- the "folding" of the social field onto the family triangle.</p>
<p><strong>Context:</strong> AO, chapter 2 (sections 3--6).</p>
<h4 class="r-h3">30. Machinic Phylum (<em>phylum machinique</em>)</h4>
<p><strong>Definition:</strong> Materiality in motion -- a flow of matter-energy in which matter possesses its own nonorganic life. The machinic phylum is the stream of matter that the nomadic artisan (the smith) "follows," discovering its internal tendencies instead of imposing an external form upon it.</p>
<p><strong>Context:</strong> TP, plateau 12 (<em>Nomadology</em>), in the analysis of metallurgy and minor science.</p>
<h4 class="r-h3">31. Plane of Consistency / Plane of Organization (<em>plan de consistance / plan d'organisation</em>)</h4>
<p><strong>Definition:</strong> Two antagonistic planes. The <strong>plane of organization</strong> (or of development) is transcendent and teleological -- a hidden plan governing the development of forms and the formation of subjects (the "judgment of God"). The <strong>plane of consistency</strong> (or of composition) is immanent -- it knows only longitudes (speeds and slownesses of unformed elements) and latitudes (intensive affects). It is the Body without Organs on which all haecceities and becomings are written.</p>
<p><strong>Context:</strong> TP, plateau 10 (<em>Becoming-Intense</em>) and the conclusion.</p>
<h4 class="r-h3">32. Nomadic Subject (<em>sujet nomade</em>)</h4>
<p><strong>Definition:</strong> A subject without fixed identity, permanently decentered, derived from the intensive states through which it passes on the Body without Organs. The nomadic subject is born of each successive state in the series and is reborn in the next, consuming the states that gave birth to it. It is the "remainder" (residuum) left over after the divisions on the surface of recording -- neither the center nor the cause of desire.</p>
<p><strong>Context:</strong> AO, chapter 1 (section 3, <em>The Subject and Pleasure</em>). The concept is already foreshadowed in Deleuze's text <em>How Do We Recognize Structuralism?</em> (1967/1972).</p>
<h4 class="r-h3">33. Desiring-Production (<em>production désirante</em>)</h4>
<p><strong>Definition:</strong> The fundamental process of the unconscious, in which desire does not express a lack but is a productive force generating reality (the Real). It consists of the three passive syntheses (connective, disjunctive, conjunctive) and is identical with social production -- the two differ only in their regime of functioning (molecular vs. molar).</p>
<p><strong>Context:</strong> AO, chapter 1; the ontological foundation of the entire work.</p>
<h4 class="r-h3">34. Rabattement (<em>rabattement</em>)</h4>
<p><strong>Definition:</strong> The operation of "applying" or "folding" the infinite socio-historical field (the set of departure: classes, races, history) onto the small, finite family triangle (the target set: daddy-mommy-me). It is the third paralogism of psychoanalysis, corresponding to the illegitimate use of the conjunctive synthesis.</p>
<p><strong>Context:</strong> AO, chapter 2 (section 5) and chapter 3 (<em>Oedipus at Last</em>).</p>
<h4 class="r-h3">35. Refrain / Ritornello (<em>ritournelle</em>)</h4>
<p><strong>Definition:</strong> A prism or crystal of space-time, which living beings use to organize their relation to chaos. The three aspects of the refrain: (1) establishing a center in the chaos (the child singing in the dark), (2) organizing a stable territory (the circle around the center), (3) opening that circle onto the cosmos (escape toward the forces of the future). The refrain is a vector of deterritorialization.</p>
<p><strong>Context:</strong> TP, plateau 11 (<em>Of the Refrain</em>). The refrain connects with the concepts of territory, deterritorialization, and assemblage.</p>
<h4 class="r-h3">36. Repression / Psychic Repression (<em>répression / refoulement</em>)</h4>
<p><strong>Definition:</strong> Two distinct though interconnected mechanisms. <strong>Social repression</strong> is a conscious, external operation exercised by the social machine upon desire. <strong>Psychic repression</strong> is an unconscious operation taking place inside the psychic apparatus. Psychic repression depends entirely on social repression -- the family serves as the "delegated agent of psychic repression," replacing real desiring-production with a falsified image of incestuous drives.</p>
<p><strong>Context:</strong> AO, chapter 2 (section 7, <em>Repression and Psychic Repression</em>).</p>
<h4 class="r-h3">37. Reterritorialization (<em>reterritorialisation</em>)</h4>
<p><strong>Definition:</strong> The movement of recreating a territory after deterritorialization. It can be creative (the creation of a new earth) or reactionary (an artificial reterritorialization on archaic forms such as the family, the nation, Oedipus). Capitalism functions through a double movement: it deterritorializes flows with one hand and reterritorializes them with the other.</p>
<p><strong>Context:</strong> AO, chapters 3 and 4. TP, in all the plateaus.</p>
<h4 class="r-h3">38. Schizoanalysis (<em>schizo-analyse</em>)</h4>
<p><strong>Definition:</strong> A transcendental and materialist analysis that treats the unconscious as a factory producing reality, not as a theater of representations. It comprises negative tasks (the destruction of Oedipus, castration, the signifier) and positive ones (discovering the subject's desiring-machines; reaching the unconscious investments of the social field). Instead of asking "what does it mean?", it asks "how does it work?". In TP schizoanalysis becomes a cartography of lines, a pragmatics, and a micropolitics.</p>
<p><strong>Context:</strong> AO, chapter 4 (<em>Introduction to Schizoanalysis</em>). TP, the conclusion and plateaus 8--9.</p>
<h4 class="r-h3">39. Schizophrenia: Process vs. Clinical Entity (<em>schizophrénie: processus vs. entité clinique</em>)</h4>
<p><strong>Definition:</strong> A key distinction. <strong>Schizophrenia as process</strong> is the fundamental matrix of the unconscious; a positive movement of deterritorialization, a "breakthrough" that crosses social limits. <strong>Clinical schizophrenia</strong> is the "autistic human wreck," the product of psychiatry and social repression, arising from the brutal interruption of the schizophrenic process; it is a "breakdown," not the outcome of the process.</p>
<p><strong>Context:</strong> AO, chapter 1 (section 4, <em>Materialist Psychiatry</em>) and chapter 2 (section 9, <em>The Process</em>).</p>
<h4 class="r-h3">40. Schizophrenization (<em>schizophrénisation</em>)</h4>
<p><strong>Definition:</strong> The unblocking of the schizophrenic process in the social field -- the breaking up of molar structures (Oedipus, the "I") in order to liberate the molecular flows of desire. It does not mean inducing the clinical illness, but freeing deterritorialization toward a revolutionary outlet. Schizoanalysis is to "cure humanity of the therapeutic cure" (neuroticization).</p>
<p><strong>Context:</strong> AO, chapter 1 (section 4) and chapter 4 (section 4).</p>
<h4 class="r-h3">41. Segmentarity (<em>segmentarité</em>)</h4>
<p><strong>Definition:</strong> Human beings are "segmentary animals" -- they organize their lives in segments. Molar (rigid) segmentarity is characterized by binary oppositions, concentric circles, and overcoded lines; it is the domain of the State apparatus. Molecular (supple) segmentarity rests on flows of desire and belief, with fluid segments and blurred boundaries.</p>
<p><strong>Context:</strong> TP, plateau 9 (<em>Micropolitics and Segmentarity</em>).</p>
<h4 class="r-h3">42. Simulacrum (<em>simulacre</em>)</h4>
<p><strong>Definition:</strong> In the context of AO: private persons (father, mother, child) as "images of images" -- simulacra that do not represent real social production but are domestic "residua" allowing capitalism to apply social images to private persons. The simulacrum is the third degree of capitalist representation (after the figures of the axiomatic and the social images/personae).</p>
<p><strong>Context:</strong> AO, chapter 3 (section 10, <em>Capitalist Representation</em>).</p>
<h4 class="r-h3">43. Socius</h4>
<p><strong>Definition:</strong> The "full body" of a given social formation -- the instance of antiproduction whose principal role is to fall back upon the processes of production and appropriate them to itself as quasi-cause. The three historical forms of the socius: the Earth (territorial machine), the Body of the Despot/God (despotic machine), and Capital-Money (capitalist machine). The socius is the social counterpart of the individual BwO.</p>
<p><strong>Context:</strong> AO, chapter 3.</p>
<p><strong>Evolution AO--TP:</strong> In TP the concept of the socius is developed in the direction of the concept of the strata -- the layers of stratification on the Body of the Earth.</p>
<h4 class="r-h3">44. Becoming (<em>devenir</em>)</h4>
<p><strong>Definition:</strong> A real process of differentiation, strictly distinguished from imitation, filiation, and resemblance. Becoming is a creative involution, a movement running "between" terms and beneath assignable relations. It proceeds by the order of alliance (contagion, epidemic), not by the order of heredity. The series of becomings: becoming-woman (the first, introductory one), becoming-child, becoming-animal, becoming-molecular, becoming-imperceptible (the ultimate end).</p>
<p><strong>Context:</strong> TP, plateau 10 (<em>Becoming-Intense</em>).</p>
<h4 class="r-h3">45. Strata / Stratification (<em>strate / stratification</em>)</h4>
<p><strong>Definition:</strong> Layers or belts existing as "thickenings" on the Body of the Earth. The strata organize unstable matters and "imprison" free intensities in systems of resonance and redundancy. Each stratum is "doubly articulated" -- it has a content (formed matters) and an expression (formalized structures). The three major strata: physicochemical, organic, alloplastic (anthropomorphic). Stratification is compared to the "judgment of God" -- an operation that limits the intensity of the Earth.</p>
<p><strong>Context:</strong> TP, plateau 3 (<em>The Geology of Morals</em>) and the conclusion.</p>
<h4 class="r-h3">46. Connective / Disjunctive / Conjunctive Synthesis (<em>synthèse connective / disjonctive / conjonctive</em>)</h4>
<p><strong>Definition:</strong> The three passive syntheses of the unconscious, constituting the foundation of desiring-production. (1) The <strong>connective synthesis</strong> (of production) -- "and… and then…" -- couples organ-machines with source-machines, mobilizing Libido. (2) The <strong>disjunctive synthesis</strong> (of recording) -- "or…" -- records the processes on the BwO, mobilizing Numen. (3) The <strong>conjunctive synthesis</strong> (of consumption) -- "so that's what it was!" -- consumes the intensive states, producing the subject as residuum and mobilizing Voluptas.</p>
<p><strong>Context:</strong> AO, chapter 1 (sections 1--3) and chapter 2 (sections 3--6, the legitimate vs. illegitimate uses of the syntheses).</p>
<p><strong>Evolution AO--TP:</strong> In TP the three syntheses are not directly repeated, but their logic permeates the concept of the three lines (molar, molecular, of flight) and the conception of the strata as double articulation.</p>
<h4 class="r-h3">47. Territory (<em>territoire</em>)</h4>
<p><strong>Definition:</strong> In TP: it arises when milieu components cease to be purely functional and become expressive or qualitative. The territory is the first assemblage -- a "having" deeper than "being." It marks out a critical distance and organizes space around expressive signs. The territory is not a synonym for a "geographic area" -- it is an act of expression that constitutes a "home."</p>
<p><strong>Context:</strong> TP, plateaus 11 (<em>Of the Refrain</em>) and 12 (<em>Nomadology</em>).</p>
<h4 class="r-h3">48. Incorporeal Transformations (<em>transformations incorporelles</em>)</h4>
<p><strong>Definition:</strong> Linguistic acts in which order-words (mots d'ordre) instantaneously attribute new attributes to bodies without changing their materiality. The judge's sentence transforms the accused into a convict; the hijacker transforms the passengers into hostages. Incorporeal transformations are pure events, recognizable by their instantaneity.</p>
<p><strong>Context:</strong> TP, plateau 4 (<em>Postulates of Linguistics</em>).</p>
<h4 class="r-h3">49. Faciality (<em>visagéité</em>)</h4>
<p><strong>Definition:</strong> The abstract machine that produces the face by imposing the white-wall/black-hole system upon the body and the head. The face is not a natural element of the human body -- it is produced by concrete assemblages of power. The face of Christ is the central model of the Western faciality machine, functioning like a "central computer" for biunivocalization (the scanning and categorization of faces according to their degrees of deviation from the White-Man standard). Racism operates through faciality.</p>
<p><strong>Context:</strong> TP, plateau 7 (<em>Year Zero: Faciality</em>).</p>
<h4 class="r-h3">50. Urstaat</h4>
<p><strong>Definition:</strong> The primordial state -- the originary, timeless model of the State, which haunts the whole of universal history as its horizon. It is not a concrete historical state but an abstract machine that returns in every social formation. The Urstaat is "eternal" -- it "always was and always will be," a virtuality in the background of every society. Primitive societies actively exorcise the Urstaat.</p>
<p><strong>Context:</strong> AO, chapter 3 (section 8). TP, plateaus 12 and 13.</p>
<h4 class="r-h3">51. Surplus Value of Code / Surplus Value of Flow (<em>plus-value de code / plus-value de flux</em>)</h4>
<p><strong>Definition:</strong> Two types of surplus corresponding to two types of social machine. The <strong>surplus value of code</strong> occurs in primitive and despotic societies -- a qualitative surplus based on prestige, debt, and honor. The <strong>surplus value of flow</strong> occurs under capitalism -- quantitative, determined by the differential relation between the flow of financing (capital) and the flow of wages (labor).</p>
<p><strong>Context:</strong> AO, chapter 3 (sections 5 and 9) and chapter 1 (section 5, machinic surplus as the capture of code).</p>
<h4 class="r-h3">52. Multiplicity (<em>multiplicité</em>)</h4>
<p><strong>Definition:</strong> A category used as a substantive, not an adjective, abolishing the opposition of "the one and the many." A multiplicity is defined not by interior points but by the "outside" -- the lines of flight or deterritorialization along which it connects with other multiplicities. It has neither subject nor object -- only determinations and dimensions that cannot increase without the multiplicity changing in nature. A concept inspired by Riemann's mathematics and Bergson's philosophy.</p>
<p><strong>Context:</strong> TP, plateau 1 (the third principle of the rhizome) and plateau 2 (the pack as molecular multiplicity vs. the mass as molar multiplicity).</p>`

      {
        id: 26,
        title: "The Conceptual Network -- From Anti-Oedipus to A Thousand Plateaus",
        html: `<h4 class="r-h3">25.1. Desiring-Machines → Assemblages</h4>
<p>The evolution from desiring-machines to assemblages is the most fundamental conceptual shift between the two volumes. In <em>Anti-Oedipus</em> the desiring-machine is defined as a binary system of cuts and flows -- the microphysics of the unconscious, in which desire produces reality. The concept accents above all the productive and clinical dimension: desiring-machines function at the molecular level, and their relation to social (molar) machines is described in terms of an identity of nature with a difference of regime.</p>
<p>In <em>A Thousand Plateaus</em> the desiring-machine gives way to the concept of the assemblage (<em>agencement</em>), which is more multidimensional. The assemblage has a horizontal axis (the machinic assemblage of bodies + the collective assemblage of enunciation) and a vertical axis (territoriality ↔ deterritorialization). This "tetravalence" makes possible the simultaneous analysis of material bodies, speech acts, processes of territorialization, and lines of flight -- something the concept of the desiring-machine did not cover systematically.</p>
<p>This shift is not a rejection but a development. As Buchanan observes, the desiring-machines remain the "interior" of the assemblages -- their libidinal, molecular base. The assemblage, in turn, makes it possible to describe the relation between desire and the social field without reducing either to the other.</p>
<h4 class="r-h3">25.2. The BwO as Clinical Concept → the BwO as Plane of Consistency</h4>
<p>In <em>Anti-Oedipus</em> the Body without Organs is an element of the process of desiring-production -- the surface of recording on which the desiring-machines deposit their intensities. The BwO's relation to the desiring-machines is at once conflictual (repulsion -- the paranoiac machines) and complementary (attraction -- the miraculating machines). The BwO performs a clinical function: it is the experience of the schizophrenic, the catatonic, the masochist.</p>
<p>In <em>A Thousand Plateaus</em> the BwO attains the rank of an ontological concept. It becomes the Body of the Earth -- the plane of consistency on which the strata form as thickenings. Plateau 6 (<em>How Do You Make Yourself a BwO?</em>) transforms the BwO from a descriptive into a practical and experimental concept, introducing a typology (the full, empty, and cancerous BwO) and the principle of caution. The BwO is no longer merely a surface of recording but the field of immanence of desire -- the plane on which all assemblages, strata, and lines of flight can be cartographically mapped.</p>
<h4 class="r-h3">25.3. The Three Syntheses → the Three Lines</h4>
<p>The three passive syntheses of the unconscious (connective, disjunctive, conjunctive) constitute the central mechanism of <em>Anti-Oedipus</em>. In <em>A Thousand Plateaus</em> they are not directly repeated, but their logic is transposed onto the concept of the three lines, which organize schizoanalytic cartography.</p>
<p>The molar line (rigid segmentarity) corresponds to the illegitimate use of the syntheses -- congealed forms, binary divisions, Oedipal triangulation. The molecular line (supple segmentarity) corresponds to the micropolitics of desire -- small displacements, cracks, flows escaping molar control. The line of flight corresponds to the process of deterritorialization -- the absolute movement that crosses all segments.</p>
<p>The passage from the syntheses to the lines marks a change of perspective: from the analysis of the mechanisms of desiring-production to the cartography of a life (individual and collective). Schizoanalysis in TP no longer asks primarily about "the subject's desiring-machines" but about "the lines that compose him."</p>
<h4 class="r-h3">25.4. Socius → Strata</h4>
<p>The concept of the socius -- the "full body" of a social formation -- is in <em>Anti-Oedipus</em> a tool for the analysis of universal history (the Earth, the Despot, Capital). In <em>A Thousand Plateaus</em> the socius is incorporated into a broader ontology of stratification. The strata are not only social formations but the layers organizing the whole of reality: physicochemical, organic, alloplastic. The socius is a special case of a stratum -- a layer in which social matter is doubly articulated into content and expression.</p>
<p>This shift broadens the scope of the analysis: schizoanalysis in TP is not limited to social critique but takes in geology, biology, and semiotics as dimensions of stratification.</p>
<h4 class="r-h3">25.5. Molar/Molecular: Deepening and Development</h4>
<p>The molar/molecular distinction is present in both volumes, but in <em>A Thousand Plateaus</em> it acquires a multidimensional precision. In AO the opposition describes above all the relation between desiring-machines (molecular) and social machines (molar), with the thesis of an identity of nature and a difference of regime. In TP the molar/molecular becomes a tool of micropolitics: the molecular movements of desire can both undermine molar structures (revolution) and reinforce them (microfascism). Fascism is analyzed as an above all molecular phenomenon -- a "cancerous BwO" in which small black holes begin to resonate with one another.</p>
<h4 class="r-h3">25.6. Deterritorialization: From Economic Process to an Ontology of Movement</h4>
<p>In <em>Anti-Oedipus</em> deterritorialization is above all an economico-historical category: capitalism deterritorializes flows (tearing workers from the land, money from production) while simultaneously reterritorializing them on artificial residues (the family, the state, Oedipus). In <em>A Thousand Plateaus</em> deterritorialization becomes a fundamental ontological movement, inscribed in the very nature of strata, assemblages, and lines of flight. It receives a systematic typology (relative/absolute, positive/negative) and becomes the central analytic tool in all the plateaus -- from linguistics to aesthetics, from politics to geology.</p>
<h4 class="r-h3">25.7. The Critique of Psychoanalysis: From Frontal Attack to Subtle Cartography</h4>
<p><em>Anti-Oedipus</em> is above all a systematic critique of psychoanalysis and the Oedipus complex. Chapter 2 is a merciless dismantling of the psychoanalytic paralogisms, and chapter 4 proposes schizoanalysis as a radical alternative. The tone is polemical, at times pamphleteering.</p>
<p>In <em>A Thousand Plateaus</em> the critique of psychoanalysis does not disappear, but it changes form. Instead of a frontal attack, the authors propose a subtle cartography of alternative concepts that render psychoanalysis superfluous. Plateau 2 (<em>One or Several Wolves?</em>) is the last great reckoning with Freud (the reduction of the wolf pack to the father), but most of the plateaus construct positive analytic tools (rhizome, assemblage, becoming, lines, regimes of signs) that simply have no need of Oedipus, castration, or the Signifier. Schizoanalysis in TP is above all cartography and pragmatics, not anti-psychoanalysis.</p>`

      {
        id: 27,
        title: "A Synthesis of the Schizoanalytic Project",
        html: `<h4 class="r-h3">26.1. Schizoanalysis as Practice: Cartography, Pragmatics, Micropolitics, Experimentation</h4>
<p>Schizoanalysis, inaugurated in <em>Anti-Oedipus</em> and developed in <em>A Thousand Plateaus</em>, is not a theory in the traditional sense -- it is above all a <strong>practice</strong>. Its character can be described through four interdependent dimensions.</p>
<p><strong>Cartography.</strong> Schizoanalysis replaces interpretation (hermeneutics) with mapping. It does not look for hidden meanings but draws maps of the lines that make up the life of an individual or a group: molar lines (rigid institutional segments), molecular lines (supple micro-movements of desire), and lines of flight (creative deterritorializations). The map, unlike the tracing, is open, connectable, detachable, and reversible. It does not reproduce a ready-made model but constructs new possibilities.</p>
<p><strong>Pragmatics.</strong> Schizoanalysis is a pragmatics in a double sense: semiotic (the analysis of concrete regimes of signs and their mixtures, instead of the search for a universal Signifier) and political (the investigation of how assemblages actually function in a given context). The question "how does it work?" replaces the question "what does it mean?". This change of perspective is fundamental: the unconscious expresses nothing, it produces; it does not act out myths, it assembles machines.</p>
<p><strong>Micropolitics.</strong> Schizoanalysis operates at the micropolitical level, examining the molecular movements of desire that escape macropolitical analysis. The key thesis runs: there is no macropolitics without micropolitics, and vice versa. Fascism is born not of ideology but of microfascisms -- molecular "black holes" of desire that begin to resonate with one another. Revolution consists not in seizing the State apparatus but in schizophrenizing the social field -- freeing the flows of desire from paranoiac structures.</p>
<p><strong>Experimentation.</strong> Schizoanalysis is experimentation on the Body without Organs, not the discovery of hidden truths. Experimentation means constructing the plane of consistency piece by piece, with caution. The point is not violent destratification (which leads to catastrophe -- the empty or cancerous BwO) but the patient dismantling of the organism with "a very fine file," while retaining enough organization and subjectivity to survive.</p>
<h4 class="r-h3">26.2. The Four Tasks of Schizoanalysis (Negative and Positive)</h4>
<p>Deleuze and Guattari define the program of schizoanalysis through four tasks, which must be carried out simultaneously and which condition one another.</p>
<p><strong>The first negative (destructive) task: the curettage of the unconscious.</strong> It consists in the physical demolition of the Oedipal representations, of castration, of the Phallus as transcendent Signifier, of the superego, the "I," and guilt. The schizoanalyst does not "work through" problems (which preserves them) but destroys them. The destruction extends to the very belief in meaning and symbolism, which stifles desiring-production. This is the "curettage" of the unconscious -- the cleansing of the field of desire of the ideological forms imposed upon it.</p>
<p><strong>The second negative task: the breaking up of the reterritorializations.</strong> It consists in dismantling the artificial territories on which capitalism reterritorializes the decoded flows -- above all the Oedipal family, nationalism, and the other forms of the "intimate colonial formation." This task is inseparable from political analysis.</p>
<p><strong>The first positive task: the discovery of the desiring-machines.</strong> It consists in establishing how a given subject's desiring-machines function -- what he feeds into his machines, what he draws out of them, what breakdowns make up their operation. Schizoanalysis looks for "machinic indices" in social and technical machines, independently of any interpretation.</p>
<p><strong>The second positive task: reaching the social investments of desire.</strong> It consists in distinguishing the unconscious libidinal investments of the social field (of group, of desire) from the preconscious investments of interest (of class, rational ones). The key question is: which pole does desire invest -- the paranoiac-reactionary (fascisizing, territorializing) or the schizo-revolutionary (nomadic, deterritorializing)?</p>
<h4 class="r-h3">26.3. The "New Earth" as Horizon</h4>
<p>The concept of the "new earth" appears in the culminating passages of both volumes as the horizon of the schizoanalytic project. The new earth is neither a utopian promised land nor a future ideal state -- it is something created in the very course of deterritorialization. It is a "haven of healing" in which desire is no longer blocked by codes or axioms. The new earth arises when artistic, scientific, and analytic machines become component parts of the revolutionary machine, forming a plane of immanence on which desire produces reality without the mediation of lack.</p>
<p>The program of schizoanalysis strives to ensure that the process of deterritorialization does not end in a "breakdown" into illness but becomes a "breakthrough" toward the new earth. This is at once a clinical, a political, and an existential task.</p>
<h4 class="r-h3">26.4. The Connection with Kant: The Transcendental Critique of Desire</h4>
<p>As Dr. Joanna Bednarek emphasizes, the project of <em>Anti-Oedipus</em> is rooted in the Kantian tradition of transcendental critique. Deleuze and Guattari do not ask about the "nature" of desire (which would lead to dogmatism) but about the <strong>conditions of possibility</strong> -- about what must happen for concrete forms of discourse (analytic, political) and the desiring being itself to emerge. Schizoanalysis is transcendental because it examines the immanent criteria of the field of the unconscious instead of imposing external (transcendent) laws upon it, such as Oedipus or castration.</p>
<p>The distinction between the legitimate (transcendental) and the illegitimate (transcendent) use of the syntheses is a direct echo of the Kantian distinction between the immanent and the transcendent use of the categories. Just as Kant showed that reason falls into antinomies when it ventures beyond the bounds of possible experience, so Deleuze and Guattari show that psychoanalysis falls into paralogisms when it ventures beyond the bounds of desiring-production and imposes external forms upon it (the Phallus, castration, Oedipus).</p>
<p>At the same time schizoanalysis is materialist, for it treats the unconscious as a factory producing reality -- not as a sphere of representations. The transcendental critique of desire is thus a materialist critique: it examines the conditions of possibility of real production, not of ideal forms.</p>`

      {
        id: 28,
        title: "Schizoanalysis and Contemporary Philosophy",
        html: `<h4 class="r-h3">27.1. The Influence on Posthumanism, New Materialism, and Affect Theory</h4>
<p>The schizoanalytic project of Deleuze and Guattari has exerted a deep influence on contemporary philosophical currents whose development began at the turn of the twentieth and twenty-first centuries.</p>
<p><strong>Posthumanism.</strong> Concepts such as assemblage, becoming, haecceity, and the Body without Organs supplied posthumanism with tools for thinking subjectivity beyond anthropocentrism. The thesis that "the subject is a remainder" of a machinic process, and that "desiring-machines" join human and nonhuman elements in functional arrangements, anticipates the posthumanist deconstruction of the boundary between human and machine, organism and environment. Donna Haraway, Rosi Braidotti, and Karen Barad draw on this conceptual apparatus, developing the conceptions of "nomadic subjectivity," "companion species," and "intra-action."</p>
<p><strong>New materialism.</strong> The schizoanalytic conception of matter as an active, self-organizing force (the machinic phylum, matter-flow) is the direct foundation of new materialism. The idea that matter possesses "its own nonorganic life," and that the formation and the functioning of machines are identical at the molecular level, anticipates Jane Bennett's "vital materialism" and the "flat ontology" of Manuel DeLanda, who explicitly constructs his philosophy on the conceptual basis of Deleuze and Guattari.</p>
<p><strong>Affect theory.</strong> The schizoanalytic conception of intensity, of haecceity, and of the body defined by affects (the capacity to affect and to be affected) is one of the principal sources of contemporary affect theory. Brian Massumi, a direct student and translator of Deleuze, developed these concepts in the direction of the analysis of bodily experience, the politics of fear, and affective logic in the media.</p>
<h4 class="r-h3">27.2. Schizoanalysis and Digital Capitalism (Contemporary Relevance)</h4>
<p>The analysis of capitalism carried out in <em>Capitalism and Schizophrenia</em> retains an extraordinary relevance in the context of digital and platform capitalism. Several threads deserve particular attention.</p>
<p><strong>The axiomatic and the flexibility of capitalism.</strong> The thesis that capitalism operates not through codes but through an axiomatic to which axioms can be added or subtracted describes with precision the mechanism of digital platforms: algorithms "mean" nothing; they regulate flows of data, attention, and capital by means of purely functional rules that can be altered in real time.</p>
<p><strong>Machinic enslavement.</strong> The concept of machinic enslavement (<em>asservissement machinique</em>), in which the human being is a component part of the machine (rather than a subject using a tool), describes the situation of the user of digital platforms, whose attention, data, and social relations are "captured" and incorporated into algorithmic circuits as elements of a value-producing machine.</p>
<p><strong>Microfascism and social media.</strong> The analysis of fascism as a molecular phenomenon -- the proliferation of microfascisms that begin to resonate -- sheds light on the dynamics of radicalization in social media, where algorithms amplify micro-affects (fear, anger, disgust), creating a "cancerous BwO" of mass paranoia.</p>
<p><strong>Deterritorialization and reterritorialization in the digital age.</strong> Capitalism's double movement -- deterritorializing flows with one hand, reterritorializing them with the other -- describes the dynamics of digital globalization: the internet deterritorializes communication, commerce, and identity, while the platforms reterritorialize these flows onto their closed ecosystems, creating new forms of enclosure and control.</p>
<h4 class="r-h3">27.3. Open Questions and Limits of the Project</h4>
<p>Despite its conceptual richness and its influence on contemporary philosophy, the schizoanalytic project leaves a number of questions open.</p>
<p><strong>The problem of clinical practice.</strong> Deleuze and Guattari postulate schizoanalysis as an alternative to psychoanalysis, but they do not provide a systematic description of clinical practice. Guattari developed schizoanalysis at La Borde and in his later works (<em>Schizoanalytic Cartographies</em>, 1989), but the question of a concrete therapeutic methodology remains open.</p>
<p><strong>The problem of normative evaluation.</strong> The authors repeatedly stress that the smooth is not in advance "better" than the striated, and that the line of flight can turn into a line of death. Yet their writing sometimes suggests a preference for the molecular, deterritorializing pole. The question of normative criteria -- when is deterritorialization creative and when destructive -- receives no fully satisfying answer beyond the general principle of "caution."</p>
<p><strong>The problem of ecology.</strong> Although concepts such as the "Body of the Earth" and the plane of consistency have ecological potential, Deleuze and Guattari did not develop a systematic political ecology. Contemporary researchers (e.g., Guattari in <em>The Three Ecologies</em>, 1989) and their continuators (Isabelle Stengers, Bruno Latour) take up this task, but the relation between schizoanalysis and ecological thought requires further development.</p>
<p><strong>The problem of the political subject.</strong> Schizoanalysis effectively deconstructs the traditional forms of political subjectivity (class, party, nation), but the question of "who" carries out the schizophrenization of the social field, and of how "subject-groups" are formed, remains open. The concept of "a people to come" points to a horizon but does not supply a strategy.</p>`

        html: `<h4 class="r-h3">28.1. A Summary of the Main Theses of the Two Volumes</h4>
<p><em>Anti-Oedipus</em> (1972) and <em>A Thousand Plateaus</em> (1980) together form the two-volume work <em>Capitalism and Schizophrenia</em>, whose main theses can be summarized as follows:</p>
<p>1. <strong>The unconscious is a factory, not a theater.</strong> Desire does not express a lack; it is a productive force generating reality. The unconscious consists of desiring-machines (AO) / assemblages (TP), which join heterogeneous elements into functional arrangements.</p>
<p>2. <strong>Desire is directly social.</strong> The libido needs no mediation by the family to invest the socio-historical field. "There is only desire and the social, and nothing else." Desire's investments in races, classes, machines, and history are primary with respect to familial investments.</p>
<p>3. <strong>Oedipus is an instrument of repression, not a psychological fact.</strong> The Oedipus complex is the "intimate colonial formation" by means of which capitalism reterritorializes the decoded flows of desire onto the privatized family. Psychoanalysis serves capitalism as a technique of neuroticization and oedipalization.</p>
<p>4. <strong>Capitalism is the only social machine built on decoded flows.</strong> Its specificity lies in a double movement: it decodes and deterritorializes flows (approaching schizophrenia as its absolute limit) while simultaneously reterritorializing them on artificial residues (family, state, nationalism). It operates by an axiomatic of abstract quantities, not by qualitative codes.</p>
<p>5. <strong>Schizophrenia is a process, not an illness.</strong> The hospital schizophrenic is the product of a repression that has brutally interrupted the natural process of deterritorialization. The schizophrenic process is a creative force whose revolutionary potential capitalism must repress in order to survive.</p>
<p>6. <strong>Reality organizes itself into strata, but beneath the strata lies the plane of consistency.</strong> The strata (layers) organize matters and intensities; the BwO is the destratified plane of immanence. Destratification requires caution -- a violent shattering of the strata leads to catastrophe.</p>
<p>7. <strong>Everything is a complex of lines.</strong> Individual and collective life consists of three types of line: molar lines (rigid segmentarity), molecular lines (supple segmentarity), and lines of flight (deterritorialization). Schizoanalysis is the cartography of these lines.</p>
<p>8. <strong>All becoming is minoritarian.</strong> Becoming is neither imitation nor filiative evolution but a creative involution proceeding by the order of alliance (contagion, pact). The series of becomings leads from becoming-woman to becoming-imperceptible.</p>
<p>9. <strong>The war machine is exterior to the State.</strong> The State has no war machine of its own -- it can only annex one. Resistance to the apparatus of capture requires the construction of new war machines that create smooth spaces against State striation.</p>
<p>10. <strong>The smooth and the striated exist only in mixture.</strong> No space is purely smooth or purely striated. What matters is tracking the concrete transformations and passages between them.</p>
<h4 class="r-h3">28.2. The Call to "Caution" as the Fundamental Principle of Schizoanalytic Practice</h4>
<p>One of the most important and most often overlooked threads of <em>Capitalism and Schizophrenia</em> is the call to caution (<em>prudence</em>). Deleuze and Guattari repeat it many times, with an emphasis that grows from AO to TP.</p>
<p>Caution means above all acknowledging that destratification -- the dismantling of the organism, of signifiance, and of subjectivity -- is a risky process. Too sudden a destratification leads to catastrophe: the empty BwO (catatonia, narcotic nothingness), the cancerous BwO (fascism, the proliferation of destruction), or the line of death (the suicidal passion for abolition). One must therefore "mimic the strata" -- keep enough of the organism, of subjectivity, and of meaning to survive, while patiently opening "small plots of new land" for experimentation.</p>
<p>Caution is not conservatism -- it is an art of dosages, "a very fine file" instead of a sledgehammer. It is the necessary condition of every creative deterritorialization. Without it the line of flight turns into a line of death, and revolution -- into terror.</p>
<p>This principle gives the schizoanalytic project a deeply ethical character. Schizoanalysis is neither a program of destruction nor a nihilism; it is the art of constructing new possibilities of life -- in full awareness of the dangers that every line of flight carries with it.</p>`

<script>
// ══════════════════════════════════════
// APP LOGIC
// ══════════════════════════════════════
(function(){

  // flatten chapters
  const allChapters = [];
  reportData.forEach(part => {
    part.chapters.forEach(ch => {
      allChapters.push({ ...ch, part: part.part });
    });
  });

  let currentIdx = 0;

  // ── build TOC ──
  const tocEl = document.getElementById('toc');
  let tocHTML = '';
  reportData.forEach(part => {
    tocHTML += `<div class="toc-part">${part.part}</div>`;
    part.chapters.forEach(ch => {
      const idx = allChapters.findIndex(c => c.id === ch.id);
      tocHTML += `<div class="toc-item" data-idx="${idx}">${ch.id}. ${ch.title}</div>`;
    });
  });
  tocEl.innerHTML = tocHTML;

  // TOC click
  tocEl.querySelectorAll('.toc-item').forEach(item => {
    item.addEventListener('click', () => {
      goTo(parseInt(item.dataset.idx));
      closeTocMobile();
    });
  });

  // ── render chapter ──
  const contentEl = document.getElementById('content');

  function render(idx) {
    currentIdx = idx;
    const ch = allChapters[idx];
    const prev = idx > 0 ? allChapters[idx - 1] : null;
    const next = idx < allChapters.length - 1 ? allChapters[idx + 1] : null;

    // estimate reading time (~200 words/min for academic Polish)
    const wordCount = ch.html.replace(/<[^>]+>/g, '').split(/\s+/).length;
    const readMin = Math.max(1, Math.round(wordCount / 180));

    contentEl.innerHTML = `
      <div class="chapter active">
        <div class="chapter-header">
          <div class="chapter-part-label">${ch.part}</div>
          <h1 class="chapter-title">Chapter ${ch.id}. ${ch.title}</h1>
          <div class="chapter-nav">
            <button onclick="goTo(${idx - 1})" ${!prev ? 'disabled' : ''}>← Previous</button>
            <button onclick="goTo(${idx + 1})" ${!next ? 'disabled' : ''}>Next →</button>
          </div>
          <div class="reading-info">~${readMin} min read · ${wordCount.toLocaleString('en')} words</div>
        </div>
        <div class="chapter-body">${ch.html}</div>
        <div class="chapter-footer">
          <button onclick="goTo(${idx - 1})" ${!prev ? 'disabled' : ''}>
            ${prev ? `<span class="prev-label">← Previous</span><span class="ch-name">${prev.title}</span>` : ''}
          </button>
          <button onclick="goTo(${idx + 1})" ${!next ? 'disabled' : ''}>
            ${next ? `<span class="next-label">Next →</span><span class="ch-name">${next.title}</span>` : ''}
          </button>
        </div>
      </div>
    `;

    // update TOC active
    tocEl.querySelectorAll('.toc-item').forEach(item => {
      item.classList.toggle('active', parseInt(item.dataset.idx) === idx);
    });
    // scroll active TOC item into view
    const activeItem = tocEl.querySelector('.toc-item.active');
    if (activeItem) activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

    // update progress
    updateProgress();

    // scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // save position
    try { localStorage.setItem('report_chapter', idx); } catch(e){}
  }

  // expose globally for onclick
  window.goTo = function(idx) {
    if (idx >= 0 && idx < allChapters.length) render(idx);
  };

  // ── progress bar ──
  function updateProgress() {
    const pct = ((currentIdx + 1) / allChapters.length * 100).toFixed(1);
    document.getElementById('progressFill').style.width = pct + '%';
  }

  // ── scroll progress within chapter ──
  window.addEventListener('scroll', () => {
    const scrollH = document.documentElement.scrollHeight - window.innerHeight;
    if (scrollH <= 0) return;
    const scrollPct = window.scrollY / scrollH;
    // blend chapter progress with scroll progress
    const chapterBase = currentIdx / allChapters.length * 100;
    const chapterSlice = 1 / allChapters.length * 100;
    const pct = chapterBase + chapterSlice * scrollPct;
    document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  });

  // ── TOC toggle (mobile) ──
  window.toggleToc = function() {
    document.getElementById('toc').classList.toggle('open');
    document.getElementById('tocOverlay').classList.toggle('open');
  };
  function closeTocMobile() {
    document.getElementById('toc').classList.remove('open');
    document.getElementById('tocOverlay').classList.remove('open');
  }

  // ── keyboard nav ──
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (currentIdx > 0) render(currentIdx - 1);
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (currentIdx < allChapters.length - 1) render(currentIdx + 1);
    }
  });

  // ── init ──
  let startIdx = 0;
  try { startIdx = parseInt(localStorage.getItem('report_chapter')) || 0; } catch(e){}
  if (startIdx < 0 || startIdx >= allChapters.length) startIdx = 0;
  render(startIdx);

})();
</script>
