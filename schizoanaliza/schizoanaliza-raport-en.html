        title: "Aim and Scope of the Report",
        html: `<h4 class="r-h3">1.1. The Object of Analysis</h4>
<p>This report undertakes an in-depth conceptual, structural, and argumentative analysis of the two foundational works of Gilles Deleuze and Félix Guattari that make up the project entitled <em>Capitalism and Schizophrenia</em>: <em>Anti-Oedipus: Capitalism and Schizophrenia</em> (<em>L'Anti-Œdipe. Capitalisme et schizophrénie</em>, 1972) and <em>A Thousand Plateaus: Capitalism and Schizophrenia 2</em> (<em>Mille plateaux. Capitalisme et schizophrénie 2</em>, 1980). Although the two volumes form a coherent intellectual project, they differ fundamentally in argumentative strategy, in style of writing, and in their dominant conceptual categories. The first is above all a critical work — aimed at psychoanalytic orthodoxy and its structural entanglement with capitalism. The second is a constructive work — it elaborates a positive ontology and a new theory of language, politics, art, and subjectivity.</p>
<p>The aim of this report is not to summarize these works but to carry out a systematic reconstruction of their conceptual apparatus, to trace the internal logic of their argumentation, and to capture the transformations that the key categories undergo in the passage from the first volume to the second. The ambition is to present schizoanalysis not as a loose collection of provocative theses but as a rigorous — if unorthodox — philosophical undertaking, possessing a methodological and ontological coherence of its own.</p>
<h4 class="r-h3">1.2. Methodology</h4>
<p>The method adopted here rests on three interrelated procedures:</p>
<p><strong>First: chapter-by-chapter analysis.</strong> Each chapter of both volumes is treated as a relatively autonomous argumentative unit, with its own central thesis, its own conceptual resources, and its own dynamics of exposition. Such segmentation makes it possible to grasp both the local logic of particular passages and their place within the architectonics of the work as a whole. In the case of <em>Anti-Oedipus</em>, which has a classical four-part structure, the analysis follows the linear stages of the argument. In the case of <em>A Thousand Plateaus</em>, which its authors explicitly designed as a non-linear, rhizomatic work, the analysis respects that intention while nonetheless reconstructing the hidden connections and resonances between the individual plateaus.</p>
<p><strong>Second: tracing the course of the argumentation.</strong> The point here is to grasp how Deleuze and Guattari build their reasoning — what premises they adopt, what rhetorical strategies they employ, what counterarguments they anticipate, what examples they invoke. Particular attention is given to moments of transition: the places where the authors draw decisive distinctions, introduce new concepts, or radically reformulate existing categories. We are also interested in points of tension — places where the argument seems to come into conflict with earlier findings, or where irreducible ambiguities appear.</p>
<p><strong>Third: extraction and systematization of the key concepts.</strong> Deleuze and Guattari created an extraordinarily elaborate and original conceptual vocabulary. Concepts such as <em>desiring-machines</em>, <em>the body without organs</em>, <em>territorialization/deterritorialization/reterritorialization</em>, <em>rhizome</em>, <em>plane of immanence</em>, <em>line of flight</em>, <em>abstract machine</em>, <em>assemblage</em> (agencement), and many others are tools of thought whose sense is fully revealed only in the context of their mutual relations. The report seeks to reconstruct this conceptual network, to display the internal connections between the categories, and to trace their genealogy and their transformations.</p>
<h4 class="r-h3">1.3. Preliminary Remarks on Style and Reception</h4>
<p>The works of Deleuze and Guattari are among the most controversial and polarizing texts in the history of twentieth-century philosophy. They have been attacked from analytic positions (the charge of a lack of rigor and of misusing scientific terminology) as well as from orthodox Marxist positions (the charge of idealism and voluntarism) and psychoanalytic ones (the charge of misunderstanding Freud and Lacan). At the same time, they have exerted an enormous influence on cultural theory, postcolonial studies, critical geography, the philosophy of technology, political ecology, and even the theory of architecture and urbanism.</p>
<p>This report endeavors to maintain an attitude of interpretive charity (the principle of charity), reconstructing the authors' arguments in their strongest form, while not refraining from raising critical questions wherever the argumentation appears incomplete or problematic.</p>`

        title: "The Philosophical Context — From Structuralism to Schizoanalysis",
        html: `<h4 class="r-h3">2.1. Deleuze as a Cartographer of Structuralism</h4>
<p>Before Deleuze began his collaboration with Guattari, he published, in 1967, a programmatic text: <em>How Do We Recognize Structuralism?</em> (<em>À quoi reconnaît-on le structuralisme?</em>), included in the volume <em>History of Philosophy</em> edited by François Châtelet. For the understanding of the later project of schizoanalysis this text is of altogether exceptional importance. Deleuze does not confine himself to a neutral description of the structuralist movement — he performs a creative interpretation which at once draws out the productive elements of structuralism and points to the directions in which they might be surpassed. He distinguishes seven criteria by which structuralist thought can be recognized.</p>
<h4 class="r-h3">2.2. The Seven Criteria of Structuralism</h4>
<p><strong>First criterion: the symbolic (le symbolique).</strong> Structuralism discovers a third order, irreducible either to the order of the real or to the order of the imaginary. The symbolic order is neither a reflection of reality nor a product of the imagination — it is an autonomous system of relations that conditions both the real and the imaginary. Deleuze stresses that this discovery of the symbolic constitutes the fundamental gesture of structuralism: language, kinship, economy, the unconscious — in all these domains the structuralists identify an irreducible symbolic level.</p>
<p><strong>Second criterion: the positional (le local ou de position).</strong> The elements of a structure possess neither essence nor internal content — their identity is fully determined by the positions they occupy within the structure. Sense is not the property of an isolated element but the effect of a position within a network of relations. Deleuze here appeals to the phonology of Jakobson and Trubetzkoy: the phoneme has no positive substance whatsoever; it is a pure positional value, determined solely by its differences from other phonemes.</p>
<p><strong>Third criterion: the differential (le différentiel et le singulier).</strong> The relations between the elements of a structure are differential in character — they are relations of differences, not of resemblances or analogies. The elements are not prior to the relations; on the contrary, it is the differential relations that establish the elements as such. Deleuze here joins a linguistic inspiration (Saussure: in language there are only differences) with a mathematical one (Leibniz's differential calculus as a model for thinking purely differential relations).</p>
<p><strong>Fourth criterion: seriality (les séries).</strong> A structure implies at least two heterogeneous series between which relations of correspondence obtain. These series are not symmetrical — one plays the role of the signifier (signifiant), the other of the signified (signifié). Deleuze here invokes the Lacanian conception of the two chains: the chain of signifiers and the chain of signifieds, whose mutual slippage (glissement) produces the effect of sense.</p>
<p><strong>Fifth criterion: the empty square (la case vide).</strong> This is perhaps the most important element of Deleuze's interpretation of structuralism. Between the two series there circulates a paradoxical element which is at once supernumerary in one series and missing from the other. This element — Deleuze, following Lacan, calls it the <em>objet = x</em> — has no fixed identity; it is what sets the structure in motion, what prevents its closure, what produces the dynamics of sense. It is an empty square, a lack which paradoxically conditions the fullness of meaning.</p>
<p><strong>Sixth criterion: the nomadic subject (le sujet).</strong> The subject of structuralism is neither a substantial nor a transcendental subject — it is an effect of the structure, produced by the circulation of the empty square. The subject is nomadic in the sense that it has no fixed place but moves according to the movements of the paradoxical element. It is not the source of sense but the product of the play of differences.</p>
<p><strong>Seventh criterion: practice (la pratique).</strong> Deleuze emphasizes that structuralism is not a contemplative theory but a form of practice. Structure is not merely an object of knowledge — it is a field of transformation. The discovery of a structure makes possible intervention, transformation, even revolution.</p>
<h4 class="r-h3">2.3. From Structure to Machine: Prefigurations of Schizoanalysis</h4>
<p>A retrospective reading of the 1967 text makes it possible to see how Deleuze's interpretation of structuralism was already clearing the way for the later project of schizoanalysis. Three moments of this prefiguration deserve particular attention.</p>
<p><strong>From the empty square to desiring-machines.</strong> The empty square is the element that introduces dynamism, movement, productivity into the structure. It is what makes the structure not a dead schema but a living process. In <em>Anti-Oedipus</em> this intuition is radicalized: the place of the empty square is taken by desiring-machines, which no longer circulate within a ready-made structure but themselves generate connections, themselves produce the real. The passage from the empty square to the desiring-machine is a passage from the logic of lack (manque) to the logic of production (production): the empty square is defined by what it does not contain, the desiring-machine — by what it produces.</p>
<p><strong>From the nomadic subject within the structure to the nomadic subject on the BwO.</strong> In the text on structuralism the subject is nomadic, but its nomadism is constrained by the topology of the structure — it moves across positions given in advance. In <em>Anti-Oedipus</em> and <em>A Thousand Plateaus</em> the subject's nomadism is freed from the frame of the structure: the subject traverses not positions in a closed system but intensities on the Body without Organs (Corps sans Organes, CsO). The BwO is not a structure — it is a surface of recording on which intensities disperse, condense, form zones and gradients.</p>
<p><strong>From structure to machine.</strong> Perhaps the most important passage: the concept of structure, with its implications of synchrony, closure, and the dominance of the symbolic, is replaced by the concept of the machine, which accents processuality, openness, and material production. The machine does not represent — it connects, it cuts across, it produces. It does not obey the logic of the signifier — it functions.</p>
<h4 class="r-h3">2.4. The Three Great Discoverers of the Unconscious: Marx, Nietzsche, Freud</h4>
<p>In <em>Anti-Oedipus</em> Deleuze and Guattari invoke Marx, Nietzsche, and Freud as the "three great discoverers" of the unconscious — three thinkers who, each in his own way, uncovered a domain of production hidden beneath the surface of conscious representations. Marx discovered social production as a process that its subjects neither control nor understand — the unconscious of political economy. Nietzsche discovered the production of values, the genealogy of forces operating beyond moral consciousness — the unconscious of the will to power. Freud discovered the production of desire, the dynamics of drives and fantasies that escape the ego's control — the unconscious of the libido.</p>
<p>In the view of Deleuze and Guattari, however, each of these discoverers at some point betrayed his own discovery. Marx subordinated production to representation (the commodity as form, base and superstructure as structure). Nietzsche lapsed into the reactive nihilism of an eternal return badly understood. Freud — and this is the central critical thesis of <em>Anti-Oedipus</em> — subordinated the production of desire to the Oedipal triangle, reduced the unconscious-as-factory to the unconscious-as-theater, replaced the real production of desire with its familial representation.</p>
<p>Schizoanalysis proposes itself as the project that takes up and radicalizes the discoveries of all three while avoiding their betrayals. It is a materialist psychiatry that joins the analysis of social production (Marx) with the analysis of the production of desire (Freud/Nietzsche), without subordinating either one to the other.</p>`

        html: `<h4 class="r-h3">3.1. Félix Guattari: Clinician, Inventor, Activist</h4>
<p>Félix Guattari (1930–1992) was not an academic philosopher. He was a psychoanalyst, an institutional psychotherapist, and a political activist. His intellectual formation took place across three mutually interpenetrating fields.</p>
<p><strong>The clinical field: La Borde.</strong> From 1955 Guattari worked at the La Borde psychiatric clinic, founded by Jean Oury. La Borde was the laboratory of institutional psychiatry (psychothérapie institutionnelle) — a movement which held that curing the patient requires simultaneously curing the institution in which the patient lives. At La Borde the traditional hierarchies between doctor and patient, between medical and technical staff, were systematically undermined. Patients took part in running the clinic, led workshops, organized events. This experience shaped Guattari as a thinker for whom desire is never a private, individual matter — it is always a collective, institutional, political matter.</p>
<p><strong>The psychoanalytic field: the dialogue with Lacan.</strong> Guattari was Lacan's analysand and for many years attended the Lacanian seminars. He knew the Lacanian conceptual apparatus from the inside — and it was precisely this familiarity that made so radical a critique possible. In his pre-Deleuzian writings Guattari worked out the concept of the <em>machine</em> as an alternative to the Lacanian <em>structure</em>: where Lacan saw a chain of signifiers, Guattari saw machinic arrangements of production. The concept of <em>desiring-machines</em> (machines désirantes) is Guattari's invention, though it was Deleuze who gave it its full philosophical articulation.</p>
<p><strong>The political field: subject-groups.</strong> Guattari was engaged in a wide range of political initiatives — from work with immigrants, through the antipsychiatry movement, to political ecology. He developed a distinction between the <em>subjugated group</em> (groupe assujetti), which reproduces within itself the hierarchies of the society around it, and the <em>subject-group</em> (groupe-sujet), which is capable of creatively articulating its own desire. This distinction would become one of the key analytic tools of <em>Anti-Oedipus</em>.</p>
<h4 class="r-h3">3.2. Gilles Deleuze: The Diamond Cutter</h4>
<p>Gilles Deleuze (1925–1995), by contrast, was a philosopher par excellence — a thinker deeply rooted in the philosophical tradition, the author of monographs on Hume, Nietzsche, Kant, Bergson, Spinoza, Leibniz, and Foucault. His contribution to the project of schizoanalysis consisted not in supplying clinical or political material, but in endowing that material with conceptual precision and philosophical depth.</p>
<p>Deleuze himself described his role in the collaboration with Guattari through the metaphor of the diamond cutter: Guattari supplied the "rough stones" — intuitions, clinical experiences, concepts in statu nascendi — and Deleuze gave them form, cut and polished them, built them into a conceptual architectonics. This is of course a simplification: Deleuze also brought his own deeply original philosophical intuitions, and Guattari was far from playing the role of a passive "supplier of material." Nevertheless, the division of roles is instructive: the encounter of philosopher and clinician generated a tension out of which an entirely new discursive formation was born.</p>
<p>Three philosophical traditions proved especially important for Deleuze's contribution to schizoanalysis:</p>
<p><strong>Spinoza</strong> supplied the model of an immanent ontology — a philosophy that appeals to no transcendent instance (God, Subject, Law) but thinks being as self-organizing production. The Spinozist conception of substance as causa sui, of the attributes as infinite modes of its expression, and of the modes as concrete configurations of force would become one of the foundations of the ontology of the plateaus.</p>
<p><strong>Nietzsche</strong> supplied the critique of values as the product of reactive forces, the conception of the eternal return as a selective ontological principle, and the vision of thought as experimentation rather than representation. The Nietzschean notion of active and reactive forces would be transformed into the Deleuzo-Guattarian distinction between lines of flight and lines of segmentarity.</p>
<p><strong>Bergson</strong> supplied the conception of time as duration (durée), the critique of the spatialization of time, the theory of the image as movement, and the conception of life as creative evolution. Bergsonian intuition — a specific philosophical method that allows reality to be grasped in its becoming — resonates with the Deleuzo-Guattarian emphasis on processuality, becoming (devenir), and experimentation.</p>
<h4 class="r-h3">3.3. The Historical Context: May '68 and the Crisis of Institutions</h4>
<p>The collaboration between Deleuze and Guattari began in 1969, that is, in the immediate aftermath of the events of May 1968. The importance of this context can hardly be overstated. For Deleuze and Guattari, May '68 was not simply a political event — it was an ontological experience, a disclosure of forces and possibilities that had hitherto remained suppressed. The events of May made it plain that desire is a political force, that libidinal investments have a directly social dimension, that the question "why do people desire their own oppression?" is a fundamental question — no less important than questions about relations of production or class structures.</p>
<p>At the same time, May '68 exposed — in the view of the authors of <em>Anti-Oedipus</em> — the deep inadequacy of the available theoretical tools. Orthodox Marxism could not explain why the revolutionary energy of the working class is so easily captured by reactive, fascisizing, authoritarian formations. Psychoanalysis, even in its Lacanian version, reduced desire to the family triangle and the dynamics of castration, unable to grasp its directly social, political, cosmic dimension.</p>
<p>Within the field of psychoanalysis the crisis had an institutional dimension as well. The Lacanian École Freudienne de Paris, despite its initial radicalism, was undergoing a gradual dogmatization. Lacan, who had himself accomplished a revolutionary breakthrough in psychoanalysis, was becoming an ever more authoritarian figure, and his school — a closed institution, reproducing within itself the very structures it officially criticized. Guattari, who knew this dynamic from direct experience, saw in it the symptom of a deeper problem: psychoanalysis is not simply a "mistaken theory" — it is a social machine that produces determinate subjective effects, among them the reproduction of Oedipal dependency.</p>
<h4 class="r-h3">3.4. The "Capitalism and Schizophrenia" Project: The Architectonics of the Two Volumes</h4>
<p>The <em>Capitalism and Schizophrenia</em> project was conceived as a two-volume work in which the volumes perform complementary yet asymmetrical functions.</p>
<p><strong>Volume One: <em>Anti-Oedipus</em> (1972) — critique.</strong> <em>Anti-Oedipus</em> is above all a polemical work. Its principal aim is the critique of the psychoanalytic conception of desire as lack, of the unconscious as an Oedipal theater, and of the subject as an effect of symbolic castration. The argumentative strategy consists in showing that psychoanalysis does not discover the "truth" of desire but imposes upon it a determinate form — the Oedipal form — which is at the same time a capitalist form. Oedipus is not a universal structure of the human psyche but a specific product of the capitalist organization of society, an instrument for the "privatization" of desire, for cutting it off from the social field and enclosing it in the family triangle (father–mother–child).</p>
<p>The positive core of <em>Anti-Oedipus</em> is the conception of desire as production. Desire is not lack, not a longing for what one does not have — it is the machinic production of the real. Desiring-machines connect, cut, produce flows — desire is a process, not a state. This conception leads to the formulation of the program of schizoanalysis as an alternative to psychoanalysis: instead of interpreting desire (what does it "mean"?), schizoanalysis asks how it works, what connections it generates, what flows it sets in motion.</p>
<p><strong>Volume Two: <em>A Thousand Plateaus</em> (1980) — construction.</strong> <em>A Thousand Plateaus</em> is a work radically different from <em>Anti-Oedipus</em>. It renounces the polemic with psychoanalysis (Oedipus scarcely appears in the text) in order to undertake a more ambitious task: the elaboration of a positive ontology, a new theory of language, politics, ethics, aesthetics, and subjectivity. The form of the work is unprecedented: it consists of fifteen "plateaus" — relatively autonomous chapters that can be read in any order and that resonate with one another, forming not a linear exposition but a rhizomatic network of mutual references.</p>
<p>The key concepts of the second volume — rhizome, plane of immanence and plane of organization, territorialization/deterritorialization, abstract machine, assemblage, becoming, lines of flight, segmentarity, smooth and striated space, the war machine and the State apparatus — form a conceptual apparatus imposing in its complexity, one which since publication has been taken up and creatively developed by whole generations of researchers across the most varied fields.</p>`

<p>The most fundamental methodological innovation of schizoanalysis can be captured in a single question: instead of asking "what does it mean?" (hermeneutics), schizoanalysis asks "how does it work?" (pragmatics). This change of question entails a transformation of the entire theoretical field.</p>
<p>Hermeneutics — whether in its phenomenological version (Heidegger, Gadamer, Ricoeur) or in its psychoanalytic version (Freud, Lacan) — assumes that behind the manifestation lies a hidden sense, that the surface is a veil over the depths, that the task of thought is interpretation, reading, decipherment. The symptom "means" something — it is an encrypted message the analyst is to decode. The dream "means" something — it is the distorted fulfillment of a repressed wish. The myth "means" something — it is the symbolic transposition of a structural conflict.</p>
<p>Schizoanalysis rejects this paradigm not because it considers it "false" in any simple sense, but because it recognizes in it an operation of power. The question "what does it mean?" presupposes the position of an interpreter — someone who holds the key to the cipher, who knows better than the subject itself what its desire "really" means. The psychoanalyst who tells the patient "your dream about the horse is really about your father" performs an operation that is at once epistemological and political: he subordinates the production of desire to an interpretive code over which he himself exercises control.</p>
<p>The question "how does it work?" changes the perspective radically. Instead of searching for a hidden sense, schizoanalysis investigates real functioning: what connections does a given element generate? What flows does it set in motion? With what other elements does it enter into relations? What effects does it produce? The dream about the horse does not "mean" the father — the horse in the dream functions as a machinic element that connects with other elements (spaces, speeds, intensities), producing determinate effects. The question is: what does this horse do? What becoming does it set in motion? What territories does it trace or efface?</p>
<h4 class="r-h3">4.2. The Kantian Transcendental Critique of Desire</h4>
<p>In her commentaries on <em>Anti-Oedipus</em>, the Polish philosopher Małgorzata Bednarek (whose findings we follow here) aptly pointed to the Kantian dimension of the project of schizoanalysis. Just as Kant in the <em>Critique of Pure Reason</em> asked about the conditions of the possibility of experience — not about what things are in themselves, but about what structures make experience possible at all — so Deleuze and Guattari ask about the conditions of the possibility of desire. They do not ask: what do we desire? (an empirical question), nor: what does desire "mean"? (a hermeneutic question), but: what makes desire possible in the first place? What are the transcendental conditions of the production of desire?</p>
<p>The answer: the condition of desire is its machinic character — the fact that desire is always a connecting of machines, a coupling of flows, a production of the real. There is no "pure," unmediated, spontaneous desire — desire is always already machinic, always already social, always already material. But — and here lies the decisive critical moment — these conditions are transcendental, not empirical, which means that they cannot be identified with any concrete historical form. Oedipus is not the transcendental condition of desire — it is its empirical, historically conditioned form, which capitalism imposes upon desire in order to control it.</p>
<p>This Kantian gesture allows Deleuze and Guattari to criticize psychoanalysis and capitalism at one stroke: psychoanalysis naturalizes Oedipus (presenting it as a universal structure), capitalism produces Oedipus (generating the social conditions in which desire is shut up within the family triangle). Schizoanalysis lays bare this double operation, showing that desire is "before" Oedipus — that its transcendental conditions require neither father nor mother nor castration, but only machines, flows, and connections.</p>
<h4 class="r-h3">4.3. The Unconscious as Factory vs. the Unconscious as Theater</h4>
<p>One of the most suggestive images of <em>Anti-Oedipus</em> is the opposition between two conceptions of the unconscious: the unconscious as factory and the unconscious as theater.</p>
<p><strong>The unconscious-as-theater</strong> is the psychoanalytic conception. In this vision the unconscious is a stage on which the same drama is performed over and over — the Oedipal drama. The actors may change, the costumes may differ, the scenery may shift, but the plot remains the same: the child's desire directed toward the mother, rivalry with the father, the threat of castration, repression. Dream, symptom, slip — all of these are so many stagings of the same script. The analyst's role is to recognize the plot beneath the changing costumes: "ah, so this horse is your father, this cave is your mother."</p>
<p><strong>The unconscious-as-factory</strong> is the conception of schizoanalysis. In this vision the unconscious is not a stage on which something is acted out — it is a production floor on which something is manufactured. The unconscious produces — it produces desire, connections, flows, intensities. It is not a site of representation but a site of production. One does not interpret it — one investigates how it functions.</p>
<p>This opposition has consequences reaching far beyond the field of psychotherapy. If the unconscious is a theater, its content is ultimately private, individual, familial — a matter of the child's relations with its parents. If the unconscious is a factory, its content is directly social, political, cosmic — a matter of relations of forces, of libidinal investments of the social field, of machinic connections with the entire field of reality. Schizoanalysis maintains that Oedipus is not the truth of the unconscious — it is a product of its suppression, the effect of an operation that cuts desire off from its social connections and locks it in the private cell of the family.</p>
<h4 class="r-h3">4.4. Functionalism vs. Structuralism/Semiology</h4>
<p>The passage from the question "what does it mean?" to the question "how does it work?" has its counterpart at the level of general theoretical orientation: the passage from structuralism and semiology to machinic functionalism.</p>
<p>Structuralism and semiology — even in their most refined forms (Lacan, Barthes, the early Derrida) — operate within the linguistic model. Their basic schema is the signifier/signified relation, their basic operation is interpretation, their basic unit is the sign. Even when Lacan introduces the concept of the Real as that which escapes symbolization, this Real is defined negatively — as remainder, as excess, as that which cannot be said. The linguistic model remains dominant.</p>
<p>Deleuze and Guattari propose a radically different model: the machinic model. The basic unit is not the sign but the machine. The basic operation is not meaning (signification) but functioning (fonctionnement). The basic relation is not the signifier/signified relation but the relation of connection and cut (coupure/flux). The machine does not signify — it works. It does not represent — it produces.</p>
<p>This shift has consequences for the way we think about language. For Deleuze and Guattari language is not primarily a system of signs — it is a form of action, a way of intervening in the social field. An utterance is not primarily the description of a state of affairs — it is an act that modifies relations of forces, that territorializes or deterritorializes, that triggers or blocks flows. In <em>A Thousand Plateaus</em> this intuition will be developed into a full theory of linguistic pragmatics (plateau 4: <em>Postulates of Linguistics</em>), in which Deleuze and Guattari, drawing on Austin's theory of speech acts while at the same time going beyond it, show that every utterance is an <em>order-word</em> (mot d'ordre) — a social act that imposes a determinate transformation upon bodies.</p>
<h4 class="r-h3">4.5. Consequences of the Methodological Shift</h4>
<p>The passage from hermeneutics to pragmatics, from theater to factory, from structure to machine sketches out a new field of problems in which the traditional questions of philosophy — the questions of the subject, of sense, of truth — are not so much rejected as reformulated.</p>
<p>The question of the subject no longer runs: "what is the subject?" (an ontological question), nor "how does the subject constitute experience?" (a transcendental question), but: "how is the subject produced?" — by what machines, on what body without organs, in what social field? The subject is not the point of departure — it is a product, an effect, a residue of the process of production.</p>
<p>The question of sense no longer runs: "what does it mean?", but: "how does it function?" — what connections does it generate, what flows does it set in motion, what territories does it trace? Sense is not a hidden content to be extracted from beneath the surface — it is an effect of machinic functioning, an emergent property of the network of connections.</p>
<p>The question of truth no longer runs: "what is true?", but: "what is productive?" — what forms of life does a given arrangement generate? What possibilities does it open, and which does it foreclose? What becomings does it set in motion? The criterion is not the adequacy of representation (correspondence with the "facts") but machinic productivity — the capacity to generate new connections, new forms of existence, new ways of living.</p>
<p>These reformulations — which the subsequent parts of this report will trace and develop systematically — constitute the core of the methodological revolution that schizoanalysis proposes not only to psychiatry and psychology but to philosophy as such. They are an invitation to a thinking that does not interpret the world but takes part in its production.</p>
<p><em>End of Part I. Part II is devoted to a detailed, chapter-by-chapter analysis of the argumentative structure of Anti-Oedipus.</em></p>`

        html: `<p>The first chapter of <em>Anti-Oedipus</em> lays the ontological foundations of Deleuze and Guattari's entire undertaking. It is at the same time the most conceptually dense portion of the book, in which the authors carry out a radical overturning of the understanding of the unconscious, desire, and subjectivity. Instead of treating the unconscious as a theatrical stage on which family dramas are acted out, Deleuze and Guattari propose a model of the unconscious as a factory — a space of ceaseless production in which desiring-machines manufacture reality.</p>
<h4 class="r-h3">5.1 Desiring-Production and the Three Passive Syntheses</h4>
<p>The central axiom of <em>Anti-Oedipus</em> is the claim that "everything is production." The authors reject the traditional division into production, distribution, and consumption as artificial and proper only to capitalist ideology. In the unconscious, production is immediately recording and consumption — these three moments do not follow one another chronologically but coexist as aspects of a single process. This assumption leads to the formulation of the theory of the three passive syntheses of the unconscious, which constitute the core of the first chapter's conceptual apparatus.</p>
<p>The materialist turn accomplished by Deleuze and Guattari consists in replacing the idealist logic of desire-as-lack (from Plato to Freud) with a materialist logic of desire-as-production. In the idealist tradition desire is defined by lack — I desire what I do not have, and desire is therefore secondary to the absence of its object. Deleuze and Guattari invert this relation: desire is a productive force that produces reality (the Real), and lack is a secondary, ideological construct imposed upon desire by social repression. This inversion has fundamental consequences both for the theory of the unconscious and for the understanding of the relation between man and nature. For there is no divide between man and nature, industry and nature, or social production and desiring-production — this identity constitutes one of the most important theses of the entire work, returning in every subsequent chapter.</p>
<p><strong>The connective synthesis — Libido: "and… and then…"</strong></p>
<p>The first synthesis is responsible for the "production of production" and operates according to an associative rule expressed in the formula "and… and then…". Its mechanism consists in coupling organ-machines to source-machines in a series of binary connections. One machine produces a continuous material flow (hylè), and a second machine plugged into it operates as a cut, drawing off a portion of that flow. The paradigmatic example is the breast–mouth pair: the breast-machine emits a flow of milk, the mouth-machine interrupts it and draws it off. The series is linear in every direction — the mouth is in turn plugged into the throat-machine, the latter into the stomach-machine, and so on to infinity. The energy mobilized by this synthesis is Libido, understood not in the narrow Freudian sense but as the energy of production in general.</p>
<p>Crucial here is the concept of the cut-flow. The cut is not opposed to continuity but is its condition — it is a "cut-drawing-off" (prélèvement) that at once continues and interrupts the flow. Desiring-machines function exclusively in a binary regime: there is always a machine plugged into another machine, a flow coupled with a cut. The example of the anorexic illustrates this dynamic well: his mouth oscillates between being an eating-machine, an anal machine, a talking-machine, and a breathing-machine — each cut opens a new flow and a new series of connections.</p>
<p><strong>The disjunctive synthesis — Numen: "either… or… or…"</strong></p>
<p>The second synthesis is responsible for the "production of recording" and is expressed in the formula "either… or… or…", understood, however, not as an exclusive alternative but as a system of permutations. At this moment of the process, production is recorded on the surface of the Body without Organs, which serves as a "magic recording tablet." The energy of Libido is partially transformed into Numen — divine energy, the energy of disjunctive inscription.</p>
<p>On the surface of the BwO the desiring-machines set down their points of disjunction, forming a grid of coordinates that allows intensities to be localized. The disjunctive synthesis does not impose exclusive choices (as Oedipus does: "either father or mother") but affirms all the terms in their intervals. The subject can move between states — be man or woman, living or dead — without being permanently imprisoned in any of them. The case of Judge Schreber is paradigmatic here: his "becoming-woman" is not a delusion about sexual identity in the molar sense, but a passage through a band of intensity on the BwO in which the disjunctions of sex, race, and divinity are inclusive rather than exclusive.</p>
<p><strong>The conjunctive synthesis — Voluptas: "So that's what it was!"</strong></p>
<p>The third synthesis is responsible for the "production of consumption" and is expressed in the exclamation "So that's what it was!" or "So that's me!". This is the moment at which a specific kind of subjectivity emerges out of production and recording. The subject is born as a "residuum" — a remainder left over after the divisions on the surface of recording. The residual energy that animates this synthesis bears the name Voluptas — the pleasure consumed by the subject as it passes through successive intensive states on the BwO.</p>
<p>The conjunctive synthesis consists in the reconciliation of the forces of attraction and repulsion on the BwO. The subject is neither the center of desire nor its cause, but a by-product of the passive syntheses — a "part adjacent" to the machine, not its constructor. In Lacan's terminology, which Deleuze and Guattari creatively commandeer, the subject "is born of division" — a play on words among <em>parere</em> (to bring forth), <em>separare</em> (to separate), and <em>se parere</em> (to engender oneself). But unlike in Lacan, for whom this division is marked by lack and castration, in Deleuze and Guattari it is a source of pleasure (Voluptas) — the positive energy of the consumption of intensities.</p>
<p>Beckett's characters — Murphy, Watt, Mercier, Molloy — serve as models of the nomadic subject, which is merely a transitional state in a series, deprived of fixed identity and family. Similarly, Proust's work is described as a "schizoid machine" in which fragments are joined by transversal lines without forming a harmonious whole, and the subject (the narrator) is a "spider lying in wait for sign-machines."</p>
<p><strong>Partial objects versus global persons</strong></p>
<p>Of fundamental importance here is the distinction between partial objects and global persons. Partial objects (breast, mouth, anus) are not — contrary to the psychoanalytic tradition — fragments of a lost totality, nor parts of "complete persons" (the mother, the father). They are self-standing functional units, molecular elements of desiring-machines, and they lack nothing. Deleuze and Guattari here criticize Melanie Klein, who did discover partial objects but ultimately subjected them to an "Oedipal totalization," treating them as stages leading to the integration of global persons within the "depressive position." Global persons — Mommy, Daddy, Me — are by contrast "molar" entities, produced by social and familial coding. They are simulacra that mask the real molecular work of the desiring-machines.</p>
<h4 class="r-h3">5.2 The Body without Organs</h4>
<p>The concept of the Body without Organs (BwO) is one of the most original and at the same time most difficult concepts of <em>Anti-Oedipus</em>. Borrowed from Antonin Artaud, who postulated a body freed from organic organization, it is transformed by Deleuze and Guattari into a key ontological category.</p>
<p><strong>The BwO as surface of recording and antiproduction</strong></p>
<p>The BwO is not an absence of organs, nor a destruction of the body — this emphasis matters, because the concept is all too often misread as an apology for self-destruction or masochism. It is a "full body" — a sterile, unproductive surface that arises as the third term in the series of production. Its function lies in being the "immobile motor" of desire: it is on the BwO that flows of energy glide in a free state, on it that all the processes of production are recorded. The BwO belongs to the domain of antiproduction, and yet it is paradoxically indispensable to the process of production, for without it production would collapse into limitless dispersion. The BwO gives production a surface on which it can be registered and consumed.</p>
<p><strong>Repulsion and attraction</strong></p>
<p>The relation between the BwO and the desiring-machines is at once conflictual and complementary, oscillating between two poles. In the first moment the BwO repels the desiring-machines — every connection of organs is perceived as "repellent vermin" and "larvae" attempting to intrude upon its indifference. This moment of repulsion produces what the authors call paranoiac machines — the desiring-machines, in their relation of hostility toward the BwO, become an apparatus of persecution.</p>
<p>In the second moment the force of repulsion gives way to the force of attraction. The desiring-machines attach themselves to the BwO "like medals on the uniform of a victor," and the BwO appropriates their power, giving the impression that all production emanates from it as from a "quasi-cause." This moment of attraction produces the miraculating machines (machines à miracles), in which the BwO appears as the miraculous source of all production.</p>
<p><strong>Artaud and the genesis of the concept</strong></p>
<p>Artaud is a key figure for understanding the BwO. His vision of a body that needs no organs and is the enemy of organisms provides Deleuze and Guattari with the model for their conception. The organism is the enemy of the body because it imposes upon the parts a rigid organization, hierarchy, and functionality. The BwO, by contrast, is the body freed from this organization — a pure intensity across which desire can move freely.</p>
<p><strong>The BwO and Capital — the Marxian analogy</strong></p>
<p>One of the most important theoretical operations of the first chapter is the analogy between the BwO and Capital. Deleuze and Guattari compare the relation between desiring-production and the BwO to the relation between the productive forces (labor) and Capital in Marx's analysis. Capital is "the body without organs of the capitalist" — a sterile surface that produces nothing of itself but appropriates the forces of labor, giving the impression that it is Capital that "miraculously" generates surplus value. Just as the BwO attributes to itself the power of the desiring-machines as the quasi-cause of their production, so Capital attributes to itself the power of living labor, making profit appear to emanate from capital itself rather than from the exploitation of labor.</p>
<p>This analogy has far-reaching consequences. First, it anticipates the central theses of chapter three on the civilized capitalist machine, where Capital-Money will be explicitly identified as the third historical form of the socius (the full body). Second, it makes clear why the critique of psychoanalysis and the critique of capitalism are so tightly interwoven in <em>Anti-Oedipus</em>: just as the BwO can become an instance of the repression of desire (repelling the desiring-machines), so Capital as socius is an instance of social repression (subordinating the productive forces to the logic of profit). Third, the analogy reveals a deep homology between the structure of the unconscious and the structure of the social field — the homology that grounds the thesis of the identity of desiring-production and social production.</p>
<h4 class="r-h3">5.3 The Subject and Pleasure</h4>
<p>The third section of chapter one is devoted to the emergence of subjectivity out of the process of desire. It is one of the subtlest analyses in the whole of <em>Anti-Oedipus</em>, in which the authors carry out a radical decentering of the subject.</p>
<p><strong>The nomadic subject as residuum</strong></p>
<p>The subject, as Deleuze and Guattari conceive it, is not a stable identity, not a center of consciousness, not the cause of desire. This constitutes a radical break both with the Cartesian cogito and with the Freudian ego — in both of those traditions the subject is in some sense prior to its experiences, even if it is divided (as in Freud among ego, superego, and id). In Deleuze and Guattari the subject is rather the "residual" effect of the passive syntheses — a residuum left over after the divisions on the surface of the BwO. The nomadic subject does not occupy the center of the circle of production (that place belongs to the machine) but stands at its rim, passing through successive intensive states. It is born of each successive state in the series and is reborn in the next, consuming the states that gave birth to it. It is a being without fixed identity, permanently decentered, derived from the states through which it has passed.</p>
<p><strong>Celibate machines</strong></p>
<p>The third type of machine — after the paranoiac (repulsion) and the miraculating (attraction) — are the celibate machines (machines célibataires). They arise at the moment when the reconciliation of the forces of repulsion and attraction on the BwO produces a new alliance between the desiring-machines and the surface of recording. The task of the celibate machines is to produce intensive quantities in a pure state — pure intensities through which the nomadic subject passes. The term harks back to an artistic tradition (Duchamp, Kafka, Roussel) in which bachelor machines celebrate the autoerotic consumption of intensities instead of serving reproductive ends.</p>
<p><strong>Klossowski/Nietzsche: the subject as a series of intensities</strong></p>
<p>Of fundamental importance for the conception of subjectivity in <em>Anti-Oedipus</em> is Pierre Klossowski's interpretation of Nietzsche, above all in his work <em>Nietzsche and the Vicious Circle</em>. The Nietzschean subject is not a coherent "I" but a "series of individualities" brought about by the oscillations of centrifugal and centripetal forces around an empty center. Nietzsche, in his letters of madness, exclaims: "I am every name in history!" — this is the model of the schizophrenic subject who identifies all the names of history with intensive states on his BwO. The subject-Nietzsche does not "become" Caesar or Dionysus in the sense of being them — it passes through the bands of intensity that these names designate. This conception has fundamental consequences for the understanding of schizophrenic delirium: the schizophrenic who "is Napoleon" does not identify himself with a historical person but experiences the intensity designated by that name. Delirium is thus not an error concerning identity but an experience of pure intensities that precedes any personal identification.</p>
<h4 class="r-h3">5.4 Materialist Psychiatry</h4>
<p>The fourth section of chapter one is the moment at which Deleuze and Guattari carry their theory beyond the frame of the clinic, formulating the project of a materialist psychiatry — a program that will be fully developed in chapter four under the name of schizoanalysis.</p>
<p><strong>Schizophrenia as process versus the hospital schizophrenic</strong></p>
<p>One of the most important distinctions in the whole of <em>Anti-Oedipus</em> is the distinction between schizophrenia as a process and the schizophrenic as a clinical entity. Schizophrenia as process is the fundamental matrix of the unconscious, a positive force of deterritorialization that brings the subject close to "the living, violent center of matter." It is not by nature pathological — it is the model of the functioning of desire as synthesis. The hospital schizophrenic, by contrast, is an "autistic human wreck," the product of psychiatry and of a social repression that has brutally interrupted the natural process of desiring-production. The clinical illness is not the consequence of the schizophrenic process but the result of its interruption, or of its confinement in a void.</p>
<p><strong>The schizophrenic voyage</strong></p>
<p>Following Laing and Cooper of the antipsychiatric current, the authors describe the experience of the schizophrenic process as a "voyage" — an initiatory experience consisting in the loss of the Ego and a passage through successive states of intensity on the BwO. It is a movement "in place," a journey across a scale of intensities, and not necessarily a displacement in physical space. The schizophrenic on his voyage suffers not from an excess of fantasy but from an "excess of reality," which he is forced to process without the shelter of social codes.</p>
<p><strong>Homo natura and Homo historia</strong></p>
<p>The project of a materialist psychiatry rests on a double characterization of the schizophrenic. As Homo natura, the schizophrenic experiences the identity of man and nature in the process of production — he does not perceive nature as a picturesque backdrop but as a machinic process into which he enters with his whole body. Lenz's walk as described by Büchner is the paradigmatic example here: Lenz on his walk is no longer a son or a Christian but becomes a "chlorophyll-machine," joining with the stars and the mountain landscapes. As Homo historia, the schizophrenic feeds on universal history and not merely on family history — he "raves races" and identifies himself with all the names of history.</p>
<p><strong>The project of a materialist psychiatry: desire within production, production within desire</strong></p>
<p>Materialist psychiatry defines itself by a double operation, which at the same time constitutes a theoretical rapprochement between psychoanalysis and Marxism: introducing desire into the social mechanism (showing that the libido directly invests the economic and political field), and bringing the domain of production into desire (treating the unconscious not as a theater of representations but as a factory). Instead of asking "what does it mean?" — which inevitably leads to Oedipus — materialist psychiatry asks "how does it work?" and strives to set the desiring-machines running again.</p>
<p>In this context Deleuze and Guattari enter into dialogue with the key figures of antipsychiatry. They credit R.D. Laing with defining the schizophrenic process as a "voyage" and a <em>breakthrough</em>, not a collapse (<em>breakdown</em>). Yet they criticize him — together with David Cooper — for remaining caught in the trap of the "familial microcosm": antipsychiatry looks for the causes of illness in the pathology of parental relations, which paradoxically keeps it within the orbit of the very familialism it set out to criticize. Materialist psychiatry must break out of this trap, locating the causes of the breakdown of the schizophrenic process not in the family but in social repression, of which the family is merely a delegated agent.</p>
<p>Karl Jaspers, in turn, is credited with viewing the schizophrenic process as an "irruption of the demonic" — with recognizing in it something that radically exceeds the normal "I." But Jaspers fails to see in this process a material economic reality. Artaud, for his part, "tears psychiatry to pieces," because he fulfills the process of literature as a schizophrenic — his work is proof that the schizophrenic process is not a pathology but a form of production. Henry Miller is cited as an author who understands the unconscious as a "curettage" — a process of scraping life clean of myths and ideas, which anticipates the destructive task of schizoanalysis in chapter four.</p>
<h4 class="r-h3">5.5 The Definition of the Machine</h4>
<p>The fifth section of chapter one is devoted to a systematic definition of the concept of the machine, which is crucial for the entire conceptual apparatus of <em>Anti-Oedipus</em>.</p>
<p><strong>Machine versus mechanism versus organism</strong></p>
<p>Deleuze and Guattari carry out a double demarcation of the desiring-machine, setting it apart both from mechanism (the technical machine) and from the organism. The technical machine works and operates only on condition that it is not broken — its limit is wear. The desiring-machine, by contrast, "works only when it breaks down," and by continually breaking down. Failures and short-circuits are not its defects but its conditions of functioning — in it the process of production is ceaselessly grafted onto the product. The organism, in turn, is the enemy of the body, because it imposes upon the parts a rigid organization, subordinating them to hierarchy and purposiveness. The desiring-machine is composed of "really distinct parts" that function together precisely by virtue of the absence of a bond — by virtue of inclusive disjunction.</p>
<p><strong>Machinic vitalism</strong></p>
<p>The authors reject both classical mechanism and classical vitalism. In their place they propose a "machinic vitalism" — a conception in which desire is a machine and the machine is desiring. There is no division here into a spiritual sphere and a mechanical one, into life and machine. Drawing inspiration from Samuel Butler and his <em>Book of the Machines</em>, Deleuze and Guattari break up both the specific unity of life and the specific unity of mechanism in order to reveal their common foundation in machinic desire.</p>
<p>Importantly, the authors also criticize the evolutionary schema of "the tool developing into the machine," arguing that the social machine always precedes the tool and determines which humans and which objects become its parts. Invoking Lewis Mumford's conception, they describe the social machine as a "megamachine" whose component parts are human beings — the example being the Egyptian megamachine of pyramid-building, composed of thousands of human bodies subordinated to a single despotic end. Technical machines are merely indices of social machines, and desiring-machines constitute their molecular base.</p>
<p><strong>The binary cut-flow</strong></p>
<p>The machine is defined above all as a system of cuts upon a continuous material flow. Three kinds of cut correspond to the three syntheses: the cut-drawing-off (production), the cut-detachment (recording), and the cut-remainder (which produces the subject). This definition is fundamentally functional — the machine is determined not by its structure or its form but by the way it cuts and connects flows.</p>
<p><strong>Surplus value of code</strong></p>
<p>The concept of the surplus value of code comes into play when a fragment of one machine's chain of code is captured by another. The paradigmatic example is the relation of the orchid and the wasp: two utterly different beings form a single desiring-machine through an exchange of fragments of code — the orchid captures the wasp's code, the wasp captures the orchid's. This machinic communication produces a surplus — a surplus value that is not economic in the modern sense but qualitative, grounded in the prestige of the code.</p>
<p><strong>Molar versus molecular</strong></p>
<p>The distinction between the molar and the molecular order is one of the most important in the whole of <em>Anti-Oedipus</em> and permeates all the later chapters. Desiring-machines are molecular — they operate at the level of pre-personal singularities, the microphysics of the unconscious. Social and technical machines are molar — they are statistical accumulations of molecular elements subject to the law of large numbers. The two levels coexist and are interconnected, yet they differ in their regime of functioning. Desiring-machines and social machines are "the same machines," but considered at different scales.</p>
<p>The difference is comparable to two ways of looking at a body: with the naked eye we see a molar whole (a person), but under the microscope we perceive a molecular multiplicity of cells and atoms. Drawing on the molecular cybernetics of Wiener and Monod, the authors show that at the microscopic level the functioning and the formation of machines are identical — the desiring-machine is not first constructed and then set running; its constitution is at the same time its functioning. This molar/molecular distinction will become, in chapter four, the foundation of the program of schizoanalysis, which strives to reach beyond the molar illusions of the "I" and the "person" to the molecular productive forces of the unconscious.</p>
<h4 class="r-h3">5.6 The Whole and Its Parts</h4>
<p>The final section of chapter one sums up the mechanics of the desiring-machines and at the same time formulates one of the most important ontological claims of <em>Anti-Oedipus</em>.</p>
<p><strong>The rejection of totalization</strong></p>
<p>Deleuze and Guattari reject every form of totalization — the process by which heterogeneous parts are forced to compose a unified oneness. The whole is not here a superior unity gathering the parts into a totality. It is "produced as an additional part alongside the other parts," not unifying them but adjoining them. Using the example of Proust's work, the authors show that unity arises as a "separately composed fragment," not as a superordinate plan organizing the whole.</p>
<p><strong>Partial objects without lack</strong></p>
<p>The fundamental claim is that partial objects are not marked by lack. Lack is an ideological construct imposed by the ruling class and by psychoanalysis in order to shackle desiring-production. Desiring-production is pure multiplicity (multiplicité) — a category used as a substantive, which abolishes the opposition of "the one and the many." Desire does not strive for the integration of persons or the recovery of a lost totality — it assembles machines out of really distinct elements, bound together solely by an "absence of bond."</p>
<p><strong>The unconscious as orphan, anarchist, atheist</strong></p>
<p>Closing the first chapter, Deleuze and Guattari formulate a threefold characterization of the unconscious, which is at the same time the programmatic credo of the whole of <em>Anti-Oedipus</em>. The unconscious is an "orphan" — it has no parental Oedipal structure, derives from neither father nor mother, but engenders itself in the identity of nature and man. The desiring-machine is a "daughter born without a mother" — yet this image of orphanhood signifies neither deprivation nor solitude; it points to the fact that the unconscious is productive, not reproductive: it does not restage family scenarios but generates new connections.</p>
<p>It is an "anarchist" — it functions outside the law, outside castration and every normative order. It acknowledges neither hierarchy nor authority; it does not submit to the symbolic law of the Father or to the commands of the superego. Its "anarchism" is not a political program but a description of a mode of functioning: desiring-machines connect and disconnect according to an immanent logic, without any external lawgiver.</p>
<p>It is an "atheist" — it acknowledges no transcendent signifier, no deity, no phallus as superordinate organizer. There is no "big Other" in Lacan's sense that would confer structure upon the unconscious from a transcendent position. This triple characterization is a direct counterargument to the psychoanalytic vision of the unconscious as organized around the Oedipal triangle, castration, and the law of the father — and at the same time an announcement of the destructive task of schizoanalysis, which will consist in restoring to the unconscious its orphan, anarchist, and atheist character.</p>`

        html: `<p>The second chapter of <em>Anti-Oedipus</em>, entitled "Psychoanalysis and Familialism: The Holy Family," is a systematic critique of psychoanalysis as an institution and as a method. The authors analyze how psychoanalysis distorts the three passive syntheses of the unconscious, transforming the unconscious from a factory into a theater. This chapter is at once the most polemical and the most systematic in the whole book.</p>
<h4 class="r-h3">6.1 The Imperialism of Oedipus</h4>
<p>The notion of the "imperialism of Oedipus" describes the process by which psychoanalysis imposes the figure of the family triangle (daddy–mommy–me) as the sole measure of the unconscious. Oedipus is treated as the "nuclear complex" that is supposed to explain everything — from a child's games to the hallucinations of the psychotic.</p>
<p><strong>The family triangle as an "intimate colonial formation"</strong></p>
<p>Chapter two is at once the most extensive portion of <em>Anti-Oedipus</em> and its polemical center. It consists of nine sections that systematically take apart every element of the Oedipal apparatus. The most important political metaphor of this chapter is the description of Oedipus as an "intimate colonial formation." Just as external colonies are exploited by the empire for their resources, so the "internal colony" of the Oedipal unconscious is used for the exploitation and subjugation of the individual's desiring-production. Oedipus hems desire in, forcing it to express itself exclusively in familial terms. Instead of the free play of desiring-machines, we are given "a dreary and monotonous play of representation."</p>
<p><strong>The factory becomes a theater</strong></p>
<p>Deleuze and Guattari argue that Freud's true discovery was the productive unconscious — the factory in which the hum of the desiring-machines can be heard. Yet Freud, alarmed by the revolutionary potential of his discovery, retreated and replaced the factory with a theater. The psychoanalyst ceased to be an "engineer" of machines and became the "director of a private theater." An expressive unconscious — capable only of "expressing itself" in myths and tragedies — took the place of the productive unconscious.</p>
<p><strong>Desire is social, not familial</strong></p>
<p>The fundamental thesis of chapter two is the claim that "there is only desire and the social, and nothing else." The libido needs no familial mediation in order to invest the productive forces or the relations of production. Desire is from the outset political, economic, and historical. The operation of application (rabattement) consists in "folding" the broad social field down onto the small "target set" that is the family — with the result that the boss, the teacher, or the soldier are interpreted merely as "parental images."</p>
<h4 class="r-h3">6.2 Three Texts by Freud</h4>
<p>Deleuze and Guattari analyze three key texts by Freud in order to demonstrate the process of the "betrayal" of the productive unconscious.</p>
<p><strong>The case of Judge Schreber (1911)</strong> — Freud reduced Schreber's rich, cosmic, politico-historical delirium exclusively to the "paternal theme." He ignored the fact that Schreber's father was the inventor of sadistic-paranoiac orthopedic machines that communicated directly with the judge's desiring-machines. Instead of seeing in the madness an investment of the social field (races, religions, nations), Freud reduced everything to repressed homosexuality directed at the doctor as a father-substitute.</p>
<p><strong>"A Child Is Being Beaten" (1919)</strong> — Freud reduced the group nature of the fantasy (children being beaten by a teacher) to an individual and Oedipal dimension. He introduced the notion of lack and castration as the "common measure" of both sexes, which forces the exclusive disjunction "either boy or girl."</p>
<p><strong>"Analysis Terminable and Interminable" (1937)</strong> — Freud's "testament," in which he perceives that the process of treatment is becoming interminable. He interprets this, however, as an obstacle arising from the "bedrock" of castration. Deleuze and Guattari argue that this "rock" is not a discovery but an effect of the psychoanalytic method itself, which castrates desire by imposing the Oedipal frame upon it.</p>
<p>Taken together, these three texts illustrate the "discovery and betrayal" of the productive unconscious — Freud discovered the desiring-machines (Irma's injection, the ticking machine of the Wolf-Man, Anna O.'s coughing machine), but took fright at his discovery and withdrew toward the classical theater of representations. Freud's self-censorship consisted in fleeing the world of untamed production for the classical order of Greek tragedy, so as to impose order upon "explosive desire." He became the "director of a private theater" instead of remaining an "engineer" of machines.</p>
<p>The clinical cases illustrate this process in the starkest terms. Little Hans exemplifies the passage from real seduction and social pressure to an internal sense of guilt — Freud absolved parental authority, making the child guilty of its own fantasies. The Wolf-Man reveals how Freud ignored the patient's inclination to "debase" women (an investment of another social class — the servants), reducing everything to substitutes for the sister and the mother. Judge Schreber, whose libido invests "universal History" (races, continents), is cut off by Freud from social reality and shut up in the triangle "daddy–mommy–me."</p>
<h4 class="r-h3">6.3 The Three Syntheses: Legitimate and Illegitimate Uses</h4>
<p>The central theoretical achievement of chapter two is the systematic distinction between the legitimate (immanent, transcendental) and the illegitimate (transcendent) uses of each of the three passive syntheses. Deleuze and Guattari here explicitly invoke Kant's critical revolution, transposing it onto the terrain of the unconscious.</p>
<p><strong>The connective synthesis: partial/nonspecific versus global/specific — the paralogism of extrapolation</strong></p>
<p>In its legitimate use the connective synthesis is partial and nonspecific — it connects partial objects with impersonal, polyvocal flows without assigning them a fixed meaning or a global subject. It follows the logic of "and-and-and," where connections are made without exclusion. In its illegitimate use the synthesis becomes global and specific — the "and… and then…" of production is replaced by the "aha! so it was my father/my mother" of representation. Psychoanalysis extrapolates the partial object (the penis) into a "complete detached object" — the Phallus as transcendent signifier, which introduces lack into desire.</p>
<p><strong>The disjunctive synthesis: inclusive versus exclusive — the double-bind paralogism</strong></p>
<p>In its legitimate use the disjunctive synthesis is inclusive and unlimitative — it rests on the logic of "either… or… or…," in which all the terms are affirmed in their intervals. The schizophrenic wields inclusive disjunctions: the names of history are not persons but states of intensity on the BwO. In its illegitimate use the synthesis becomes exclusive and limitative — it imposes the logic of "either/or," forcing a choice between non-exchangeable terms. Oedipus works like a pair of pincers: the subject is given the choice between a "normal" internalization of authority and a neurotic identification — both lead back to Oedipus. This is the paralogism of the double bind in Bateson's sense.</p>
<p><strong>The conjunctive synthesis: nomadic versus segregative — the paralogism of application (rabattement)</strong></p>
<p>In its legitimate use the conjunctive synthesis is nomadic and polyvocal — the nomadic subject wanders across the BwO, identifying with bands of intensity rather than with fixed persons. It can cry out: "I am every race, every name in history!" In its illegitimate use the synthesis becomes segregative and biunivocal — it consists in pinning the subject to a fixed identity within a molar social order: "I am one of you," "I belong to the superior race." The paralogism of application (rabattement) consists in "folding" the infinite socio-historical field down onto the small, finite family triangle.</p>
<p><strong>Comparative table of the three syntheses</strong></p>
<div class="r-table"><table><tr><td>Synthesis</td><td>Energy</td><td>Legitimate use</td><td>Illegitimate use</td><td>Paralogism</td></tr><tr><td>Connective (of Production)</td><td>Libido</td><td>Partial and nonspecific</td><td>Global and specific</td><td>Extrapolation</td></tr><tr><td>Disjunctive (of Recording)</td><td>Numen</td><td>Inclusive and unlimitative</td><td>Exclusive and limitative</td><td>Double Bind</td></tr><tr><td>Conjunctive (of Consumption)</td><td>Voluptas</td><td>Nomadic and polyvocal</td><td>Segregative and biunivocal</td><td>Application</td></tr></table></div>
<p>The illegitimate uses of the syntheses form the so-called "3 + 1" formula, in which the three stands for father, mother, and child, and the one is the transcendent Phallus as the formal principle of triangulation. The three paralogisms operate together systematically: extrapolation produces lack (the Phallus as transcendent signifier), the double bind locks the subject in a trap with no exit (every path leads to Oedipus), and application "folds" the entire social field onto the family triangle. Together they constitute the machine of oedipalization — the apparatus that transforms the productive unconscious into an expressive unconscious, the factory into a theater.</p>
<p>Deleuze and Guattari stress that this process is not an accidental error of psychoanalysis but its systematic function within capitalism. Psychoanalysis introduces the ideology of lack where desire is the fullness of production. Instead of asking "how does it work?", it asks "what does it mean?", imposing exegesis in place of engineering. Analysis becomes a form of "interpretation terrorism," in which the analyst shouts: "Answer 'daddy and mommy' when I speak to you!" — which effectively "castrates" the productive unconscious, imprisoning it in the monotonous play of the signifier.</p>
<h4 class="r-h3">6.4 Social Repression and Psychic Repression</h4>
<p>Sections seven and eight of chapter two are devoted to the relation between social repression and psychic repression, and to the redefinition of neurosis and psychosis. They form the bridge between the critique of psychoanalysis (sections 1–6) and the historico-political analysis (chapter 3), joining the clinical problematic to the problematic of power.</p>
<p><strong>The distinction between social repression and psychic repression (following Reich)</strong></p>
<p>Following in the footsteps of Wilhelm Reich, whom they praise for posing the question "why do people fight for their own servitude?" and for counting desire as part of the economic base (rather than of ideology), Deleuze and Guattari introduce the crucial distinction between social repression (répression) and psychic repression (refoulement). Social repression is a conscious, external operation exercised by the social machine — the state, the police apparatus, the educational system — upon desire. Psychic repression is an unconscious operation taking place inside the psychic apparatus. The key thesis runs: psychic repression depends entirely on social repression and cannot be explained in purely psychic terms.</p>
<p><strong>The family as the "delegated agent" of psychic repression</strong></p>
<p>The family is not the cause of psychic repression but the agent "delegated" by social production to carry it out. The repressive social formation delegates its power to the family, which in turn replaces real desiring-production with a falsified and displaced image of it — with incestuous drives (Oedipus). The purpose of this maneuver is precise: psychic repression serves to make social repression cease to be perceived and become desired. Oedipus is the "bait" in which desire lets itself be caught, allowing society to master its revolutionary power.</p>
<p><strong>The role of antiproduction</strong></p>
<p>The BwO serves as the instance of antiproduction in this process. By repelling the desiring-machines (primal repression), it creates a taut surface on which social repression can settle and be converted into secondary repression. The mechanism operates on two levels at once — the molecular (desiring-machines) and the molar (the social machine) — and it is precisely this double action that secures its effectiveness.</p>
<h4 class="r-h3">6.5 Neurosis and Psychosis: A Redefinition</h4>
<p><strong>The critique of Freud and Lacan</strong></p>
<p>Deleuze and Guattari radically redefine neurosis and psychosis in opposition to the psychoanalytic tradition. Freud distinguished neurosis (in which the ego yields to reality and represses the id) from psychosis (in which the ego yields to the id and breaks with reality). For the authors this distinction is illusory, since both states are effects of the same process — desiring-production. Lacan is criticized because his disciples re-enclosed psychosis within the Oedipal frame through the notion of the "foreclosure" (forclusion) of the name of the father — the schizophrenic does not suffer from the lack of a symbolic father, but from the oedipalization that is forcibly imposed upon him.</p>
<p><strong>Neuroticization versus schizophrenization</strong></p>
<p>Neurosis is the outcome of a successful "neuroticization" — the cramming of desire into the Oedipal triangle and the territoriality of the analyst's couch. The neurotic is "cured" in the sense of having accepted the Oedipal frame and guilt as the norm. Psychosis appears when the subject resists oedipalization — if the process of deterritorialization is brutally interrupted, the psychotic "withdraws" onto the BwO, which can lead to catatonia.</p>
<p>Schizoanalysis proposes the opposite movement: instead of neuroticizing (oedipalizing) the psychotic, one must "schizophrenize" the field of analysis — free desire from the paranoiac structures of state and family. The point is not to induce the clinical illness but to liberate the schizophrenic process, which is a positive creative force. The great artist, according to Deleuze and Guattari, is the one who passes through the "schizophrenic wall" — style is not a form of expression but a force that bursts language open from within. Lines of flight are not a withdrawal but the creative act of "making a way out" for the whole system.</p>
<p><strong>The two poles of investment</strong></p>
<p>Investments of desire in the social field can have two poles. The paranoiac-reactionary pole invests molar structures — the nation, the superior race, the State apparatus. It supports the central sovereign formations, strives for territorialization, and clamps desire into codes. The schizo-revolutionary pole follows lines of flight, decodes flows, and strives for absolute deterritorialization. This distinction does not coincide with the distinction between right and left — a group that is revolutionary at the level of class interest can be paranoiac and reactionary at the level of desire (like the Stalinist bureaucracy).</p>
<h4 class="r-h3">6.6 The Process</h4>
<p>The final section of chapter two is the culmination of the argument, redefining schizophrenia from a clinical entity into a universal ontological and historical process.</p>
<p><strong>Breakthrough versus breakdown</strong></p>
<p>This distinction, borrowed from the antipsychiatric current (Laing, Cooper), is crucial. The breakthrough is the positive process of deterritorialization — an "initiatory voyage" and a transcendental experience that shatters the normal "I." The breakdown is clinical schizophrenia — the "autistic wreck" produced by hospitals and oedipalization. The clinical illness is not the consequence of the process but the result of its interruption, or of its confinement in a void by the system of repression. The process becomes pathological only when it is brutally interrupted or when it is made into an ultimate goal.</p>
<p><strong>The identity of nature, industry, and history</strong></p>
<p>The process carries within it the identity of three domains traditionally kept apart: nature (Homo natura), industry (production as such), and history (Homo historia). Man and nature are not opposed terms but one and the same reality of production. The schizophrenic is the "eternal servant of the machines of the world," experiencing this identity directly and without mediation.</p>
<p><strong>The Eternal Return as the return of deterritorialization</strong></p>
<p>Deleuze and Guattari reinterpret the Nietzschean Eternal Return not as the return of the same but as the eternal return of the process of deterritorialization. It is the experience of passing from the model of death to the experience of life in each cycle of desire. The Eternal Return affirms the process itself — a continual becoming that strives toward no terminus but contains its own fulfillment within itself.</p>`
