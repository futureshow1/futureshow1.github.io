<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szukaj w całym FutureShow — filmy, płyty, słuchowiska, projekty</title>
<meta name="description" content="Jedna wyszukiwarka po wszystkich portalach futureshow.pl: 2 800 filmów, nagrań i płyt z Kina niemego, Historii animacji, Kina awangardy, Dobranocek, Słuchowisk i Polskiego Jazzu oraz wszystkie projekty studia.">
<link rel="canonical" href="https://futureshow.pl/szukaj/">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png"><link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:title" content="Szukaj w całym FutureShow"><meta property="og:description" content="2 800 filmów, nagrań i płyt oraz wszystkie projekty studia w jednej wyszukiwarce."><meta property="og:url" content="https://futureshow.pl/szukaj/"><meta property="og:image" content="https://futureshow.pl/og-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="../pagefind/pagefind-ui.css" rel="stylesheet">
<style>
:root{--bg:#05070c;--bg2:#0a0e17;--ink:#e9edf5;--dim:#aab4c6;--faint:#7a8499;--cyan:#6fd6ff;--line:rgba(233,237,245,.1);
  --sans:'Inter','Helvetica Neue',sans-serif;--mono:'JetBrains Mono',monospace;
  --pagefind-ui-scale:.9;--pagefind-ui-primary:var(--cyan);--pagefind-ui-text:var(--ink);--pagefind-ui-background:var(--bg2);--pagefind-ui-border:var(--line);--pagefind-ui-tag:#141a26;--pagefind-ui-border-width:1px;--pagefind-ui-border-radius:10px;--pagefind-ui-image-border-radius:6px;--pagefind-ui-image-box-ratio:16/9;--pagefind-ui-font:var(--sans)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;gap:18px;padding:16px 4vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,7,12,.9);backdrop-filter:blur(12px);z-index:5}
.logo{font-weight:800;font-size:19px;letter-spacing:.04em}.logo span{color:var(--cyan)}
.logo-desc{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-left:10px}
.spacer{flex:1}
.langbtn{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.langbtn:hover{border-color:var(--cyan)}
main{max-width:980px;margin:0 auto;padding:40px 4vw 80px}
h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.lede{color:var(--dim);margin:12px 0 28px;max-width:720px;line-height:1.55;font-size:15px}
.scope{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.scope a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}
.scope a:hover{border-color:var(--cyan);color:var(--ink)}
.pagefind-ui__search-input{background:#0d1320!important;border-color:var(--line)!important;color:var(--ink)!important;font-weight:500!important}
.pagefind-ui__search-input::placeholder{color:var(--faint)}
.pagefind-ui__search-clear{background:transparent!important;color:var(--dim)!important}
.pagefind-ui__result{border-color:var(--line)!important;padding:18px 0!important}
.pagefind-ui__result-link{color:var(--ink)!important;font-weight:700!important}
.pagefind-ui__result-link:hover{color:var(--cyan)!important}
.pagefind-ui__result-excerpt{color:var(--dim)!important;font-size:13.5px!important}
.pagefind-ui__result-tag{background:#141a26!important;color:var(--dim)!important;font-family:var(--mono);font-size:11px!important;border-radius:999px!important;padding:3px 9px!important}
.pagefind-ui__filter-name{color:var(--ink)!important;font-weight:600}
.pagefind-ui__filter-label,.pagefind-ui__filter-value{color:var(--dim)!important}
.pagefind-ui__message{color:var(--dim)!important;font-family:var(--mono);font-size:12px!important}
.pagefind-ui__button{background:transparent!important;color:var(--ink)!important;border-color:var(--line)!important}
.pagefind-ui__button:hover{border-color:var(--cyan)!important}
.pagefind-ui__result-thumb{background:#0d1320;border-radius:6px}
mark{background:rgba(111,214,255,.25);color:var(--ink);border-radius:3px;padding:0 2px}
footer{color:var(--faint);font-family:var(--mono);font-size:11px;text-align:center;padding:30px 4vw;border-top:1px solid var(--line)}
footer a{color:var(--dim)}
</style>
</head>
<body>
<nav><a class="logo" href="../">FUTURE<span>SHOW</span></a><span class="logo-desc" data-i="desc"></span><div class="spacer"></div><button class="langbtn" id="langbtn">EN</button></nav>
<main>
  <h1 data-i="h1"></h1>
  <p class="lede" data-i="lede"></p>
  <div class="scope" id="scope"></div>
  <div id="search"></div>
</main>
<footer><span data-i="foot"></span> · <a href="../" data-i="back"></a></footer>
<script src="../pagefind/pagefind-ui.js"></script>
<script>
const UI={
 pl:{desc:"szukaj w całym streamie",h1:"Szukaj w całym FutureShow",
  lede:"Jedno pole, wszystkie portale: 2 800 filmów, odcinków, słuchowisk i płyt z sześciu portali streamingowych oraz wszystkie projekty studia. Wpisz tytuł, nazwisko twórcy, rok, rozdział albo kraj.",
  ph:"np. Chaplin, Reksio, Komeda, Starewicz, 1928, Czechosłowacja…",
  zero:"Brak wyników dla „[SEARCH_TERM]”. Spróbuj krócej albo po angielsku: tytuły zagraniczne są często w oryginale.",
  many:"[COUNT] wyników dla „[SEARCH_TERM]”",one:"1 wynik dla „[SEARCH_TERM]”",alt:"Wyniki",
  more:"Pokaż więcej",searching:"Szukam „[SEARCH_TERM]”…",clear:"Wyczyść",filters:"Filtry",
  foot:"Wyszukiwarka działa w Twojej przeglądarce (Pagefind). Nic nie wysyłamy na serwer, nie zapisujemy zapytań.",back:"← futureshow.pl",
  scope:[["Kino nieme","../kino-nieme/"],["Historia animacji","../historia-animacji/"],["Kino awangardy","../kino-awangardy/"],["Dobranocki","../dobranocki/"],["Słuchowiska","../sluchowiska/"],["Polski Jazz","../polski-jazz/"],["Projekty","../"]]},
 en:{desc:"search the whole stream",h1:"Search all of FutureShow",
  lede:"One box, every portal: 2,800 films, episodes, audio stories and records from six streaming portals plus all studio projects. Type a title, a creator, a year, a chapter or a country.",
  ph:"e.g. Chaplin, Keaton, Komeda, Starewicz, 1928, Czechoslovakia…",
  zero:"No results for “[SEARCH_TERM]”. Try a shorter term or the original title.",
  many:"[COUNT] results for “[SEARCH_TERM]”",one:"1 result for “[SEARCH_TERM]”",alt:"Results",
  more:"Load more",searching:"Searching “[SEARCH_TERM]”…",clear:"Clear",filters:"Filters",
  foot:"Search runs in your browser (Pagefind). Nothing is sent to a server and no queries are stored.",back:"← futureshow.pl/en/",
  scope:[["Silent Cinema","../kino-nieme/en/"],["Animation: A History","../historia-animacji/en/"],["Avant-garde Cinema","../kino-awangardy/en/"],["Bedtime Legends","../dobranocki/en/"],["Audio stories","../sluchowiska/en/"],["Polish Jazz","../polski-jazz/?lang=en"],["Projects","../en/"]]}
};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LANG=(new URLSearchParams(location.search).get("lang"))||store.get("fs-lang")||store.get("lang")||"pl"; if(LANG!=="en")LANG="pl";
let ui=null;
function render(){
 const t=UI[LANG]; document.documentElement.lang=LANG;
 document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t[el.dataset.i]||"");
 document.getElementById("langbtn").textContent=LANG==="pl"?"EN":"PL";
 document.getElementById("scope").innerHTML=t.scope.map(([n,u])=>`<a href="${u}">${n} →</a>`).join("");
 document.getElementById("search").innerHTML="";
 ui=new PagefindUI({element:"#search",bundlePath:"../pagefind/",showSubResults:false,showImages:true,pageSize:20,excerptLength:24,autofocus:true,
  translations:{placeholder:t.ph,clear_search:t.clear,load_more:t.more,search_label:t.h1,filters_label:t.filters,zero_results:t.zero,many_results:t.many,one_result:t.one,alt_search:t.alt,search_suggestion:"",searching:t.searching},
  processResult:r=>{ const m=r.meta||{}; if(LANG==="en"&&m.url_en) r.url=m.url_en; const tag=[LANG==="en"?m.portal_en:m.portal,m.section,m.creator,m.year].filter(Boolean).join(" · "); r.excerpt=`<span class="pagefind-ui__result-tag">${tag}</span><br>`+r.excerpt; r.meta={title:m.title}; if(m.image) r.meta.image=m.image; return r; }});
 const q=new URLSearchParams(location.search).get("q"); if(q) ui.triggerSearch(q);
}
document.getElementById("langbtn").onclick=()=>{LANG=LANG==="pl"?"en":"pl";store.set("fs-lang",LANG);store.set("lang",LANG);render();};
render();
</script>
<script data-goatcounter="https://futureshow.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
